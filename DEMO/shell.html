<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>REVIVAL / FLOOD</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; color: #ccc;
                   font: 14px/1.3 sans-serif; height: 100%; overflow: hidden; }
      /* Center canvas inside the viewport. Black surroundings show as
         letterbox bars whenever canvas AR != viewport AR. */
      body { display: flex; align-items: center; justify-content: center; }
      #status { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px;
                background: rgba(0,0,0,0.6); font-size: 12px;
                pointer-events: none; }
      #status.hidden { display: none; }
      /* Canvas backing-store dims now equal the engine surface dims
         (AR-clamped, /8-snapped) — V_Flip's RenderCopy is a 1:1 memcpy
         instead of a scale-blit, and the bars come from CSS. width/height
         auto + max-width/height let the browser preserve AR while fitting
         the viewport. */
      canvas { background: #000; display: block; image-rendering: pixelated;
               width: auto; height: auto;
               max-width: 100vw; max-height: 100vh; }
      /* Bottom-right control bar: mute / HiDPI / fullscreen. Stays on top
         of the canvas (z-index) and ignores its own click events from
         reaching the demo (each button only flips its own state). */
      #controls { position: fixed; bottom: 12px; right: 12px; display: flex;
                  gap: 6px; z-index: 100; }
      #controls button { background: rgba(0,0,0,0.6); color: #fff;
                         border: 1px solid rgba(255,255,255,0.3);
                         border-radius: 4px; padding: 8px 12px;
                         font: 16px/1 sans-serif; cursor: pointer;
                         min-width: 44px; min-height: 44px;
                         user-select: none; -webkit-tap-highlight-color: transparent; }
      #controls button:hover { background: rgba(0,0,0,0.85); }
      #controls button:active { background: rgba(255,255,255,0.2); }
      /* Auto-hide: fade out after a few seconds of mouse inactivity, fade
         back in when the cursor approaches the bottom of the viewport. */
      #controls { transition: opacity 0.25s ease-out; }
      #controls.idle { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Diagnostic-log capture. We also keep a buffered copy of every
         [coop-diag] / [audio-diag] line so we can dump them into the
         on-screen error panel when the demo can't start (mostly so
         Firefox Mobile users — who can't readily inspect the JS console
         — can copy useful info out of the page itself). Captures
         console.log + console.error output that starts with one of our
         tag prefixes. -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var diagLog = [];
        window.__diagLog = diagLog;
        function tagged(args) {
          var s = '';
          for (var i = 0; i < args.length; ++i) {
            s += (i ? ' ' : '') + args[i];
          }
          return /^\[(coop|audio)-diag\]/.test(s) ? s : null;
        }
        var origLog = console.log.bind(console);
        var origErr = console.error.bind(console);
        console.log = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origLog.apply(null, arguments);
        };
        console.error = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origErr.apply(null, arguments);
        };

        function snap(label) {
          if (navigator.serviceWorker) {
            try {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                console.log('[coop-diag] ' + label + ' regs=' + regs.length +
                  regs.map(function(r){
                    return ' [scope=' + r.scope +
                      ' active=' + !!r.active +
                      ' installing=' + !!r.installing +
                      ' waiting=' + !!r.waiting + ']';
                  }).join(''));
              });
            } catch (e) {
              console.log('[coop-diag] ' + label + ' getRegistrations err: ' + e.message);
            }
          }
          console.log('[coop-diag] ' + label +
            ' isSecureContext=' + window.isSecureContext +
            ' crossOriginIsolated=' + window.crossOriginIsolated +
            ' UA=' + navigator.userAgent.slice(0, 80) +
            ' hasNetscape=' + (typeof netscape !== 'undefined') +
            ' hasChrome=' + (typeof chrome !== 'undefined') +
            ' SW=' + !!navigator.serviceWorker +
            ' SWController=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) +
            ' SAB=' + (typeof SharedArrayBuffer !== 'undefined') +
            ' sessionStorage=' + (function(){try{window.sessionStorage.length;return 'ok';}catch(e){return 'blocked:'+e.message;}})()
          );
        }
        snap('initial');
        setTimeout(function(){ snap('+1s'); }, 1000);
        setTimeout(function(){ snap('+3s'); }, 3000);
      })();
    </script>
    <!-- Browser-specific coi-serviceworker config. Firefox Android (UA
         contains "Android" + "Firefox") has been observed not isolating
         the top-level document under COEP credentialless even with
         coi-serviceworker active and the SW controlling the page
         (crossOriginIsolated=false despite SWController=true). Forcing
         require-corp seems to fix it; same-origin assets get an explicit
         CORP from the SW so require-corp's stricter rules are satisfied. -->
    <script>
      var ua = navigator.userAgent || '';
      if (ua.indexOf('Android') >= 0 && ua.indexOf('Firefox') >= 0) {
        window.coi = window.coi || {};
        window.coi.coepCredentialless = function() { return false; };
        console.log('[coop-diag] FF Android detected; forcing require-corp');
      }
    </script>
    <!-- coi-serviceworker injects COOP/COEP headers so SharedArrayBuffer
         (required for our pthread build) works on hosts like GitHub Pages
         that don't support custom HTTP headers. No-op on emrun, which
         already sets the headers itself. -->
    <script src="coi-serviceworker.js"></script>
    <script>
      // Friendly error if cross-origin isolation never activates.
      // Includes the captured [coop-diag] / [audio-diag] log so people
      // diagnosing on a phone (or anyone without a JS console handy)
      // can copy actionable info straight out of the page.
      (function() {
        if (typeof window === 'undefined') return;
        setTimeout(function() {
          if (window.crossOriginIsolated) return;
          var msg = (
            "Couldn't enable cross-origin isolation in this browser. " +
            "REVIVAL needs SharedArrayBuffer to run its render workers. " +
            "Common causes:\n\n" +
            "  - Private / incognito browsing (Firefox disables service workers there)\n" +
            "  - Outdated browser (need Chrome 92+, Firefox 79+, Safari 15.2+)\n" +
            "  - Some Firefox Mobile setups\n\n" +
            "Try a regular (non-private) tab in an up-to-date Chrome or Firefox."
          );
          var diag = (window.__diagLog || []).join('\n');
          var div = document.createElement('div');
          div.style.cssText =
            'position:fixed;inset:0;background:#000;color:#ccc;' +
            'font:14px/1.4 sans-serif;padding:2em;white-space:pre-wrap;' +
            'z-index:99999;overflow:auto;';
          div.textContent = msg + '\n\n--- diagnostic log ---\n' + diag;
          document.body.appendChild(div);
          console.error(msg);
        }, 4000);
      })();
    </script>
    <div id="status">Downloading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="controls">
      <button id="btn-mute" title="Mute / unmute audio" aria-label="Mute">🔊</button>
      <button id="btn-hidpi" title="Toggle high-DPI rendering" aria-label="HiDPI">SD</button>
      <button id="btn-fullscreen" title="Toggle fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
    <script>
      var statusEl = document.getElementById('status');
      var canvasEl = document.getElementById('canvas');
      function setStatus(text) {
        if (!text) { statusEl.classList.add('hidden'); return; }
        statusEl.classList.remove('hidden');
        statusEl.textContent = text;
      }
      // ?editor in the URL → surface-editor mode. Read in C++ (DemoBoot) to
      // boot greets-only/mirror-off, and here to show the surface panel.
      var revEditorMode = /[?&]editor\b/.test(location.search);
      // ?scene=<name> picks the edited scene (default greets). The C++ side
      // parses the same token (MainLoop's editor scene registry); here it
      // selects the live-fetch paths + the save API route.
      var revEditorScene = (location.search.match(/[?&]scene=(\w+)/) || [])[1] || 'greets';
      var revEditorFLD = 'SCENES/' + revEditorScene.toUpperCase() + '.FLD';
      var revEditorMAT = 'SCENES/' + revEditorScene.toUpperCase() + '.MAT';
      var Module = {
        canvas: canvasEl,
        setStatus: setStatus,
        revEditorMode: revEditorMode ? 1 : 0,
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left
            ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : '');
        },
        // Flip the guard once main() returns so late-firing DOM events
        // (resize, mousemove, fullscreenchange) can't call into a torn-down
        // wasm runtime — that path used to throw "called after runtime
        // exit" assertions in the console.
        onExit: function() { runtimeExited = true; },
        // Once wasm exports are ready, re-apply the HD/SD font scale
        // (the boot-time applyHidpi() ran before _SDL2_SetFontScale
        // existed). Same for ?hidpi=1 in the URL.
        onRuntimeInitialized: function() {
          if (typeof applyHidpi === 'function') applyHidpi();
          if (revEditorMode && typeof initEditorPanel === 'function') initEditorPanel();
        }
      };

      // Editor: fetch the LIVE scene data from the dev server (tools/
      // editor_server.py serves Runtime/ at these paths) — the copies inside
      // DEMO.data were baked at link time, so after a "Save" regenerates them,
      // a plain browser reload + these fetches pick them up without relinking:
      //   SCENES/GREETS.FLD   the scene (numeric material values)
      //   SCENES/GREETS.MAT   the PBR-map sidecar (surface|role|path lines)
      //   TEXTURES/PBR/*      every map the sidecar references
      // editorTick (MainLoop.cpp) waits for editorFldReady, installs
      // editorFreshFiles into MEMFS, then starts scene init. -1 (fetch failed /
      // static hosting without the server) falls back to the baked copies.
      if (revEditorMode) {
        Module.editorFldReady = 0;
        Module.editorFreshFiles = [];   // [{path:'/SCENES/...', data:Uint8Array}]
        (function(){
          var bust = '?ts=' + Date.now();
          function grab(rel){
            return fetch(rel + bust, { cache: 'no-store' })
              .then(function(r){ if (!r.ok) throw new Error(rel + ': ' + r.status); return r.arrayBuffer(); })
              .then(function(b){ Module.editorFreshFiles.push({ path: '/' + rel, data: new Uint8Array(b) }); });
          }
          grab(revEditorFLD)
            .then(function(){
              // Sidecar is optional (404 = no persisted maps yet).
              return fetch(revEditorMAT + bust, { cache: 'no-store' })
                .then(function(r){ return r.ok ? r.arrayBuffer() : null; })
                .catch(function(){ return null; });
            })
            .then(function(matBuf){
              if (!matBuf) return [];
              Module.editorFreshFiles.push({ path: '/' + revEditorMAT, data: new Uint8Array(matBuf) });
              var text = new TextDecoder().decode(matBuf);
              var maps = [];
              text.split('\n').forEach(function(line){
                line = line.trim();
                if (!line || line[0] === '#') return;
                var parts = line.split('|');
                if (parts.length === 3 && maps.indexOf(parts[2]) < 0) maps.push(parts[2]);
              });
              return Promise.all(maps.map(function(rel){
                return grab(rel).catch(function(e){ console.warn('[editor] sidecar map fetch failed:', e); });
              }));
            })
            .then(function(){ Module.editorFldReady = 1; })
            .catch(function(e){
              console.warn('[editor] live scene fetch failed (using baked copies):', e);
              Module.editorFldReady = -1;
            });
        })();
      }

      // ---- Audio: AudioWorklet pump ---------------------------------
      // Replaces SDL2's emscripten ScriptProcessorNode path. The wasm
      // side calls Module._floodAudioStart() on user gesture; that
      // creates the AudioContext + worklet, hooks its 'needData' /
      // 'starve' messages back to a wasm-exported _Audio_FeedWorklet
      // function. Module._floodAudioStop() tears down at end of demo.
      // Browsers gate AudioContext.resume() on a user-gesture call stack.
      // The C-side state machine catches the click via SDL_PollEvent later,
      // by which point the gesture context is gone — ctx.resume() then
      // resolves but the context stays in "suspended" state and the worklet
      // never produces audio. Listen for the first click/keydown directly
      // in JS and kick off audio in that handler. The C side calls
      // _floodAudioStart() too once it sees the gesture; the second call
      // returns immediately because Module.__audioCtx is already set.
      function preArmAudio(e) {
        window.removeEventListener('pointerdown', preArmAudio);
        window.removeEventListener('keydown',     preArmAudio);
        console.log('[audio-diag] preArmAudio fired type=' + e.type +
          ' _floodAudioStart=' + (typeof Module._floodAudioStart) +
          ' _Audio_FeedWorklet=' + (typeof Module._Audio_FeedWorklet));
        if (Module._floodAudioStart) Module._floodAudioStart();
      }
      window.addEventListener('pointerdown', preArmAudio);
      window.addEventListener('keydown',     preArmAudio);

      Module._floodAudioStart = async function() {
        // Re-entry: __audioCtx is set only AFTER the first await chain
        // completes. Without a separate "starting" flag, two calls in
        // rapid succession (preArm click handler + C-side SDL2_StartMusic
        // from the next rAF tick) both pass the audioCtx guard, both
        // proceed, both build a worklet, both pump. The C side then
        // advances the song at 2× rate — sounds like fast-forwarding
        // after the first few seconds.
        if (Module.__audioStarting || Module.__audioCtx) {
          console.log('[audio-diag] _floodAudioStart re-entry; already started or starting');
          return;
        }
        Module.__audioStarting = true;
        console.log('[audio-diag] _floodAudioStart: creating AudioContext');
        var ctx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000
        });
        console.log('[audio-diag] AudioContext state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        await ctx.resume();
        console.log('[audio-diag] after resume() state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        try {
          await ctx.audioWorklet.addModule('audio-worklet.js');
          console.log('[audio-diag] addModule ok');
        } catch (e) {
          console.error('[audio-diag] addModule failed: ' + e.message);
          return;
        }
        var node = new AudioWorkletNode(ctx, 'flood-modplayer-worklet', {
          outputChannelCount: [2]
        });
        // Gain in the chain for mute. The wasm pump keeps running even
        // when muted (so position advances + unmute resumes mid-track),
        // we just zero the audible signal.
        var gain = ctx.createGain();
        gain.gain.value = muted ? 0 : 1;
        node.connect(gain).connect(ctx.destination);
        Module.__audioGain = gain;
        node.port.onmessage = function(e) {
          if (!Module.__audioMsgSeen) {
            Module.__audioMsgSeen = 1;
            console.log('[audio-diag] first port message from worklet: ' + (e.data && e.data.type));
          }
          if (Module.__muted) return;
          if (Module.__feeding) return; // re-entry guard
          Module.__feeding = true;
          try {
            if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
          } finally {
            Module.__feeding = false;
          }
        };
        Module.__audioCtx = ctx;
        Module.__audioNode = node;
        Module.__audioPort = node.port;
        console.log('[audio-diag] worklet wired up, kicking initial pump; ctx.state=' + ctx.state);
        // Kick off the ring with one pump so the worklet has data before
        // it asks for more.
        if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
        // Re-check ctx state on the next tick — if it's still 'suspended'
        // we have a gesture-context problem.
        setTimeout(function(){
          console.log('[audio-diag] +200ms ctx.state=' + ctx.state +
            ' modHandle_known_to_C=via_wasm');
        }, 200);
      };
      Module._floodAudioStop = function() {
        if (Module.__audioPort) Module.__audioPort.postMessage({ type: 'stop' });
        if (Module.__audioNode) try { Module.__audioNode.disconnect(); } catch (_) {}
        if (Module.__audioCtx) try { Module.__audioCtx.close(); } catch (_) {}
        Module.__audioCtx = Module.__audioNode = Module.__audioPort = null;
      };
      setStatus('Downloading...');
      window.onerror = function() {
        setStatus('Exception thrown, see console');
        setStatus = function(t) { if (t) console.error('[post-exception] ' + t); };
      };
      // The browser captures Tab (focus nav), function keys, arrows, etc.
      // before they reach SDL. Block default for keys the demo cares about.
      var swallowed = new Set([
        'Tab', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
        'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
        'Home', 'End', 'PageUp', 'PageDown', ' ', 'Space'
      ]);
      window.addEventListener('keydown', function(e) {
        if (swallowed.has(e.key)) e.preventDefault();
      }, { capture: true });

      // Dynamic canvas resize. The CSS makes the canvas fill the viewport
      // visually, but the canvas drawing-buffer (canvas.width/height) is
      // a separate value that determines the actual pixel resolution we
      // render at. When the user drags the browser, rotates a device, or
      // moves the window between displays with different DPRs, this
      // handler updates the drawing-buffer size; emscripten's SDL2 then
      // emits SDL_WINDOWEVENT_SIZE_CHANGED, our native event loop picks
      // it up, and EngineResize redraws everything at the new dims.
      //
      // HiDPI starts off by default on the web — at retina scale the
      // rasterizer gets ~4x as many pixels to fill, which drops the
      // heavier scenes (city, fountain) below 60fps in the browser. The
      // HD/SD button toggles it at runtime; ?hidpi=1 in the URL opts in
      // at boot.
      var hiDPI = /[?&]hidpi=1/.test(window.location.search);
      // Mobile heuristic: coarse pointer + small viewport. On mobile we
      // tweak the SD/HD effective DPR — naive 1× is too pixelated (CSS
      // upscale to fill a phone screen looks blocky), naive full DPR
      // tanks fps on heavy scenes. So:
      //   SD on mobile = min(DPR, 1.5) — looks decent
      //   HD on mobile = min(DPR, 2)   — sharp without tripling pixel work
      // Desktop unaffected.
      var isMobile = window.matchMedia &&
                     window.matchMedia('(pointer:coarse)').matches &&
                     Math.min(window.innerWidth, window.innerHeight) <= 900;
      // Becomes true once main() has returned — guards against late-firing
      // resize/orientation listeners trying to call into freed wasm.
      var runtimeExited = false;
      // Render-scale divisor on top of HD/SD: 1 = full, 2 = half-res, 4 =
      // quarter-res drawing buffer (CSS upscales to fill the window). The
      // rasterizer's cost is ~linear in pixels, so ½× ≈ 4× fewer pixels.
      // ?scale=2 / ?scale=4 in the URL sets it at boot.
      var renderScale = (function(){
        var m = /[?&]scale=(2|4)/.exec(window.location.search);
        return m ? parseInt(m[1], 10) : 1;
      })();
      function effectiveDpr() {
        var dpr = window.devicePixelRatio || 1;
        var base;
        if (isMobile) {
          base = hiDPI ? Math.min(dpr, 2) : Math.min(dpr, 1.5);
        } else {
          base = hiDPI ? dpr : 1;
        }
        return base / renderScale;
      }
      function resizeCanvasToWindow() {
        var dpr = effectiveDpr();
        var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        // Route through SDL_SetWindowSize once the wasm is ready — it
        // updates window->w/h, calls emscripten_set_canvas_element_size
        // (which sizes the canvas DOM), and fires SIZE_CHANGED so the
        // demo thread can repaint at the new dims. Setting canvas.width
        // /height directly here doesn't reach SDL.
        if (runtimeExited) return;
        if (typeof Module !== 'undefined' && Module._SDL2_RequestSize) {
          try { Module._SDL2_RequestSize(w, h); }
          catch (e) { runtimeExited = true; }
        } else {
          if (canvasEl.width  !== w) canvasEl.width  = w;
          if (canvasEl.height !== h) canvasEl.height = h;
        }
      }
      window.addEventListener('resize', resizeCanvasToWindow);
      // iOS/Safari fires `orientationchange` slightly before the layout
      // settles; resize alone is sometimes missed. Belt and suspenders.
      window.addEventListener('orientationchange', function() {
        // Defer one frame so innerWidth/Height reflect the new orientation.
        requestAnimationFrame(resizeCanvasToWindow);
      });
      // DPR change (e.g. moving the window between a retina and non-retina
      // display) doesn't fire 'resize'; subscribe to a media query that
      // matches the current resolution to catch it.
      var dprMQ = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      if (dprMQ.addEventListener) dprMQ.addEventListener('change', resizeCanvasToWindow);
      else if (dprMQ.addListener) dprMQ.addListener(resizeCanvasToWindow);

      // ---- Control bar: mute / HiDPI / fullscreen ---------------------
      var btnMute = document.getElementById('btn-mute');
      var btnHidpi = document.getElementById('btn-hidpi');
      var btnFullscreen = document.getElementById('btn-fullscreen');
      var muted = false;

      function applyMute() {
        btnMute.textContent = muted ? '🔇' : '🔊';
        btnMute.setAttribute('aria-pressed', muted ? 'true' : 'false');
        // GainNode in the audio chain — wasm pump keeps running so the
        // song stays in lockstep with the visuals; we just zero the
        // audible signal.
        if (Module.__audioGain) Module.__audioGain.gain.value = muted ? 0 : 1;
      }
      function applyHidpi() {
        btnHidpi.textContent = renderScale === 4 ? '¼×'
                             : renderScale === 2 ? '½×'
                             : (hiDPI ? 'HD' : 'SD');
        btnHidpi.title = 'render resolution: HD → SD → ½× → ¼× (click to cycle)';
        btnHidpi.setAttribute('aria-pressed', hiDPI ? 'true' : 'false');
        // Match the font scale to the effective DPR — that way one
        // glyph pixel maps to one CSS pixel regardless of HD/SD or
        // mobile/desktop. Round up so we stay legible.
        if (Module._SDL2_SetFontScale) {
          var scale = Math.max(1, Math.round(effectiveDpr()));
          Module._SDL2_SetFontScale(scale);
        }
        // resizeCanvasToWindow routes through Module._SDL2_RequestSize
        // → SDL_SetWindowSize, which both resizes the canvas DOM element
        // and fires SDL_WINDOWEVENT_SIZE_CHANGED so the demo thread
        // repaints at the new resolution.
        resizeCanvasToWindow();
      }
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      function applyFullscreenLabel() {
        btnFullscreen.textContent = isFullscreen() ? '✕' : '⛶';
      }

      btnMute.addEventListener('click', function() {
        muted = !muted;
        applyMute();
      });
      btnHidpi.addEventListener('click', function() {
        // Cycle HD → SD → ½× → ¼× → HD. The two low-res steps divide the
        // drawing buffer for perf (heavy scenes / editor on battery).
        if (hiDPI)                    { hiDPI = false; renderScale = 1; }
        else if (renderScale === 1)   { renderScale = 2; }
        else if (renderScale === 2)   { renderScale = 4; }
        else                          { renderScale = 1; hiDPI = true; }
        applyHidpi();
      });
      btnFullscreen.addEventListener('click', function() {
        if (isFullscreen()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          var el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        }
      });
      document.addEventListener('fullscreenchange', applyFullscreenLabel);
      document.addEventListener('webkitfullscreenchange', applyFullscreenLabel);

      // Initial sync.
      applyHidpi();
      applyMute();
      applyFullscreenLabel();

      // ---- Auto-hide control bar -------------------------------------
      // Fade out after a couple seconds of no input. Cursor entering the
      // bottom 20% of the viewport (or any touch on mobile) brings it
      // back. Hovering the bar itself pauses the hide so the user has
      // time to click without playing whack-a-mole.
      var controlsEl = document.getElementById('controls');
      var hideTimer = null;
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
          controlsEl.classList.add('idle');
        }, 2500);
      }
      function showControls() {
        controlsEl.classList.remove('idle');
        scheduleHide();
      }
      window.addEventListener('mousemove', function(e) {
        // Bottom-region trigger only — don't flash the bar every time the
        // viewer moves their cursor anywhere on screen during playback.
        if (e.clientY > window.innerHeight - Math.max(120, window.innerHeight * 0.2)) {
          showControls();
        }
      });
      window.addEventListener('touchstart', showControls, { passive: true });
      controlsEl.addEventListener('mouseenter', function() { clearTimeout(hideTimer); });
      controlsEl.addEventListener('mouseleave', scheduleHide);
      // Keep the bar up while a button is being clicked.
      controlsEl.addEventListener('click', showControls);
      // Show at boot so the controls are discoverable, then auto-hide.
      showControls();
    </script>

    <!-- ───────── LWO surface editor panel (shown only with ?editor) ───────── -->
    <style>

    </style>

    <script>
      var editorSurfaces = [], editorSelected = null;
      // Object selection: editorGroup = array of surface names being edited
      // together, or null for single-surface mode. setProp/importFile fan
      // edits out over the group. The group is either a whole object's
      // surfaces (click an object/part row) or a CUSTOM multi-selection
      // (ctrl/cmd-click rows to toggle). editorGroupObj = the containing
      // object (scopes "invert"; null = scope is all surfaces).
      var editorObjects = [], editorGroup = null, editorGroupObj = null;
      function editorStatus(t){ var e=document.getElementById('editor-status'); if(e) e.textContent=t||''; }
      // Typing in panel inputs: Emscripten/SDL registers keyboard listeners on
      // window and preventDefault()s every key (they feed the engine's Keyboard[]
      // array), so an <input> never receives the character — the filter box was
      // untypeable. This capture-phase listener is registered BEFORE the wasm
      // runtime loads (the emscripten SCRIPT tag is below), so it runs first: when focus is
      // in a form field, stop the event from ever reaching SDL and let the
      // browser's default text editing happen.
      function editorTextEntryFocused(){
        var el = document.activeElement;
        if (!el) return false;
        if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
        if (el.tagName !== 'INPUT') return false;
        // Only TEXT-ENTRY inputs capture the keyboard — range sliders, file
        // pickers and buttons don't (so WASD fly keys keep reaching SDL even
        // if the last click was on a slider).
        var t = (el.type || 'text').toLowerCase();
        return t === 'text' || t === 'number' || t === 'search' || t === 'email' || t === 'url';
      }
      if (revEditorMode) ['keydown','keyup','keypress'].forEach(function(t){
        window.addEventListener(t, function(e){
          if (editorTextEntryFocused())
            e.stopImmediatePropagation();   // no preventDefault — typing IS the default
        }, true);
      });
      // Greets isn't CurScene until it inits + first ticks, so poll editorGetSurfaces
      // until it returns a non-empty list (then it's safe to read/edit).
      function initEditorPanel(){
        console.log('[editor] panel init (build b28); orbit/zoom embind =',
                    typeof Module.editorOrbit, typeof Module.editorSetSurfaceProp);
        document.getElementById('editor-panel').classList.remove('hidden');
        // Scene picker: navigating swaps ?scene= and reloads (the FLD +
        // sidecar live-fetch and scene init are boot-time).
        var ssel = document.getElementById('editor-scene-sel');
        ['greets','city','chase','fountain','crash'].forEach(function(sc){
          var o = document.createElement('option'); o.value = sc; o.textContent = sc;
          if (sc === revEditorScene) o.selected = true;
          ssel.appendChild(o);
        });
        ssel.onchange = function(){
          location.href = location.pathname + '?editor&scene=' + ssel.value;
        };
        editorStatus('loading ' + revEditorScene + '…');
        var tries = 0;
        var iv = setInterval(function(){
          tries++;
          var list = [];
          try { list = JSON.parse(Module.editorGetSurfaces()); } catch(e){}
          if (list.length){
            clearInterval(iv); editorSurfaces = list;
            // Pristine snapshot = values as loaded; "Save to LWO" sends only
            // props that differ from this (so untouched surfaces never get
            // their .lwo rewritten).
            editorPristine = {};
            list.forEach(function(s){ editorPristine[s.name] = JSON.parse(JSON.stringify(s)); });
            try {
              editorLights = JSON.parse(Module.editorGetLights());
              editorLightsPristine = {};
              editorLights.forEach(function(l){ editorLightsPristine[l.i] = JSON.parse(JSON.stringify(l)); });
            } catch(e){ console.warn('[editor] lights enumerate failed', e); }
            try {
              editorObjects = JSON.parse(Module.editorGetObjects ? Module.editorGetObjects() : '[]');
            } catch(e){ console.warn('[editor] objects enumerate failed', e); }
            editorStatus(list.length+' surfaces'); renderObjectList(); renderSurfaceList(); renderLightList(); updateSaveButton();
          }
          else if (tries > 60){ clearInterval(iv); editorStatus('no surfaces — scene not up?'); }
        }, 500);
      }
      var editorPristine = {};
      // PBR maps imported this session, pending persistence: surface -> role ->
      // {filename, bytes:Uint8Array}. Applied live at import time (MEMFS);
      // "Save" ships them to the server, which stores the files under
      // Runtime/TEXTURES/PBR/ and records them in the SCENES/GREETS.MAT sidecar.
      var editorPendingMaps = {};
      function pendingMapCount(){
        var n = 0;
        Object.keys(editorPendingMaps).forEach(function(s){ n += Object.keys(editorPendingMaps[s]).length; });
        return n;
      }
      function b64FromBytes(bytes){
        var s = '', CH = 0x8000;
        for (var i = 0; i < bytes.length; i += CH)
          s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
        return btoa(s);
      }
      var EDITOR_SAVE_PROPS = ['baseR','baseG','baseB','diffuse','specular','glossiness','luminosity','transparency','reflection'];
      // Scene lights (Omni_SceneAuthored — index order maps 1:1 onto the LWS
      // AddLight blocks, which is what the server patches on Save).
      var editorLights = [], editorLightsPristine = {}, editorSelectedLight = null;
      var EDITOR_LIGHT_PROPS = ['r','g','b','intensity','range'];
      function lightDirty(l){
        var p = editorLightsPristine[l.i]; if (!p) return false;
        return EDITOR_LIGHT_PROPS.some(function(k){ return Math.abs((+l[k]) - (+p[k])) > 1e-6; });
      }
      function collectDirtyLights(){
        var out = {};
        editorLights.forEach(function(l){
          var p = editorLightsPristine[l.i]; if (!p) return;
          EDITOR_LIGHT_PROPS.forEach(function(k){
            if (Math.abs((+l[k]) - (+p[k])) > 1e-6) (out[l.i] = out[l.i] || {})[k] = +l[k];
          });
        });
        return out;
      }
      function surfaceDirty(s){
        var p = editorPristine[s.name]; if (!p) return false;
        return EDITOR_SAVE_PROPS.some(function(k){ return Math.abs((+s[k]) - (+p[k])) > 1e-6; });
      }
      function collectDirty(){
        var out = {};
        editorSurfaces.forEach(function(s){
          var p = editorPristine[s.name]; if (!p) return;
          EDITOR_SAVE_PROPS.forEach(function(k){
            if (Math.abs((+s[k]) - (+p[k])) > 1e-6) (out[s.name] = out[s.name] || {})[k] = +s[k];
          });
        });
        return out;
      }
      function updateSaveButton(){
        var b = document.getElementById('editor-save'); if (!b) return;
        var n = Object.keys(collectDirty()).length, m = pendingMapCount(),
            L = Object.keys(collectDirtyLights()).length;
        b.disabled = !(n || m || L);
        b.textContent = (n || m || L)
          ? ('Save (' + [n ? n + ' surf' : '', m ? m + ' map' : '', L ? L + ' light' : '']
               .filter(Boolean).join(', ') + ')')
          : 'Save to LWO';
      }
      // ── Lights UI ─────────────────────────────────────────────────────
      document.getElementById('editor-lights-hdr').onclick = function(){
        var el = document.getElementById('editor-lights');
        el.style.display = (el.style.display === 'none') ? 'block' : 'none';
      };
      function renderLightList(){
        document.getElementById('editor-lights-count').textContent = editorLights.length ? ('(' + editorLights.length + ')') : '';
        var el = document.getElementById('editor-lights'); el.innerHTML = '';
        editorLights.forEach(function(l){
          var d = document.createElement('div');
          d.className = 'surf-item' + (editorSelectedLight === l.i ? ' sel' : '');
          d.innerHTML = '<div><span style="display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:rgb(' + l.r + ',' + l.g + ',' + l.b + ')"></span>' +
            'Light ' + l.i + (l.type ? ' (spot)' : '') + (l.shadow ? ' ◘' : '') +
            (lightDirty(l) ? ' <span style="color:#fa5">●</span>' : '') + '</div>' +
            '<div class="surf-tex">pos ' + l.x + ',' + l.y + ',' + l.z +
            ' • int ' + (+l.intensity).toFixed(2) + ' • range ' + (+l.range).toFixed(1) + '</div>';
          d.onclick = function(){
            editorSelectedLight = l.i; renderLightList(); renderLightProps(l);
            // Frame the orbit on the light (same as clicking a surface row).
            if (Module.editorFocusLight) Module.editorFocusLight(l.i);
            editorStatus('light ' + l.i + ' — focused (' + l.x + ',' + l.y + ',' + l.z + ')');
          };
          el.appendChild(d);
        });
      }
      function setLightProp(l, key, v){
        var ok = false;
        try { ok = Module.editorSetLightProp(l.i, key, v); }
        catch(e){ editorStatus('light set failed: ' + e); return false; }
        if (ok) { l[key] = v; editorStatus('light ' + l.i + ' ' + key + ' = ' + (+v).toFixed(2)); }
        else editorStatus('light set → false');
        updateSaveButton();
        return ok;
      }
      var EDITOR_LIGHT_RANGES = { r:[0,255,1], g:[0,255,1], b:[0,255,1],
                                  intensity:[0,4,0.01], range:[0,100,0.5] };
      function renderLightProps(l){
        var el = document.getElementById('editor-light-props'); el.innerHTML = '';
        var h = document.createElement('div'); h.style.cssText = 'color:#fff;margin:4px 0;display:flex;justify-content:space-between;';
        var hn = document.createElement('span');
        hn.textContent = 'Light ' + l.i + (l.sizeKeys > 1 ? ' (animated — edits flatten keys)' : '');
        h.appendChild(hn);
        var rst = document.createElement('a');
        rst.textContent = 'reset'; rst.href = '#';
        rst.style.cssText = 'color:#c96;font-size:10px;text-decoration:none;';
        rst.onclick = function(e){
          e.preventDefault();
          var p = editorLightsPristine[l.i]; if (!p) return;
          EDITOR_LIGHT_PROPS.forEach(function(k){
            if (Math.abs((+l[k]) - (+p[k])) > 1e-9) setLightProp(l, k, +p[k]);
          });
          renderLightList(); renderLightProps(l); updateSaveButton();
        };
        h.appendChild(rst); el.appendChild(h);
        EDITOR_LIGHT_PROPS.forEach(function(k){
          var rg = EDITOR_LIGHT_RANGES[k];
          var row = document.createElement('div'); row.className = 'prop-row';
          var lab = document.createElement('label'); lab.textContent = k; row.appendChild(lab);
          var r = document.createElement('input'); r.type = 'range';
          r.min = rg[0]; r.max = rg[1]; r.step = rg[2]; r.value = l[k];
          var val = document.createElement('input'); val.type = 'number'; val.step = rg[2];
          val.value = +(+l[k]).toFixed(3);
          val.style.cssText = 'background:#111;color:#9cf;border:1px solid #345;border-radius:2px;font-size:11px;padding:1px 2px;';
          r.oninput = function(){
            var v = parseFloat(r.value); val.value = +v.toFixed(3);
            setLightProp(l, k, v); renderLightList();
          };
          val.onchange = function(){
            var v = parseFloat(val.value); if (isNaN(v)) return;
            r.value = v; setLightProp(l, k, v); renderLightList();
          };
          row.appendChild(r); row.appendChild(val); el.appendChild(row);
        });
      }
      // ── Render knobs: live engine feature-flags ───────────────────────
      // Data-driven from editorGetParams (the FeatureFlags registry dump).
      // Default view = the curated important set; "all" shows everything
      // grouped by category. Edits call editorSetParam (same write path as
      // the CLI) and re-render on the next frame; "reset" = unsetParam
      // (back to the compile-time default).
      var editorParams = [], editorParamsPristine = null;
      var EDITOR_KNOBS = ['bloom','bloom_intensity','disco_bloom','hdr_refl_gain',
        'ssao','ssao_gtao','ssao_downscale','ao_map_strength',
        'parallax','parallax_strength','nmap_16bit',
        'chromatic','chromatic_amount','vignette','vignette_strength',
        'dof','dof_range','dof_max',
        'anamorphic','anamorphic_intensity','anamorphic_passes','anamorphic_decay',
        'lens_ghosts','lens_ghost_intensity','lens_ghost_dispersal','lens_ghost_halo',
        'cone_strength','aa','shadows','shadow_dynamic','pbr','hdr','hdr_linear',
        'deferred_quarter','fast_fog','fast_fog_froxel'];
      function refreshParams(){
        try { editorParams = JSON.parse(Module.editorGetParams()); } catch(e){ editorParams = []; }
        // Pristine = the values at first open (the editor's boot look: the
        // native flag set + URL overrides). Reset restores THESE, not the
        // compile-time defaults — unsetParam would strip hdr/bloom/etc.
        if (!editorParamsPristine && editorParams.length) {
          editorParamsPristine = {};
          editorParams.forEach(function(p){ editorParamsPristine[p.name] = p.value; });
        }
      }
      function knobPristine(p){
        return (editorParamsPristine && p.name in editorParamsPristine)
          ? editorParamsPristine[p.name] : p.def;
      }
      function knobRow(p){
        var row = document.createElement('div'); row.className = 'prop-row';
        row.title = p.help || '';
        var lab = document.createElement('label'); lab.textContent = p.name;
        lab.style.cssText = 'flex:0 0 130px;overflow:hidden;text-overflow:ellipsis;' + (p.set ? 'color:#fc8;' : '');
        row.appendChild(lab);
        function setIt(v){
          var ok = false;
          try { ok = Module.editorSetParam(p.name, String(v)); } catch(e){}
          editorStatus((ok ? 'flag ' : 'flag FAILED ') + p.name + ' = ' + v);
          p.set = true; lab.style.color = '#fc8';
        }
        if (p.type === 'bool') {
          var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = !!p.value;
          cb.style.flex = '1';
          cb.onchange = function(){ p.value = cb.checked; setIt(cb.checked ? 1 : 0); };
          row.appendChild(cb);
        } else {
          // Slider range: span BOTH the default and the current value
          // generously (a CLI/scene value above 4×default used to cap the
          // slider at the loaded value). Typing past the top in the number
          // box grows the slider range too.
          var d = Math.abs(+p.def) || 1;
          var r = document.createElement('input'); r.type = 'range';
          function fitRange(v){
            var m = Math.max(4 * d, 2.5 * Math.abs(v), 1);
            r.min = Math.min(0, v); r.max = m;
            r.step = (p.type === 'int') ? 1 : m / 200;
          }
          fitRange(+p.value);
          r.value = +p.value;
          var val = document.createElement('input'); val.type = 'number'; val.step = r.step;
          val.value = +(+p.value).toFixed(3);
          val.style.cssText = 'background:#111;color:#9cf;border:1px solid #345;border-radius:2px;font-size:11px;padding:1px 2px;';
          r.oninput = function(){ var v = (p.type === 'int') ? parseInt(r.value, 10) : parseFloat(r.value);
                                  val.value = v; p.value = v; setIt(v); };
          val.onchange = function(){ var v = parseFloat(val.value); if (isNaN(v)) return;
                                     if (v > +r.max || v < +r.min) fitRange(v);
                                     r.value = v; p.value = v; setIt(v); };
          row.appendChild(r); row.appendChild(val);
        }
        var rst = document.createElement('a');
        rst.textContent = '⟲'; rst.href = '#';
        rst.title = 'reset to loaded value (' + knobPristine(p) + ')';
        rst.style.cssText = 'color:#c96;font-size:11px;text-decoration:none;flex:0 0 14px;text-align:center;';
        rst.onclick = function(e){
          e.preventDefault();
          var v = knobPristine(p);
          try { Module.editorSetParam(p.name, String(typeof v === 'boolean' ? (v ? 1 : 0) : v)); } catch(err){}
          refreshParams(); renderKnobList();
          editorStatus('reset ' + p.name + ' = ' + v);
        };
        row.appendChild(rst);
        return row;
      }
      function renderKnobList(){
        var el = document.getElementById('editor-knobs'); if (!el) return;
        var all = document.getElementById('editor-knobs-all').checked;
        el.innerHTML = '';
        var cnt = document.getElementById('editor-knobs-count');
        if (cnt) cnt.textContent = editorParams.length ? ('(' + (all ? editorParams.length : EDITOR_KNOBS.length) + ')') : '';
        if (!editorParams.length) return;
        if (all) {
          var byCat = {};
          editorParams.forEach(function(p){ (byCat[p.cat || 'misc'] = byCat[p.cat || 'misc'] || []).push(p); });
          Object.keys(byCat).sort().forEach(function(cat){
            var h = document.createElement('div');
            h.style.cssText = 'color:#8ac;font-size:10px;margin-top:6px;border-bottom:1px solid #234;';
            h.textContent = cat;
            el.appendChild(h);
            byCat[cat].forEach(function(p){ el.appendChild(knobRow(p)); });
          });
        } else {
          EDITOR_KNOBS.forEach(function(name){
            var p = editorParams.find(function(x){ return x.name === name; });
            if (p) el.appendChild(knobRow(p));
          });
        }
      }
      document.getElementById('editor-knobs-hdr').onclick = function(e){
        if (e.target && (e.target.id === 'editor-knobs-all' ||
                         e.target.id === 'editor-knobs-resetall' ||
                         e.target.tagName === 'LABEL')) return;   // controls, not a toggle
        var el = document.getElementById('editor-knobs');
        var opening = el.style.display === 'none';
        el.style.display = opening ? 'block' : 'none';
        if (opening) { refreshParams(); renderKnobList(); }
      };
      document.getElementById('editor-knobs-all').onchange = function(){ renderKnobList(); };
      document.getElementById('editor-knobs-resetall').onclick = function(e){
        e.preventDefault();
        refreshParams();
        var n = 0;
        editorParams.forEach(function(p){
          var v = knobPristine(p);
          if (String(p.value) !== String(v)) {
            try {
              if (Module.editorSetParam(p.name, String(typeof v === 'boolean' ? (v ? 1 : 0) : v))) n++;
            } catch(err){}
          }
        });
        refreshParams(); renderKnobList();
        editorStatus('reset ' + n + ' knob(s) to loaded values');
      };
      function renderSurfaceList(){
        var q = (document.getElementById('editor-search').value || '').toLowerCase();
        var el = document.getElementById('editor-list'); el.innerHTML = '';
        editorSurfaces.forEach(function(s){
          if (q && s.name.toLowerCase().indexOf(q) < 0) return;
          var grouped = editorGroup && editorGroup.indexOf(s.name) >= 0;
          var d = document.createElement('div');
          d.className = 'surf-item' + (((editorSelected === s.name && !editorGroup) || grouped) ? ' sel' : '');
          d.innerHTML = '<div>' + s.name +
            (surfaceDirty(s) ? ' <span style="color:#fa5">●</span>' : '') + '</div>' +
            (s.texture ? '<div class="surf-tex">' + s.texture.replace(/^TEXTURES\//,'') + '</div>' : '');

      // Hierarchy tree: model → parts → surfaces. Clicking an object/part row

      // it in a multi-selection instead; "invert" in the header flips the
      // multi-selection within its containing object. ▸/▾ expands a level.
      var editorObjExpanded = {};

      function groupHasAll(names){
        return names.length > 0 && names.every(inGroup);

      function renderObjectList(){
        var cnt = document.getElementById('editor-objects-count');
        if (cnt) cnt.textContent = editorObjects.length ? ('(' + editorObjects.length + ')') : '';
        var inv = document.getElementById('editor-invert-sel');
        if (inv) inv.style.display = editorGroup ? '' : 'none';
        var el = document.getElementById('editor-objects'); if (!el) return;
        el.innerHTML = '';
        function addObjRow(o, depth, key, container){
          var isSel = groupHasAll(o.surfaces);
          var open = !!editorObjExpanded[key];
          var kids = o.children || [];
          var d = document.createElement('div');
          d.className = 'surf-item' + (isSel ? ' sel' : '');
          d.style.marginLeft = (depth * 14) + 'px';
          d.innerHTML = '<div><span class="obj-exp" style="display:inline-block;width:14px;cursor:pointer;color:#8ac;">' +
            (open ? '▾' : '▸') + '</span>⬚ ' + o.name + '</div>' +
            '<div class="surf-tex" style="margin-left:14px;">' + o.surfaces.length + ' surface(s)' +
            (kids.length ? ', ' + kids.length + ' part(s)' : '') + '</div>';
          d.querySelector('.obj-exp').onclick = function(ev){
            ev.stopPropagation();
            editorObjExpanded[key] = !open;
            renderObjectList();

            if (ev.ctrlKey || ev.metaKey) toggleGroup(o.surfaces, container || o);
            else selectObject(o);

          if (kids.length) {
            kids.forEach(function(c, i){ addObjRow(c, depth + 1, key + '/' + c.name + i, container || o); });
          } else {
            o.surfaces.forEach(function(n){
              var s = editorSurfaces.find(function(x){ return x.name === n; });
              var c = document.createElement('div');
              c.className = 'surf-item' + ((inGroup(n) || (editorSelected === n && !editorGroup)) ? ' sel' : '');
              c.style.marginLeft = ((depth + 1) * 14 + 4) + 'px';
              c.innerHTML = '<div>' + n + (s && surfaceDirty(s) ? ' <span style="color:#fa5">●</span>' : '') + '</div>';

      // Apply the current editorGroup: props panel (first member's values),
      // group highlight + framing, list refresh, status.
      function applyGroupSelection(label){
        var names = (editorGroup || []).filter(function(n){
          return editorSurfaces.some(function(s){ return s.name === n; });
        });
        if (!names.length) {
          editorGroup = null; editorGroupObj = null;
          renderObjectList(); renderSurfaceList();
          editorStatus('selection empty');
          return;

        editorGroup = names;
        editorSelected = names[0];
        var s = editorSurfaces.find(function(x){ return x.name === names[0]; });

        renderSurfaceProps(s, { name: label, surfaces: names });
        if (Module.editorFocusSurface) Module.editorFocusSurface(names.join(';'));
        if (Module.editorHighlight)    Module.editorHighlight(names.join(';'));
        editorStatus(label + ': editing ' + names.length + ' surface(s) together');
      }
      // Ctrl/cmd-click: toggle `names` in/out of the multi-selection. Starting
      // a fresh multi-select seeds it with the current single selection so
      // ctrl-click naturally EXTENDS what you had.
      function toggleGroup(names, container){
        if (!editorGroup) {
          editorGroup = (editorSelected && names.indexOf(editorSelected) < 0)
            ? [editorSelected] : [];

        var allIn = names.length > 0 && names.every(inGroup);
        if (allIn) {
          editorGroup = editorGroup.filter(function(n){ return names.indexOf(n) < 0; });
        } else {
          names.forEach(function(n){ if (!inGroup(n)) editorGroup.push(n); });
        }
        editorGroupObj = container || editorGroupObj;
        applyGroupSelection('selection');
      }
      // Object select: every surface of the group edits together. Props panel
      // shows the FIRST surface's values; highlight + focus cover the group.
      function selectObject(o){
        editorGroup = o.surfaces.slice();
        editorGroupObj = o;
        applyGroupSelection('object "' + o.name + '"');
      }
      // Shared select path: list click focuses the orbit on the surface;
      // canvas pick only selects/highlights (jumping the camera on every
      // viewport click would fight the user's framing).
      function selectSurface(s, alsoFocus){
        editorGroup = null; editorGroupObj = null;   // single-surface mode
        editorSelected = s.name; renderObjectList(); renderSurfaceList(); renderSurfaceProps(s);
        if (alsoFocus && Module.editorFocusSurface) Module.editorFocusSurface(s.name);  // orbit around it
        if (Module.editorHighlight) Module.editorHighlight(s.name);                     // outline it in the render
        var sel = document.querySelector('#editor-list .surf-item.sel');
        if (sel) sel.scrollIntoView({ block: 'nearest' });
      }
      // Invert the multi-selection within its containing object (or, with no
      // container, within all surfaces): selected ↔ unselected.
      document.getElementById('editor-invert-sel').onclick = function(e){
        e.preventDefault();
        if (!editorGroup) return;
        var scope = editorGroupObj ? editorGroupObj.surfaces
                                   : editorSurfaces.map(function(s){ return s.name; });
        editorGroup = scope.filter(function(n){ return !inGroup(n); });
        applyGroupSelection(editorGroupObj ? 'inverted in "' + editorGroupObj.name + '"' : 'inverted');
      };
      // The names an edit applies to: the whole object group when one is
      // selected (and the edited surface belongs to it), else just the one.
      function editSurfNames(name){
        if (editorGroup && editorGroup.indexOf(name) >= 0)
          return editorGroup.filter(function(n){
            return editorSurfaces.some(function(s){ return s.name === n; });
          });
        return [name];
      }
      function setProp(name, key, v){
        var names = editSurfNames(name);
        var okAll = true;
        names.forEach(function(n){
          var ok = false;
          try { ok = Module.editorSetSurfaceProp(n, key, v); }
          catch(e){ editorStatus('set failed: ' + e); console.error('editorSetSurfaceProp', e); okAll = false; return; }
          if (ok) {
            var s = editorSurfaces.find(function(x){ return x.name === n; });
            if (s) s[key] = v;   // keep the JS model in sync so re-selecting shows the edit
          } else okAll = false;
        });
        if (!okAll) editorStatus('set ' + key + ' on "' + name + '" → false (not applied)');
        else editorStatus('set ' + key + ' = ' + (+v).toFixed(2) +
                          (names.length > 1 ? ' (' + names.length + ' surfaces)' : ''));

        updateSaveButton();

      }
      // Save to LWO: POST the dirty props to the dev server, which patches the
      // Authoring/greets .lwo files (with backups), reruns lwsread, and installs
      // the FLD into Runtime/SCENES. "Reload scene" then re-boots the page —
      // the editor fetches the fresh FLD at boot, so the saved values persist.
      document.getElementById('editor-save').onclick = function(){
        var dirty = collectDirty();
        var names = Object.keys(dirty);
        var maps = {};
        Object.keys(editorPendingMaps).forEach(function(surf){
          Object.keys(editorPendingMaps[surf]).forEach(function(role){
            var m = editorPendingMaps[surf][role];
            (maps[surf] = maps[surf] || {})[role] = { filename: m.filename, data: b64FromBytes(m.bytes) };
          });
        });
        var nMaps = pendingMapCount();
        var dirtyLights = collectDirtyLights();
        var lightIdx = Object.keys(dirtyLights);
        if (!names.length && !nMaps && !lightIdx.length) return;
        editorStatus('saving ' + names.length + ' surface(s), ' + nMaps + ' map(s), ' + lightIdx.length + ' light(s)…');
        var payload = { surfaces: dirty };
        if (nMaps) payload.maps = maps;
        if (lightIdx.length) payload.lights = dirtyLights;
        fetch('api/' + revEditorScene + '/save', { method: 'POST', body: JSON.stringify(payload) })
          .then(function(r){ return r.json(); })
          .then(function(res){
            if (!res.ok) { editorStatus('save FAILED: ' + (res.error || '?')); console.error('[editor] save', res); return; }
            var bits = (res.patched || []).map(function(p){ return p.file; });
            if (res.lights && res.lights.length) bits.push(res.lights.length + ' light(s) → LWS');
            if (res.fld) bits.push(res.fld.split('/').pop());
            if (res.maps && res.maps.length) bits.push(res.maps.length + ' map(s) → sidecar');
            if (res.props && res.props.length) bits.push(res.props.length + ' surface(s) → FLD');
            editorStatus('saved → ' + (bits.join(', ') || 'no changes') +
                         (res.warnings && res.warnings.length ? ' (' + res.warnings.length + ' warnings — see console)' : ''));
            if (res.warnings && res.warnings.length) console.warn('[editor] save warnings:', res.warnings);
            console.log('[editor] save ok:', res);

              var s = editorSurfaces.find(function(x){ return x.name === n; });
              if (s) editorPristine[n] = JSON.parse(JSON.stringify(s));

            lightIdx.forEach(function(i){
              var l = editorLights.find(function(x){ return String(x.i) === String(i); });
              if (l) editorLightsPristine[l.i] = JSON.parse(JSON.stringify(l));
            });
            editorPendingMaps = {};

      };
      document.getElementById('editor-reload').onclick = function(){ location.reload(); };
      // Scene-time scrub: the editor freezes the animation clock; step it to
      // scrub the scene's animation (robot walk, camera-independent tracks).

        if (!Module.editorTimeStep) return;

        document.getElementById('editor-time-val').textContent = t;
      }
      document.getElementById('editor-time-back').onclick = function(e){ timeStep(e.shiftKey ? -500 : -50); };

        if (editorTextEntryFocused()) return;
        if (e.key === '[') timeStep(e.shiftKey ? -500 : -50);

      });
      // Backups: greets stashes its .lwo/.LWS authoring sources under
      // Authoring/greets/.backups (restore regens the FLD); the other scenes
      // stash the shipping FLD itself under Runtime/SCENES/.backups (their
      // saves patch the FLD directly — tools/fldpatch.py). Restoring backs up
      // the current state first — Reload then shows it.
      (function(){
        var bhdr = document.getElementById('editor-backups-hdr');
        bhdr.style.display = 'block';
        var bopen = false;
        bhdr.onclick = function(){
          var el = document.getElementById('editor-backups');
          bopen = !bopen;
          el.style.display = bopen ? 'block' : 'none';
          if (!bopen) return;
          el.innerHTML = '<div class="surf-tex">loading…</div>';
          fetch('api/' + revEditorScene + '/backups').then(function(r){ return r.json(); }).then(function(res){
            el.innerHTML = '';
            if (!res.backups || !res.backups.length) { el.innerHTML = '<div class="surf-tex">no backups yet</div>'; return; }
            res.backups.forEach(function(b){
              var d = document.createElement('div'); d.className = 'surf-item';
              d.innerHTML = '<div>' + b.file + '</div><div class="surf-tex">restores ' + b.target + '</div>';
              d.onclick = function(){
                if (!confirm('Restore ' + b.target + ' from ' + b.file + '?\n(The current file is backed up first.)')) return;
                editorStatus('restoring ' + b.file + '…');
                fetch('api/' + revEditorScene + '/restore', { method: 'POST', body: JSON.stringify({ file: b.file }) })
                  .then(function(r){ return r.json(); })
                  .then(function(res2){
                    editorStatus(res2.ok
                      ? ((res2.restored ? 'restored ' + res2.restored + ' — Reload scene to see it'
                                        : (res2.note || 'nothing to do')))
                      : ('restore FAILED: ' + (res2.error || '?')));
                  })
                  .catch(function(e){ editorStatus('restore failed: ' + e); });
              };
              el.appendChild(d);
            });
          }).catch(function(e){ el.innerHTML = '<div class="surf-tex">backups fetch failed: ' + e + '</div>'; });
        };
      })();
      // Per-property ranges — the engine stores these on different scales:
      // diffuse/specular ~0..1, luminosity ~0..2, transparency/reflection 0..100.
      var EDITOR_RANGES = { diffuse:[0,1], specular:[0,2], luminosity:[0,2],
                            transparency:[0,100], reflection:[0,100] };
      // Slider + numeric twin. The number box accepts values beyond the slider
      // range (type an exact 3.5 even if the slider tops out at 2).
      function propRow(s, key, min, max, step){
        var row = document.createElement('div'); row.className = 'prop-row';
        var lab = document.createElement('label'); lab.textContent = key; row.appendChild(lab);
        var r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = s[key];
        var val = document.createElement('input'); val.type = 'number'; val.step = step; val.value = +(+s[key]).toFixed(3);
        val.style.cssText = 'background:#111;color:#9cf;border:1px solid #345;border-radius:2px;font-size:11px;padding:1px 2px;';
        r.oninput = function(){ var v = parseFloat(r.value); val.value = +v.toFixed(3); setProp(s.name, key, v); };
        val.onchange = function(){
          var v = parseFloat(val.value); if (isNaN(v)) return;
          r.value = v; setProp(s.name, key, v);
        };
        row.appendChild(r); row.appendChild(val); return row;
      }
      function renderSurfaceProps(s, obj){
        var el = document.getElementById('editor-props'); el.innerHTML = '';
        var h = document.createElement('div'); h.style.cssText = 'color:#fff;margin-bottom:4px;display:flex;justify-content:space-between;';
        var hn = document.createElement('span');
        // Object mode: edits fan out over the whole group; values shown are the
        // FIRST surface's (they may differ across the group until edited).
        hn.textContent = obj ? ('⬚ ' + obj.name + ' (' + obj.surfaces.length + ' surfaces)') : s.name;

        rst.style.cssText = 'color:#c96;font-size:10px;text-decoration:none;';
        rst.onclick = function(e){
          e.preventDefault();
          var p = editorPristine[s.name]; if (!p) return;
          EDITOR_SAVE_PROPS.forEach(function(k){
            if (Math.abs((+s[k]) - (+p[k])) > 1e-9) setProp(s.name, k, +p[k]);
          });

        // editing one edits both). Live-only: the LWO has ONE shared surface,
        // so persisted saves apply to the base name.
        if (!obj) {
          var spl = document.createElement('a');
          spl.textContent = 'split instances'; spl.href = '#';
          spl.title = 'give each spatially-separate copy of this surface its own editable material (live-only — Save writes the base surface)';
          spl.style.cssText = 'color:#69c;font-size:10px;text-decoration:none;display:block;margin-bottom:4px;';
          spl.onclick = function(e){
            e.preventDefault();
            var names = [];
            try { names = JSON.parse(Module.editorSplitInstances(s.name)); } catch(err){}
            if (!names.length) { editorStatus('split: only one instance of "' + s.name + '" found'); return; }

          var rg = EDITOR_RANGES[k] || [0,2];

            // (env-mapped faces are code-routed) — the value persists to the
            // LWO/sidecar for authoring but doesn't render.

          }

        var gl = document.createElement('label'); gl.textContent = 'glossiness'; gr.appendChild(gl);
        var sel = document.createElement('select');
        [0,4,8,16,32,48,64,128].forEach(function(g){
          var o = document.createElement('option'); o.value = g; o.textContent = g;
          if (+s.glossiness === g) o.selected = true; sel.appendChild(o);
        });
        sel.onchange = function(){ setProp(s.name, 'glossiness', parseInt(sel.value, 10)); };
        gr.appendChild(sel); el.appendChild(gr);
        if (s.texture){ var t = document.createElement('div'); t.className = 'surf-tex'; t.textContent = 'tex: ' + s.texture; el.appendChild(t); }

        // PBR map import — upload an image per role; bytes go to the engine via
        // Embind (editorImportTexture), which reuses the --material-import path.
        function importFile(role, file, done){
          var fr = new FileReader();
          fr.onload = function(){
            var bytes = new Uint8Array(fr.result), ok = false;
            // Object mode: the map lands on EVERY surface of the group.
            var names = editSurfNames(s.name);
            names.forEach(function(n){
              var one = false;
              try { one = Module.editorImportTexture(n, role, file.name, bytes); }
              catch(e){ editorStatus('import failed: ' + e); console.error('editorImportTexture', e); return; }
              if (one) {
                // Queue for persistence: Save ships these to the server, which
                // stores them under Runtime/TEXTURES/PBR/ + the GREETS.MAT sidecar.
                (editorPendingMaps[n] = editorPendingMaps[n] || {})[role] =
                  { filename: file.name, bytes: bytes };
                ok = true;
              }
            });
            console.log('[editor] import', names.join(','), role, file.name, bytes.length, '->', ok);
            if (ok) updateSaveButton();

        }
        var imp = document.createElement('div');
        imp.style.cssText = 'margin-top:8px;border-top:1px solid #333;padding-top:6px;';
        var ih = document.createElement('div'); ih.style.cssText = 'color:#fff;margin-bottom:4px;'; ih.textContent = 'Import PBR maps'; imp.appendChild(ih);
        // Whole-pack import: pick a folder (FreePBR/ambientCG layout) and each
        // map is role-detected by filename with the SAME native token rules as

        var pr = document.createElement('div'); pr.className = 'prop-row';

        pinp.onchange = function(){

          var dirs = {};   // dirPath -> { role -> file }
          files.forEach(function(f){

            if (!role) return;

            var dir = rel.indexOf('/') >= 0 ? rel.substring(0, rel.lastIndexOf('/')) : '';
            if (!dirs[dir]) dirs[dir] = {};

          var best = null, bestKey = null, nDirs = 0;
          Object.keys(dirs).forEach(function(k){
            nDirs++;
            var score = Object.keys(dirs[k]).length + (dirs[k].albedo ? 100 : 0);
            var bestScore = best ? Object.keys(best).length + (best.albedo ? 100 : 0) : -1;
            if (score > bestScore) { best = dirs[k]; bestKey = k; }
          });
          if (!best) { editorStatus('pack: no recognizable maps in folder'); return; }
          var slots = best;
          var roles = Object.keys(slots);
          var packName = bestKey ? bestKey.split('/').pop() : '(folder)';
          // Albedo first: it defines the material's texel layout; the engine
          // resamples the other maps to it (and drops stale mismatched ones).
          roles.sort(function(a,b){ return (a==='albedo'?0:1) - (b==='albedo'?0:1); });

                if (++doneCount === roles.length)

                               + ' applied — ' + applied.join(', '));
                res();
              });
            }); });
          });
        };
        pr.appendChild(pinp); imp.appendChild(pr);
        ['albedo','normal','height','roughness','ao'].forEach(function(role){
          var row = document.createElement('div'); row.className = 'prop-row';
          var lab = document.createElement('label'); lab.textContent = role; row.appendChild(lab);
          var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
          inp.style.cssText = 'flex:1;min-width:0;font-size:10px;color:#bbb;';
          inp.onchange = function(){
            var file = inp.files && inp.files[0]; if (!file) return;

            });

        el.appendChild(imp);
      }

      // Camera orbit handled in JS on the canvas (SDL's in-browser mouse events
      // proved unreliable for this) → Embind editorOrbit/editorZoom. And the
      // panel stops its own mouse events from bubbling out, so a global SDL
      // listener can't eat slider drags and panel drags never orbit the camera.
      (function(){
        if (!revEditorMode) return;
        // left-drag = orbit, right-drag or shift+drag = pan, wheel = zoom,
        // left-CLICK (no drag) = pick the surface under the cursor.
        var mode = null, lastX = 0, lastY = 0, downX = 0, downY = 0, dragged = false;
        canvasEl.addEventListener('mousedown', function(e){
          // Hand the keyboard back to the engine: a focused panel control
          // (slider / number box) would otherwise swallow the fly keys.
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
          lastX = downX = e.clientX; lastY = downY = e.clientY; dragged = false;
          e.preventDefault();
        });
        window.addEventListener('mouseup', function(){ mode = null; });
        window.addEventListener('mousemove', function(e){
          if (!mode) return;
          var dx = e.clientX - lastX, dy = e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) dragged = true;
          if (mode === 'pan')  { if (Module.editorPan)   Module.editorPan(dx, dy); }
          else                 { if (Module.editorOrbit) Module.editorOrbit(dx, dy); }
        });
        // Click position → engine-surface UV: undo the canvas letterbox with the
        // SAME math Wasm_PresentGL uses (Module.__floodTexW/H = engine surface).
        function canvasToEngineUV(e){
          var tw = Module.__floodTexW, th = Module.__floodTexH;
          if (!tw || !th) return null;
          var r = canvasEl.getBoundingClientRect();
          var cx = (e.clientX - r.left) * (canvasEl.width  / r.width);
          var cy = (e.clientY - r.top)  * (canvasEl.height / r.height);
          var srcAR = tw / th, canAR = canvasEl.width / canvasEl.height;
          var dx = 0, dy = 0, dw = canvasEl.width, dh = canvasEl.height;
          if (canAR > srcAR) { dw = (canvasEl.height * srcAR) | 0; dx = (canvasEl.width  - dw) >> 1; }
          else               { dh = (canvasEl.width  / srcAR) | 0; dy = (canvasEl.height - dh) >> 1; }
          var u = (cx - dx) / dw, v = (cy - dy) / dh;
          return (u < 0 || u > 1 || v < 0 || v > 1) ? null : { u: u, v: v };
        }
        function pickAt(e){
          if (!Module.editorPick) return null;
          var uv = canvasToEngineUV(e);
          if (!uv) return null;
          try { return Module.editorPick(uv.u, uv.v) || null; } catch (err) { return null; }
        }
        canvasEl.addEventListener('mouseup', function(e){
          if (dragged || e.button !== 0 || e.shiftKey) return;
          var name = pickAt(e);
          if (!name) { editorStatus('pick: no surface here'); return; }
          // pick=object: promote the picked surface to its owning object so
          // the whole model (e.g. the mech) is selected/edited at once.
          var pickObj = document.getElementById('editor-pickobj');
          if (pickObj && pickObj.checked) {
            var o = editorObjects.find(function(x){ return x.surfaces.indexOf(name) >= 0; });
            if (o) { selectObject(o); editorStatus('picked object: ' + o.name + ' (via ' + name + ')'); return; }
          }
          var s = editorSurfaces.find(function(x){ return x.name === name; });
          if (s) { selectSurface(s, /*alsoFocus=*/false); editorStatus('picked: ' + name); }
        });
        // Double-click = pick AND frame the orbit on it.
        canvasEl.addEventListener('dblclick', function(e){
          var name = pickAt(e);
          if (name && Module.editorFocusSurface) Module.editorFocusSurface(name);
        });
        canvasEl.addEventListener('wheel', function(e){
          if (!Module.editorZoom) return;
          e.preventDefault();
          // Normalize: deltaMode 1 = lines (real mouse wheels on some
          // platforms) → ~33 px/line. Trackpad pinch arrives as ctrlKey
          // wheel events with SMALL fractional deltas — boost them so a
          // pinch spans a useful zoom range (matches browser page-zoom
          // feel, which uses ~exp(-delta*0.01)).
          var d = e.deltaY * (e.deltaMode === 1 ? 33 : 1);
          if (e.ctrlKey) d *= 7;
          Module.editorZoom(d);          // proportional → smooth on a trackpad
        }, { passive: false });
        canvasEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });  // allow right-drag pan
        var panel = document.getElementById('editor-panel');
        ['mousedown','mousemove','mouseup','wheel','pointerdown','pointermove','click','contextmenu'].forEach(function(t){
          panel.addEventListener(t, function(e){ e.stopPropagation(); });
        });
      })();
    </script>
