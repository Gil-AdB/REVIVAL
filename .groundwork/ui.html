this issue is from one of the other numerous flags we have - you wrote them when you were way off the mark regarding the root cause for the wrong tessalation. I would try to read the relevant litrature from scratch, and implement all from scratch, while keeping in mind hte failure modes we have, and the actual mechanism to look for issues. I think the code got to a state where it is so complicated that it'll be easier to re-write it from scratch than to try and salvage everything from the mess that's there.", "quote_date": "2026-08-29", "ts": "2026-08-29T15:38:29Z", "writer": "coordinator"}, "scope": {"defect": "wall", "scene": "greets"}, "subject": "greets.displace.bake.strategy", "value": "rewrite", "_status": [], "_current": true, "_origin": "project", "_weight": 1, "_top": 5, "_family": "symbolic", "_human": true}, {"claim": "Against the reference relief renderer (the displaced-surface DEFINITION rendered per pixel with no tessellation), the tessellated bake sits p50 0.010-0.071 u / p90 0.058-1.224 u from it over stone pixels at eight review poses, with 37-83 % of stone pixels past 0.02 u and 4-42 % past 0.08 u.", "contract": "world_units_range", "evidence": [{"ref": "commit:6c50e5f0", "type": "battery"}, {"ref": "docs/DISPLACEMENT_RESEARCH_II.md", "type": "doc"}, {"ref": "docs/img/refrender/refrender_numbers.json", "type": "doc"}, {"note": "the REFERENCE side of the dz comparison: SolveRay (DeferredDisplaceRef.cpp:1204) with MarchCandidate (:1099) is the per-pixel march that renders the displaced-surface DEFINITION with no tessellation. The p50/p90 |dz| is the distance between what this ray solver returns and what the bake put there.", "ref": "code:FDS/RENDER/DeferredDisplaceRef.cpp#SolveRay", "type": "code"}, {"note": "the BAKE side of the same comparison: the tessellated stone displacement being measured against the reference (DEMO/MeshOps.cpp:2056). A dz reading moves if either side's code moves, so both are anchors.", "ref": "code:DEMO/MeshOps.cpp#DisplaceStoneSubdiv", "type": "code"}], "falsifier": "tools/refrender_diff.py at those poses on the tip binary reading a p50 outside 0.010-0.071 u", "id": "7ac873df0332", "kind": "measurement", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:13:29Z", "writer": "subagent:refrender"}, "scope": {"arm": "default", "defect": "wall", "detector": "refdiff", "granularity": "whole_frame", "metric": "refrender_dz_p50", "scene": "greets"}, "subject": "greets.displace.ref.bake_vs_reference_dz", "value": [0.01, 0.071], "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "The tessellated bake is FURTHER from the reference definition than the undisplaced wall is, at seven of eight review poses on the |dz| p50 (cam A 0.045 vs bare 0.027; corridor t=5534 0.071 vs 0.035); only the grazing close-up t=2845 has the bake closer (0.010 vs 0.022). Yardstick, not verdict: the bake was never built against this definition and the reference carries full relief at borders the bake pins to zero by design.", "contract": "state", "evidence": [{"ref": "commit:6c50e5f0", "type": "battery"}, {"ref": "docs/DISPLACEMENT_RESEARCH_II.md", "type": "doc"}, {"note": "the reference definition the 'further than bare' ordering is measured against - the tessellation-free per-pixel march (DeferredDisplaceRef.cpp:1204). The record's own caveat ('the reference carries full relief at borders the bake pins to zero by design') is a property of this solver's border handling.", "ref": "code:FDS/RENDER/DeferredDisplaceRef.cpp#SolveRay", "type": "code"}, {"note": "the bake whose p50 is being ordered against the bare wall's (DEMO/MeshOps.cpp:2056); the 'bare' arm is this same function with the displacement off, so the ordering is a property of this code, not of the scene file.", "ref": "code:DEMO/MeshOps.cpp#DisplaceStoneSubdiv", "type": "code"}], "falsifier": "more than one of the eight poses showing the bake p50 below the bare p50 under tools/refrender_diff.py", "id": "f47faa153876", "kind": "measurement", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:13:47Z", "writer": "subagent:refrender"}, "scope": {"arm": "default", "defect": "wall", "detector": "refdiff", "metric": "refrender_dz_p50", "scene": "greets"}, "subject": "greets.displace.ref.bake_further_than_bare", "value": "holds_7_of_8_poses", "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "The LITERAL candidate definition - the nearest base plane governing MEMBERSHIP - does not merely castellate, it deletes material: wherever the governing face height says air while a neighbour slab says solid, the point is air. A plane bisector is a NON-LOCAL partition, so a face seen edge-on has its plane nearest along an entire ray. Traced at cam A t=5965 px(1240,300): edge-on face 881 governs from t=5.58 while the pier own front faces begin at t=5.90, deleting the pier front surface over a 90 px band. The survey records that no source defines the bisector-partitioned union.", "contract": "state", "evidence": [{"ref": "commit:299d8046", "type": "single_run"}, {"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}, {"ref": "docs/DISPLACEMENT_RESEARCH_II.md", "type": "doc"}], "falsifier": "a grazing corner where partition=1 and partition=0 agree on the surface depth within the amplitude", "id": "e43c035dbedf", "kind": "trap", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:13:47Z", "writer": "subagent:refrender"}, "scope": {"defect": "wall", "detector": "refdiff", "flag": "greets_displace_ref_partition", "pose": "camA", "scene": "greets"}, "subject": "greets.displace.ref.bisector_partition_deletes_material", "value": "trap", "_status": ["floating", "floating_premise"], "_current": true, "_origin": "project", "_weight": 3, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "cot(phi/2) is the BISECTOR partition requirement, not every edge requirement. Sizing a SMOOTH seam by it (cot 5 deg = 11.4) replaced the curved wall with its tangent planes extended a whole unit, each strip standing proud of the curve by the sagitta and the pair mutually satisfying each other mitre trim. A crease is a corner and needs max(cot,tan)(phi/2); a smooth seam is one surface and needs only the mitre tan(phi/2). Max margin 1.059 -> 0.578 u.", "contract": "state", "evidence": [{"ref": "commit:44dad6ee", "type": "single_run"}, {"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "falsifier": "a smooth-seam margin of cot(phi/2) rendering the curved wall without tangent-plane facets", "id": "60e3e63bed65", "kind": "trap", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:13:47Z", "writer": "subagent:refrender"}, "scope": {"defect": "wall", "flag": "greets_displace_ref_margin", "scene": "greets", "tool": "DisplaceStoneSubdiv"}, "subject": "greets.displace.ref.smooth_seam_margin", "value": "trap", "_status": ["floating"], "_current": true, "_origin": "project", "_weight": 3, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "Adding --cull_front as a TERNARY over two copies of the backface dot product moved BOTH greets pins WITH THE FLAG OFF: under -ffp-contract=fast the duplicated expression contracts differently and flips faces sitting exactly on the plane. Written as (test) != cullFront, leaving the float expression textually unchanged, all six pins are identical. Any flag that branches around a float comparison must not restate the comparison.", "contract": "snapshot_md5", "evidence": [{"ref": "commit:6c50e5f0", "type": "md5_pin"}, {"ref": "commit:6c50e5f0", "type": "commit"}], "falsifier": "the ternary form reproducing all six pins on a clean rebuild", "id": "607c7cd2c810", "kind": "trap", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:14:10Z", "writer": "subagent:refrender"}, "scope": {"flag": "cull_front", "granularity": "binary", "scene": "greets", "tool": "zsh"}, "subject": "greets.displace.ref.fp_contract_backface", "value": "trap", "_status": ["floating"], "_current": true, "_origin": "project", "_weight": 4, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "The reference relief renderer default arm is BYTE-IDENTICAL to the parent commit bc9737a3 at 3 poses x 2 arms on the judging flags: camA bare 440deac28b1e9d1a38d3e5e61ab8d918 / disp dbe2d4c2716e2d762b366d5a45c151a6, H6194 bare 80f21d8517fa4909b8ce4d40a9815fcf / disp e2385cafaf64f068290bcadb7e2c4444, t5743 bare 43b459c14c4a968392386bb711b57f16 / disp 2568147a159488b603f147c7c7991d56. Proven against a fresh build of the parent, not assumed.", "contract": "snapshot_md5", "evidence": [{"ref": "commit:6c50e5f0", "type": "md5_pin"}, {"ref": "commit:bc9737a3", "type": "commit"}, {"note": "the code whose byte-nullness this pin asserts: the whole reference renderer is entered only through Render_GreetsDisplaceRef (DeferredDisplaceRef.cpp:1475, exported at :1728). With --greets_displace_ref off nothing in this file runs, which is what the 3 poses x 2 arms prove against a fresh build of the parent bc9737a3.", "ref": "code:FDS/RENDER/DeferredDisplaceRef.cpp#Render_GreetsDisplaceRef", "type": "code"}, {"note": "the ONLY touch the reference renderer has on the shipping path: the guarded call site `if (!skipVolumetric && FeatureFlags::greets_displace_ref()) Render_GreetsDisplaceRef(CurScene);` at RENDER.CPP:732-733, inside RenderPipeline::renderFrame (:460). The md5 the record carries is a whole-frame hash, so the frame builder is a genuine dependency of the VALUE even though the CLAIM is about the file above.", "ref": "code:FDS/RENDER/RENDER.CPP#renderFrame", "type": "code"}], "falsifier": "a rebuild of the tip producing a different md5 at cam A on the judging flags with the reference flag off", "id": "f2e480218158", "kind": "measurement", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:14:10Z", "writer": "subagent:refrender"}, "scope": {"arm": "bare", "pose": "camA", "recipe": "greets_acceptance", "scene": "greets"}, "subject": "greets.displace.ref.byte_identity", "value": "440deac28b1e9d1a38d3e5e61ab8d918", "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 4, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "Ten places the displaced-surface definition was ambiguous and had to be decided by the implementer, each recorded with its choice in docs/DISPLACEMENT_RESEARCH_II.md SS REF. Two are HIS to rule on: the partition (union membership shipped as default, the literal bisector rule kept at =1 and rendered beside it) and the castellation step itself (--greets_displace_ref_shared_edge makes it vanish, which is what the literature does). The other eight are engine-facing and were forced by the picture.", "contract": "look", "evidence": [{"ref": "docs/DISPLACEMENT_RESEARCH_II.md", "type": "doc"}, {"ref": "docs/img/refrender/camA_variants.png", "type": "image_read"}, {"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "falsifier": "his ruling on the partition and the step, which closes this", "id": "5463f141eb8f", "kind": "open", "provenance": {"head": "52770f70c039d8ea10fc0d902bc98544d0023045", "ts": "2026-08-29T21:14:10Z", "writer": "subagent:refrender"}, "scope": {"defect": "wall", "detector": "refdiff", "flag": "greets_displace_ref", "scene": "greets"}, "subject": "greets.displace.ref.model_ambiguities", "_status": ["not_authoritative"], "_current": true, "_origin": "project", "_weight": 2, "_top": 5, "_family": "human", "_human": false}, {"claim": "At a crease, displace the crease point by solving the two offset planes, u = d(n1+n2)/(1+n1.n2) (3x3 with the edge direction for unequal offsets) - never a normalised bisector. Sign-free at reflex corners; the only degeneracy is anti-parallel outward normals (a razor fin, material dihedral -> 0), handled by a mitre limit (SVG default 4). Every corner in greets caps at 2x the height.", "contract": "state", "evidence": [{"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "falsifier": "a crease vertex whose offset-plane solution lands off both offset planes, or a reflex corner in the scene where 1/sin(alpha/2) exceeds 2", "id": "f713599ea11d", "kind": "law", "provenance": {"head": "bc9737a364de4ca17abbbb471014cc45f461e571", "ts": "2026-08-29T20:23:11Z", "writer": "coordinator"}, "scope": {}, "subject": "displace.law.mitre_offset_planes", "value": "holds", "_status": ["floating", "floating_premise"], "_current": true, "_origin": "project", "_weight": 1, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "T-junctions and duplicate border vertices must be eliminated BEFORE displacement: a shared-border vertex is evaluated once and indexed from both sides (R1), the border owns its sample count (R2), border parameters are exact i/n (R3). Displacing a T-vertex by its own sampled height turns a sub-pixel raster crack into a full-amplitude hole.", "contract": "state", "evidence": [{"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "falsifier": "a hole pixel on a shared border of a mesh built under R1-R3", "id": "7453a529070e", "kind": "law", "provenance": {"head": "bc9737a364de4ca17abbbb471014cc45f461e571", "ts": "2026-08-29T20:23:11Z", "writer": "coordinator"}, "scope": {}, "subject": "displace.law.tjunctions_before_displacement", "value": "holds", "_status": ["floating", "floating_premise"], "_current": true, "_origin": "project", "_weight": 1, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "The displacement direction is a separate field from the shading normal: on a planar patch it is the face normal (nothing to pollute); the shading normal is n ~ N - grad_s h in the plane frame, exact on a plane, with split normals at creases (dihedral threshold) and never an average across a crease.", "contract": "state", "evidence": [{"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "falsifier": "a shading-normal angle error on a flat wall interior against the reference normal that is not explained by the amplitude/texel scale factor", "id": "420fcd4626b8", "kind": "law", "provenance": {"head": "bc9737a364de4ca17abbbb471014cc45f461e571", "ts": "2026-08-29T20:23:11Z", "writer": "coordinator"}, "scope": {}, "subject": "displace.law.direction_and_shading_separate", "value": "holds", "_status": ["floating", "floating_premise"], "_current": true, "_origin": "project", "_weight": 1, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "Corner definition for the rewrite: his decision is STEPS (union of independent slabs, castellated bisector step) but the literature has no cover for it - every crack-free multi-chart system enforces h1 = h2 along the shared crease (dominant-edge rule), which also makes the mitre well-defined. Decision pending his eye on the reference-render pair (default steps vs --greets_displace_ref_shared_edge).", "evidence": [{"ref": "docs/DISPLACEMENT_LITERATURE.md", "type": "doc"}], "id": "5a45f66b1478", "kind": "open", "provenance": {"head": "bc9737a364de4ca17abbbb471014cc45f461e571", "ts": "2026-08-29T20:23:11Z", "writer": "coordinator"}, "scope": {"defect": "wall", "scene": "greets"}, "subject": "greets.displace.corner_model", "_status": [], "_current": true, "_origin": "project", "_weight": null, "_top": null, "_family": null, "_human": false}, {"claim": "13 FeatureFlags rows deleted (2 unwired: vol_rect_cull, water_ripple_scale; 3 refuted: refl_skip_rain, refl_skip_post, mirror_mask_pool_clear, with the ON arms they gated; 8 byte-equal landed-AB hatches: cone_fine_tiles, vertex_light_parallel, tile_bbox_cull, xfrm_soa_inline, vol_cone_lane_vec, xpar_strip_extent, xpar_peel_early_out, deferred_tile_sphere_cull, ON branches inlined across 15 call sites) plus 9 stale status sentences rewritten: FeatureFl is doing real spike control and mode 3 is refuted as a candidate.", "contract": "hole_px", "evidence": [{"ref": "commit:57a859d1", "type": "single_run"}, {"ref": "docs/img/refrender/trimfix_camA.png", "type": "image"}, {"ref": "docs/img/refrender/trimfix_corridor5534.png", "type": "image"}], "falsifier": "a rebuild reporting a fallback count above 100 at cam A with the default flags, or a grown-pixel count above 6000", "id": "8ab9ddcb58e2", "kind": "measurement", "provenance": {"head": "ea4403dfa7574ea0c89db32ac5d5b31a0dce81ef", "ts": "2026-08-30T02:00:52Z", "writer": "subagent:refrender"}, "scope": {"arm": "ref", "defect": "wall", "detector": "refdiff", "flag": "greets_displace_ref_mitre_trim", "metric": "miss_px", "pose": "camA", "scene": "greets"}, "subject": "greets.displace.ref.miss_px", "value": 36, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 3, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "The crease census over 453 plane-pair junctions, 7375 u of crease and 1085232 samples: length-weighted |d_self - d_neighbour| p50 = 0.0057 u, p90 = 0.0149 u, max 0.1731 u against the height field own |d|max of 0.1641 u. By crease LENGTH, 73.3% is phase-shifted (best-lag correlation >= 0.8, mean |lag| 1.39 texels - the same relief out of phase, which a dominant-owner rule genuinely reconciles), 5.5% partly related, and 21.2% (1560 u) is TWO UNRELATED CHARTS (best-lag correlation < 0.4) that no blend can reconcile. The worst junctions by |dd| p90 (0.088-0.097 u) are exactly the low-correlation ones and their best-lag correlation never rises more than 0.04 above lag zero.", "contract": "share_pct", "evidence": [{"ref": "commit:9301308f", "type": "battery"}, {"ref": "commit:9301308f", "type": "commit"}], "falsifier": "a re-run of --greets_displace_ref_crease_scan=4 reporting an unrelated-chart share outside 20.7-21.7%", "id": "83aa7c0b6c4c", "kind": "measurement", "note": "this is a bound on what any corner rule in the renderer can achieve: on that 21% the disagreement is an authoring fact, and a dominant owner only picks a winner", "provenance": {"head": "ea4403dfa7574ea0c89db32ac5d5b31a0dce81ef", "ts": "2026-08-30T02:01:08Z", "writer": "subagent:refrender"}, "scope": {"arm": "ref", "defect": "wall", "detector": "refdiff", "flag": "greets_displace_ref_crease_scan", "granularity": "whole_frame", "metric": "crease_length_unrelated_charts", "scene": "greets"}, "subject": "greets.displace.ref.crease_disagreement", "value": 21.2, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "Confining the dominant-edge arm sampled march to the per-crease blend band (a closed-form t-interval per edge) instead of the whole face takes the pass from 3308 ms to 505 ms at cam A and 2514 ms to 349 ms at corridor, with the hit-mask, flags and faceId planes BIT-IDENTICAL, 2 differing depth pixels of 1880650, and a normal p99.9 of 0.022 deg with exactly one pixel over 1 deg. Where the two disagree it is the OLD arm bisection approximating a root the new arm now solves in closed form. The no-blend arm is untouched.", "contract": "frame_ms", "evidence": [{"ref": "commit:40540e6d", "type": "single_run"}, {"ref": "commit:40540e6d", "type": "commit"}], "falsifier": "the shared-edge pass at cam A taking over 1000 ms, or its hit mask differing from the whole-face-sampled implementation", "id": "75a1ca5fcd65", "kind": "measurement", "provenance": {"head": "ea4403dfa7574ea0c89db32ac5d5b31a0dce81ef", "ts": "2026-08-30T02:01:08Z", "writer": "subagent:refrender"}, "scope": {"arm": "ref_shared_edge", "defect": "wall", "flag": "greets_displace_ref_shared_edge", "metric": "refrender_pass_ms", "pose": "camA", "scene": "greets"}, "subject": "greets.displace.ref.blend_march_cost", "value": 505, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 3, "_top": 5, "_family": "numeric", "_human": false s", "_status": [], "_current": true, "_origin": "project", "_weight": null, "_top": null, "_family": null, "_human": false}, {"claim": "His fly-through of the rev-dispfix tip (a9277be8+: shoulder_plateau ON, tsplit, border_weld, mitre notch taper - H6194 5072 -> 478 holes, battery 10526 -> 2169): still broken, still a lot of tears. State 13 of the corpus. The old bake is not fixed by the taper round; v4 is the path.", "contract": "look", "evidence": [{"ref": "doc:coordinator transcript 2026-08-30", "type": "transcript"}, {"ref": "docs/BULGE_CORPUS.md", "type": "battery"}], "id": "b92297393de7", "kind": "verdict", "provenance": {"head": "e39d138b95458dba01df041ea5abfbd083d7072c", "quote": "the version in rev-dispfix is still broken - still a lot of tears.", "quote_date": "2026-08-30", "ts": "2026-08-30T15:44:39Z", "writer": "coordinator"}, "scope": {"arm": "dispfix_notch_taper", "defect": "tears", "scene": "greets", "state": "13"}, "subject": "greets.wall.look", "value": "broken_tears", "_status": [], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "human", "_human": true}, {"claim": "His observation on the rev-dispfix build under the judging arm: the shading is view-dependent in a way that reads wrong - suspected interaction of SSAO (+its flags) with the AO maps. No pose recorded yet; discriminator ladder issued (one flag off at a time: --no-ssao, --no-ssao_gtao, --no-ssao_temporal, --no-ssao_hdr_transport, --no-ao_map, --no-ao_direct).", "evidence": [{"ref": "doc:coordinator transcript 2026-08-30", "type": "transcript"}], "id": "42cebd0d0e79", "kind": "open", "provenance": {"head": "e39d138b95458dba01df041ea5abfbd083d7072c", "quote": "there is something werid in the shading - probably a mix of ssao (+flags) and ao. the shading is view dependent - which is pretty weird.", "quote_date": "2026-08-30", "ts": "2026-08-30T15:44:39Z", "writer": "coordinator"}, "scope": {"arm": "judging", "defect": "shading", "scene": "greets"}, "subject": "greets.shading.view_dependent", "_status": ["superseded"], "_current": false, "_origin": "project", "_weight": null, "_top": null, "_family": null, "_human": true}, {"claim": "Discriminator ladder result (his eye, main-tree build ebeac8ea, judging arm): --no-ssao removes the view-dependent shading entirely; --no-ssao_gtao (the pre-GTAO sampler) looks pretty ok; with GTAO on, --no-ssao_temporal / --no-ssao_hdr_transport / --no-ao_map / --no-ao_direct each leave it, and the most jarring part is near the TOP and LEFT edges of the screen. Localises the defect to the GTAO path at the screen origin - asymmetric, so a negative-offset clamp/truncation or the half-res buffer origin mapping is the suspect class.", "contract": "look", "depends_on": ["42cebd0d0e79"], "evidence": [{"ref": "doc:coordinator transcript 2026-08-30", "type": "transcript"}], "id": "d72feb6ec052", "kind": "verdict", "provenance": {"head": "ebeac8ea429758b7de4c0005b5d970584ab7aefd", "quote": "1 kills it. line 2 looks pretty ok. for the rest, the most jarring issue is near the top/left edges of the screen.", "quote_date": "2026-08-30", "ts": "2026-08-30T16:20:28Z", "writer": "coordinator"}, "scope": {"arm": "judging", "defect": "shading", "flag": "ssao_gtao", "scene": "greets"}, "subject": "greets.shading.view_dependent", "value": "ssao_gtao_edge_artifact", "_status": [], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "human", "_human": true}, {"claim": "The GTAO march hard 256-px screen-radius cap (FDS/RENDER/DeferredSSAO.cpp#gtaoCell / #gtaoRow8: srad = ssao_radius*FOVX/z clamped to [2,256]) BINDS on 92-100 % of covered pixels at the greets review poses, so the AO scale in this scene is set by the cap, not by --ssao_radius. From the --ssao_dump view-Z plane at 1920x1080 (FOVX=1728, --ssao_radius=4, the zfloor inert in greets) the unclamped srad median is 894 px at t=5965, 1034 at t=5743 and 9333 at t=6097, and the cap binds on 99.99 / 92.12 / 100.00 % of covered pixels.", "contract": "share_pct", "evidence": [{"ref": "docs/img/gtaoedge/poseA_t5965_edgeband.png", "type": "single_run"}, {"ref": "commit:4dfa8e14", "type": "commit"}], "falsifier": "Re-derive srad = ssao_radius*FOVX/viewZ from a fresh --ssao_dump Z plane at the same pose and flags and find the 256 cap binding on materially fewer than 92 % of covered pixels.", "id": "bfd122c99a15", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:49:32Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao", "metric": "pct_covered_px_where_cap_binds", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.srad_clamp", "value": 99.99, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 3, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "GTAO AO IS NOT A PROPERTY OF THE SCENE - it moves with the pixel grid, and the hemisphere sampler does not. Same camera, same geometry, same flags, only --force_xres/--force_yres changed: GTAO ao<0.9 = 73.7 % at 1280x720, 66.5 % at 1920x1080, 61.1 % at 2560x1440 (meanAO 0.7732 / 0.7795 / 0.7928) - a 12.6-POINT swing from resolution alone. The --no-ssao_gtao hemisphere control at the same two of those resolutions gives 44.4 % and 44.3 % (meanAO 0.8778 / 0.8776), i.e. FLAT. Mechanism: the 256-px cap binds, so the world AO radius is cap*viewZ/FOVX, and FOVX is proportional to XRes - the radius therefore scales with depth AND inversely with horizontal resolution. This is the view-dependent shading Gil-Ad reported, and it is why his ladder cleared --no-ssao_gtao.", "contract": "share_pct", "evidence": [{"ref": "commit:4dfa8e14", "type": "battery"}, {"ref": "docs/img/gtaoedge/poseA_t5965_edgeband.png", "type": "image"}], "falsifier": "Render the same greets pose and flags at 1280x720 / 1920x1080 / 2560x1440 with --ssao_dump and find the GTAO ao<0.9 fraction agreeing across the three to within a point, or find the hemisphere control disagreeing by more than a point.", "id": "a0fefb201622", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:49:50Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao", "metric": "pp_swing_in_ao_lt_0p9_over_1280_to_2560", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.resolution_dependence", "value": 12.6, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "Because srad is pinned at its 256-px cap, the band over which the GTAO march loses samples off the frame is 256 FULL-RES PX WIDE on every side - 61 % of a 1920x1080 frame. Measured with --ssao_edge_inset, which moves the border inward so the artifact can be profiled on interior content where an un-truncated reference exists: at the synthetic border the AO LIFTS by +0.06 to +0.12 (too bright: an off-frame sample is skipped, i.e. read as an open horizon) and decays to zero by 150-200 px inward. Whole-frame effect at cam A: meanAO 0.7795 -> 0.8406 at inset 128 and 0.8995 at inset 256.", "contract": "share_pct", "evidence": [{"ref": "commit:4dfa8e14", "type": "battery"}, {"ref": "docs/img/gtaoedge/poseA_t5965_edgeband.png", "type": "image"}], "falsifier": "Run --ssao_edge_inset=256 against inset 0 at the same pose and find the AO lift at the synthetic border below 0.02, or find it decaying over materially less than the srad the pose actually uses.", "id": "32d60f40a504", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:49:50Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao", "metric": "pct_of_1920x1080_frame_inside_the_256px_border_band", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.edge_band", "value": 61.0, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "THE BORDER INFORMATION LOSS ITSELF IS NOT TOP/LEFT-BIASED. Content-matched test (--ssao_edge_inset_side puts a synthetic border k px to the LEFT of a chosen pixel in one run and k px to its RIGHT in another, so the SAME pixels are compared): at the frame centre column/row of cam A the AO lift is LEFT +0.0633 vs RIGHT +0.1035 at k=32 (right WORSE) and TOP +0.0775 vs BOTTOM +0.0784 (equal). At k=128: LEFT +0.0159 / RIGHT +0.0581, TOP +0.0124 / BOTTOM +0.0300. So which side reads worst is set by where the occluders happen to lie, not by the algorithm - the only mechanism with a genuine top/left sign is the march-offset truncation (see greets.ssao.gtao.round_truncation), and that one is two orders of magnitude smaller.", "contract": "pct_delta", "evidence": [{"ref": "commit:4dfa8e14", "type": "battery"}], "falsifier": "Re-run the four --ssao_edge_inset_side arms at k=32 on the same pose and find LEFT exceeding RIGHT (or TOP exceeding BOTTOM) by more than 0.01 AO.", "id": "c7e54ee64e11", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:50:10Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_edge_inset_side", "metric": "ao_lift_left_minus_right_at_k32", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.edge_band.asymmetry", "value": -0.0402, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "REAL BUG, TOP/LEFT-SIGNED, SECOND ORDER. The GTAO march computed its sample pixel as `px + int(off + 0.5f)`, and C truncation toward zero makes that round-half-up ONLY for off >= -0.5; every negative offset lands ONE PIXEL SHORT. It does not average out over the rotations, because buildSliceTrig builds phi = (s + jit)*(PI/slices) with jit in [0,1], so phi never leaves [0,PI) and sin(phi) - the y component of every slice direction at all 16 rotations - is non-negative: every UP-going sample landed 1 px low and every LEFT-going sample 1 px right, while down/right were exact. Fixed by rounding to nearest (--ssao_gtao_round_fix, default ON, one instruction CHEAPER). Delta at cam A: rms 0.0044 AO, max 0.0908, 3.39 % of px move >0.01; asymmetric in the predicted direction - top 256-px band mean -0.00185 (6.82 % of px >0.01) vs bottom +0.00186 (1.12 %), left -0.00140 (4.24 %) vs right -0.00068 (0.03 %).", "contract": "pct_delta", "evidence": [{"ref": "commit:4dfa8e14", "type": "battery"}, {"ref": "docs/img/gtaoedge/poseA_t5965_edgeband.png", "type": "image"}], "falsifier": "Diff the --ssao_dump AO planes with and without --ssao_gtao_round_fix at cam A and find the rms below 0.001, or find the top-band and bottom-band means agreeing in sign and magnitude.", "id": "9f6575e68c03", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:50:20Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_round_fix", "metric": "rms_ao_delta_of_the_fix", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.round_truncation", "value": 0.0044, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "GATE RESULT for --ssao_gtao_round_fix default ON, NOT re-baselined (that is the owner call). --no-ssao_gtao_round_fix is BYTE-EXACT to the pre-fix binary (AO plane and colour PPM both cmp-identical at cam A). Differential over the pin battery on ONE binary: city t=1961, greets t=1588, fountain t=2500, chase x5, chase-cinematic x2 all BYTE-IDENTICAL between arms (14 pin images, 10 identical); the four greets ACCEPTANCE pins move, as an --ssao --ssao-gtao pin must if the fix is real - t5743 42.99 % of px, mean |d| 1.03, max 17; t2845 42.43 %, 1.03, max 7; t6097 34.76 %, 1.02, max 6; t6133 33.13 %, 1.02, max 5. render_gate 4/4 ALL PASS at the recorded baselines. warm_gate --full 6/7 with only greets-warm moving, and 7/7 ALL PASS with the fix off, so no other warm baseline is touched. NOTE the city pin FIRST run after the rebuild returned a stray hash 31035019; 6/6 later runs and both arms give bd4ffbf87d - the documented cold-cache first-run artifact, not a delta.", "contract": "state", "evidence": [{"ref": "commit:4dfa8e14", "type": "md5_pin"}, {"ref": "commit:4dfa8e14", "type": "battery"}], "falsifier": "Run the 14 pin images and both gate suites on one binary in the two arms and find a NON-ssao pin moving, or find --no-ssao_gtao_round_fix not byte-identical to the pre-fix binary.", "id": "05d9bc72538a", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:50:34Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "pin-battery-differential", "flag": "ssao_gtao_round_fix", "metric": "gate_outcome", "scene": "greets"}, "subject": "greets.ssao.gtao.round_fix.gates", "value": "byte-null-off-4-ssao-pins-move", "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "CLAMP-TO-EDGE SAMPLING DOES NOT FIX THE GTAO BORDER BAND HERE - IT OVERSHOOTS. --ssao_gtao_edge_clamp replaces the off-frame `continue` (open horizon) with a clamp of the sample coordinate into the frame. Measured against the synthetic border (--ssao_edge_inset=256, where the un-truncated answer exists): inside 256 px of that border the un-mitigated error is +0.0860 AO (too bright) and with edge_clamp it is -0.0361 (too DARK); mean |error| rises 0.0860 -> 0.1004, i.e. the mitigation makes it 16.8 % WORSE in absolute terms. Mechanism: a whole run of march steps collapses onto one border pixel, which reads as a solid occluder at a fixed angle. It is at least strictly localised - the interior delta is exactly 0.0000 - so it costs nothing outside the band. The other two arms priced at the same pose: --ssao_gtao_edge_fade=256 lifts the band +0.1032 (it simply DISCARDS the AO there, interior 0.0000); --ssao_gtao_srad_max=1024 moves the INTERIOR too (+0.0288) because the same 4 steps then span 1024 px and lose near-contact occlusion (meanAO 0.7796 -> 0.8111).", "contract": "pct_delta", "evidence": [{"ref": "commit:4dfa8e14", "type": "battery"}], "falsifier": "Run --ssao_edge_inset=256 with and without --ssao_gtao_edge_clamp at the same pose and find the mean |AO error| in the 256-px band FALLING rather than rising.", "id": "c1c3a8672b39", "kind": "refutation", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:53:48Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_edge_clamp", "metric": "pct_increase_in_mean_abs_border_error", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.edge_band.mitigation", "value": 16.8, "_status": [], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "--ssao_gtao_round_fix is PERF-NEUTRAL-TO-SLIGHTLY-CHEAPER, as its instruction count predicts (one _mm256_cvtps_epi32 replaces an _mm256_add_ps plus an _mm256_cvttps_epi32, per axis per sample). greets t=5743, 1920x1080, --deferred_prof=5 --bench iters=40, 11 INTERLEAVED runs per arm on ONE binary: renderFrame wall_min 45.845 ON vs 45.880 OFF (-0.08 %); the ssao wave 6.964 vs 7.038 (-1.05 %); ssao-march 4.895 vs 4.941 (-0.93 %). A separate earlier 11x11 battery gave renderFrame -0.299 ms (-0.64 %). Every figure is INSIDE the +/-1.5-2 % placement floor, so the claim is neutrality, not a win - but the sign is the same in both batteries and in both the min and the median.", "contract": "pct_delta", "evidence": [{"ref": "commit:4dfa8e14", "type": "min_of_11_interleaved"}], "falsifier": "Re-run 11 interleaved --bench pairs at t=5743 and find renderFrame wall_min differing by more than the +/-1.5-2 % placement floor in either direction.", "id": "1a94791af617", "kind": "measurement", "provenance": {"head": "4dfa8e145cff740be5b2392d43a4998fd2f98dc5", "ts": "2026-08-30T16:53:49Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_round_fix", "metric": "renderFrame_wall_min_pct_delta", "pose": "t5743", "scene": "greets"}, "subject": "greets.ssao.gtao.round_fix.frame_ms", "value": -0.08, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "NOT RE-BASELINED - the four candidate greets ACCEPTANCE pin values with --ssao_gtao_round_fix ON, recorded so the re-pin is a decision someone makes rather than a side effect. 2/2 stable each, final binary, stock rev.cfg 1920x1080, recipe exactly the gates-table row: t=5743 a7fa9214105fe7501d2d927427c0690e, t=2845 8593c7128d3915c2221b4a5123bb665e, t=6097 4ea379d0daa9593779fb06a3d4c8ee00, t=6133 03160c827e4946d0ecebf5ba1ff8d5d9. THE STANDING PINS ARE INTACT: the same binary with --no-ssao_gtao_round_fix reproduces all four 2026-08-16y values EXACTLY (440aa6bbb350ae95fbacf339dd2ad957 / 00d17bc5610624bd1fea698c4b096979 / 29c1e7fbd30e9ef811588a63d0778b7b / bc1b0a8a703d6d6f6b3953eafc864d48), so the flag off is byte-null against the countersigned baseline, not merely against another build of itself.", "contract": "state", "evidence": [{"ref": "commit:af95705d", "type": "md5_pin"}], "falsifier": "Run the four acceptance-pin recipes with --no-ssao_gtao_round_fix and find any of the four 2026-08-16y hashes NOT reproducing, or run them with the flag on and get a hash other than the four above.", "id": "c6f27da7386c", "kind": "measurement", "provenance": {"head": "af95705d5360e63e56858a3afffb1505becf9ad4", "ts": "2026-08-30T16:55:58Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_round_fix", "metric": "candidate_pin_values", "scene": "greets"}, "subject": "greets.ssao.gtao.round_fix.pin_values", "value": "pins-move-not-rebaselined", "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 4, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "RE-TESTED ON HIS EXACT VIEW CLASS AND IT STILL IS NOT TOP/LEFT - IF ANYTHING IT IS BOTTOM/RIGHT. Four content-matched probes (--ssao_edge_inset_side, the SAME pixels with a synthetic border 32 px to each side), including the corridor pose t=5534 whose LEFT WALL is grazing (|N.V| 0.27-0.47) and whose CEILING near the top of the frame is near-parallel (|N.V| 0.122) - the class the observation named. AO lift L/R/T/B: pose A centre 0.063/0.104/0.078/0.078; pose A top-left grazing wall (320,200) 0.043/0.197/0.152/0.075; corridor left wall (320,200) 0.027/0.015/0.001/0.090; corridor grazing ceiling (700,120) 0.027/0.051/0.016/0.044. The worst side tracks WHERE THE OCCLUDERS ARE, not the screen axis. The decisive form of the question - a corner is only ever exposed to ITS two borders - MIRRORED-CORNER TEST at identical inset magnitudes (288 px horizontal, 168 px vertical): pose A top-left loses 0.1942 AO total vs BOTTOM-RIGHT 0.4788; corridor top-left 0.0277 vs bottom-right 0.2977. In visible 8-bit levels on the lit frame the same ordering holds (A: 17.2 vs 36.8; corridor: 2.2 vs 33.5), and the bottom-right corner is the DARKER of the two (luma 49/63 vs 98/123), so it is not hidden by low contrast either.", "contract": "pct_delta", "evidence": [{"ref": "commit:af95705d", "type": "battery"}], "falsifier": "Repeat the mirrored-corner test (border 32 px from a probe 320/200 in from each corner, identical inset magnitudes) at any greets review pose and find the TOP-LEFT corner losing more AO than the BOTTOM-RIGHT one.", "id": "0d44df27177b", "kind": "measurement", "provenance": {"head": "d24e53df3a11850a749f5e3070c95ba29cebf9ad", "ts": "2026-08-30T17:13:29Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_edge_inset_side", "metric": "topleft_minus_bottomright_total_border_ao_loss", "pose": "t5965-and-t5534", "scene": "greets"}, "subject": "greets.ssao.gtao.edge_band.asymmetry", "value": -0.2846, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "THE STRUCTURAL FIX WORKS: front-loaded march steps plus a cap large enough to stop binding collapse GTAO's resolution dependence to the hemisphere sampler's level. Same camera, same geometry, only --force_xres/--force_yres changed; ao<0.9 spread over 1280x720 / 1920x1080 / 2560x1440. Pose A: uniform+cap256 12.4 pp -> geometric+cap512 3.5 -> +cap1024 3.3 -> +cap4096 (cap binds 0.00 %) 0.47 pp, against the hemisphere control's 0.2 pp. Pose B: 8.6 -> 5.1 -> 1.7 -> 0.21 pp, hemisphere 0.5. meanAO at pose A goes 0.7729/0.7793/0.7925 (spread 0.0196) to 0.7780/0.7800/0.7821 (spread 0.0041). Pose C does NOT converge (5.9 -> 5.2 pp at cap 1024, 5.6 at cap 4096) and it is not a failure of the lever: at view-Z median 0.74 the authored 4-unit radius subtends more than the whole frame, the cap still binds on 84-99 % of pixels, and no screen-space method can carry that radius there. GEOMETRIC SPACING IS WHAT MAKES THE RAISED CAP USABLE: at cap 1024 the four steps land at 5.1/26.1/133.2/681.0 px instead of uniform's 192/448/704/960, and uniform at the same cap costs +0.0290 AO of interior contact occlusion where geometric costs +0.0152.", "contract": "share_pct", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "battery"}, {"ref": "docs/img/gtaoedge/poseA_t5965_stepdist_3panel.png", "type": "image"}], "falsifier": "Render pose A at the three resolutions with --ssao_gtao_step_dist=1 --ssao_gtao_srad_max=4096 and find the ao<0.9 fraction spreading by more than ~1 pp, or find the cap still binding there.", "id": "6c0f5448991c", "kind": "measurement", "provenance": {"head": "d24e53df3a11850a749f5e3070c95ba29cebf9ad", "ts": "2026-08-30T17:18:02Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_step_dist", "metric": "pp_spread_of_ao_lt_0p9_over_1280_to_2560_at_cap4096", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.resolution", "value": 0.47, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "The front-loaded ladder roughly HALVES the border error in the strip where he said it is most jarring, and pays a little for it further in. Content-matched (--ssao_edge_inset=256, cam A 1920x1080), mean AO error by distance inward from the synthetic border, averaged over all four sides: 0-16 px +0.0716 -> +0.0404 (-44 %), 0-32 px +0.0640 -> +0.0299 (-53 %), 0-64 px +0.0438 -> +0.0225 (-49 %), 64-128 px +0.0105 -> +0.0118, 128-256 px +0.0036 -> +0.0058. The band-vs-interior gap on the untouched frame goes +0.0226 (uniform/256) to -0.0015 (geometric/1024) at pose A. CAVEAT STATED BECAUSE IT MATTERS: a 256-px inset fully accounts for a 256-px march but only partly for a ~894-px one, so the geometric arm's TOTAL border sensitivity is UNDER-measured by this instrument; the near-edge profile is the comparable statistic, the whole-frame mean is not (0.1200 vs 0.1249 is instrument, not physics).", "contract": "pct_delta", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "battery"}], "falsifier": "Run --ssao_edge_inset=256 on both arms at cam A and find the 0-32 px mean AO error of the geometric arm within 20 % of the uniform arm's, or larger.", "id": "5f95e8304799", "kind": "measurement", "provenance": {"head": "d24e53df3a11850a749f5e3070c95ba29cebf9ad", "ts": "2026-08-30T17:18:02Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_step_dist", "metric": "pct_change_in_border_ao_error_0_to_32px", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.edge_band", "value": -53.0, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "COST-NEUTRAL, and the SSAO wave itself is slightly CHEAPER. greets t=5743, 1920x1080, --deferred_prof=5 --bench iters=40, 11 INTERLEAVED runs per arm on ONE binary, wall_min: renderFrame 49.792 (uniform/256) vs 49.853 (geometric/1024), +0.061 ms = +0.12 %, inside the +/-1.5-2 % placement floor; the ssao wave 7.140 -> 6.853 (-4.02 %) and ssao-march 5.007 -> 4.728 (-5.57 %), with the medians agreeing in sign (renderFrame median is LOWER for the geometric arm, 50.336 vs 51.482). Mechanism for the march being cheaper rather than dearer: the step count is unchanged, but a ~894-px march puts more samples OFF-FRAME, and the off-frame path skips the depth gather, both gtaoAcos calls and the bitmask build - and a whole 8-lane batch with no live sample takes the `if (!any) continue` exit. The per-cell ladder constants cost two quadratic minimax evaluations, not libm.", "contract": "pct_delta", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "min_of_11_interleaved"}], "falsifier": "Re-run 11 interleaved --bench pairs at t=5743 and find renderFrame wall_min for the geometric arm more than the +/-1.5-2 % placement floor above the uniform arm.", "id": "846db4d1125f", "kind": "measurement", "provenance": {"head": "d24e53df3a11850a749f5e3070c95ba29cebf9ad", "ts": "2026-08-30T17:18:03Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_step_dist", "metric": "renderFrame_wall_min_pct_delta", "pose": "t5743", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.frame_ms", "value": 0.12, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "LOOK CHANGE, NOT A DEFAULT FLIP, AND NOT RE-BASELINED. --ssao_gtao_step_dist=1 --ssao_gtao_srad_max=1024 moves the four greets acceptance pins hard, as a real change to the AO scale must: t=5743 96.04 % of px, mean |d| 6.53 on the moved, max 117; t=2845 95.83 %, 5.89, max 97; t=6097 96.40 %, 6.06, max 62; t=6133 94.89 %, 5.64, max 64. Candidate hashes, recorded so a future re-pin is a decision rather than a discovery: 2f6bae1ccd696b71c3fc15c118a635b3 / f1c93d5a4fe10d32cc99326c7c4636e1 / 94e0b137f558178fbb3fce9cb88a5c65 / d156692f65af52f16a9af1c8eaf5eb84. AT THEIR DEFAULTS (--ssao_gtao_step_dist=0) THE NEW FLAGS ARE BYTE-NULL: the same binary reproduces last round's four round_fix-ON values exactly (a7fa9214.. / 8593c712.. / 4ea379d0.. / 03160c82..) and, with --no-ssao_gtao_round_fix as well, the countersigned 2026-08-16y values (440aa6bb.. / 00d17bc5..).", "contract": "state", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "md5_pin"}, {"ref": "docs/img/gtaoedge/poseB_t5743_stepdist_3panel.png", "type": "battery"}], "falsifier": "Run the four acceptance-pin recipes with --ssao_gtao_step_dist=0 and fail to reproduce a7fa9214../8593c712../4ea379d0../03160c82.., or run them with the geometric arm and get hashes other than the four above.", "id": "a56c75eb638b", "kind": "measurement", "provenance": {"head": "d24e53df3a11850a749f5e3070c95ba29cebf9ad", "ts": "2026-08-30T17:18:21Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace", "flag": "ssao_gtao_step_dist", "metric": "acceptance_pin_delta", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.pins", "value": "look-change-pins-move-not-rebaselined", "_status": ["superseded"], "_current": false, "_origin": "project", "_weight": 5, "_top": 5, "_family": "symbolic", "_human": false}, {"claim": "BOTH OF HIS ARTIFACTS ARE ONE ROOT CAUSE, AND IT IS NOT A DEPTH-DISCONTINUITY BUG. Traced at t=5726 px(1129,225): the black saw-tooth column is NOT the near wall occluding the far background - those samples are correctly rejected (OUT-OF-RANGE, |d| = 31.5 against a 4 u radius). The black pixels are ON THE NEAR WALL, grazing, just inside its own silhouette, occluding THEMSELVES. Two guards were missing because the uniform ladder put the first sample 48-192 px out and never needed them. (a) THICKNESS: the bitmask back face is d - V*thickness, a flat world constant, so when |d| is much smaller than thickness it lands BEHIND the receiver and acos(dot(b,V)) saturates at PI - in the trace one sample at |d| = 0.066 set 11 of 32 sectors and one at 0.285 set THIRTY, and the saturation vanishes at the first step whose |d| (1.274) exceeds thickness (1.0). Fixed by --ssao_gtao_thick_clamp: back face bounded by min(thickness,|d|). (b) SELF-OCCLUSION: --ssao_bias is read ONLY by the hemisphere sampler, so GTAO shipped with no bias at all; at ~5 px the ZPage16 quantum (0.0025 u) and the half-res cell offset become a horizon at grazing incidence. Fixed by --ssao_gtao_bias (plane distance, AUTO 0.05 u). RESULTS at 1512x848 on his exact arm: t=5726 column fully-black fraction 32.90 % -> 0.03 % (std 0.343 -> 0.216); t=5836 column 8.23 % -> 0.00 % (std 0.280 -> 0.148, the shipped uniform arm is 0.147); t=5836 near-wall banding std 0.1462 -> 0.0725, BELOW the shipped uniform arm's 0.0796. Isolation: bias alone leaves 11.58 %/1.36 % black (the clamp owns the columns), clamp alone leaves the banding at std 0.139 (the bias owns the banding). --ssao_downscale=1 changes neither (37.59 %/9.86 % black), so the bilateral upsample is NOT implicated - that hypothesis is refuted.", "contract": "share_pct", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "battery"}, {"ref": "docs/img/gtaoedge/his/t5726_aodebug_3panel.png", "type": "image"}], "falsifier": "Render t=5726 at 1512x848 with --ssao_gtao_step_dist=1 --ssao_gtao_srad_max=1024 and the guards on, and find more than ~0.5 % of the column region x1090-1140 y150-380 below AO 0.15; or trace px(1129,225) and find its near samples not rejected.", "id": "e279eac2ea39", "kind": "measurement", "provenance": {"head": "8a4c0a76cae093663b2ad60236dbaadcfff9e5f2", "ts": "2026-08-30T19:19:19Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace-stepdist1-srad1024", "flag": "ssao_gtao_thick_clamp", "metric": "pct_fully_black_px_in_the_saw_tooth_column", "pose": "t5726", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.near_step_artifacts", "value": 0.03, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "THE HBAO-STYLE ANGLE BIAS IS THE WRONG FORM HERE - BUILT, MEASURED, REVERTED. The t=5726 trace made it look obviously right: the two self-samples sat at |d| 0.066 and 0.299 and BOTH at dot(d,N)/|d| = 0.070, a constant 4.0 deg tilt (the bump-perturbed G-buffer normal disagreeing with the real surface), which a scale-free angle threshold handles without eating far-field occlusion. Implemented as sin(elev) = dot(d,N)*dinv and measured: it does NOT fix the t=5836 grazing near-wall banding at all - std 0.166 at 0.05 and 0.163 at 0.10 against 0.146 unfixed, versus 0.073 for the plane-DISTANCE form. That wall's error is the ZPage16 depth quantum, a fixed SIZE, not a fixed angle. Generalising from one traced pixel to the whole defect class was the mistake. The distance form is what the flag ships; the angle form is recorded here and in the flag help so it is not re-derived from the same trace.", "contract": "pct_delta", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "battery"}], "falsifier": "Implement the angle form (dot(d,N)/|d| threshold) and find the t=5836 near-wall region x1350-1500 y300-500 AO std at or below the plane-distance form's 0.073.", "id": "5ffcbd4ab8a7", "kind": "refutation", "provenance": {"head": "8a4c0a76cae093663b2ad60236dbaadcfff9e5f2", "ts": "2026-08-30T19:19:19Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace-stepdist1-srad1024", "flag": "ssao_gtao_bias", "metric": "near_wall_ao_std_under_the_angle_bias_form", "pose": "t5836", "scene": "greets"}, "subject": "greets.ssao.gtao.bias_form", "value": 0.166, "_status": [], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "THE GUARDS ARE NOT FREE, and the full fixed arm now sits AT the placement floor rather than inside it. greets t=5743, 1920x1080, 11 INTERLEAVED --bench pairs on ONE binary, wall_min. Guards off vs on within the geometric/1024 arm: renderFrame 45.761 -> 46.491 (+0.730 ms, +1.60 %), the ssao wave 6.619 -> 7.131 (+7.74 %), ssao-march 4.549 -> 5.050 (+11.01 %). Shipped default (uniform/256) vs the FULL fixed arm (geometric/1024 + both guards), measured in one machine state: renderFrame 45.599 -> 46.237 (+0.638 ms, +1.40 %), ssao 6.865 -> 7.115 (+3.64 %), ssao-march 4.787 -> 5.049 (+5.47 %). Mechanism: the SIMD march MASKS rejected samples rather than branching around them, so a rejected sample costs its full arithmetic plus the guard; and the guards give back the off-frame early-out saving that made the unguarded geometric arm look free. This SUPERSEDES the +0.12 % figure filed for the unguarded arm as the cost of the shipped configuration.", "contract": "pct_delta", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "min_of_11_interleaved"}], "falsifier": "Re-run 11 interleaved --bench pairs at t=5743 comparing the shipped default with the full fixed arm and find renderFrame wall_min within +/-0.2 % of each other.", "id": "f555f3979175", "kind": "measurement", "provenance": {"head": "8a4c0a76cae093663b2ad60236dbaadcfff9e5f2", "ts": "2026-08-30T19:19:19Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace-stepdist1-srad1024-guards", "flag": "ssao_gtao_bias", "metric": "renderFrame_wall_min_pct_delta_vs_shipped_default", "pose": "t5743", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.frame_ms", "value": 1.4, "_status": ["superseded"], "_current": false, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "THE GUARDS DO NOT REGRESS THE RESOLUTION RESULT - THEY EXTEND IT TO THE ONE POSE THAT HAD REFUSED TO CONVERGE. meanAO spread over 1280x720 / 1920x1080 / 2560x1440 with the guards on: pose A 0.0059, pose B 0.0030, pose C 0.0010, against the shipped uniform arm's 0.0196 / 0.0192 / 0.0019 and the unguarded geometric arm's 0.0017 / 0.0046 / 0.0556. Pose C is the win: its self-occlusion was itself resolution-dependent, so removing it collapses a 0.0556 spread to 0.0010. ao<0.9 spreads are 2.6 / 4.5 / 0.8 pp against the shipped 12.4 / 8.6 / 5.9. The BORDER number gives some back: content-matched (--ssao_edge_inset=256, cam A) the near-edge AO error at 0-32 px is +0.0640 shipped, +0.0299 unguarded geometric, +0.0453 with the guards - still 29 % better than shipped, no longer 53 %.", "contract": "world_units", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "battery"}], "falsifier": "Render the three poses at the three resolutions with the guarded geometric arm and find any meanAO spread above ~0.01.", "id": "ab38cdd47b7e", "kind": "measurement", "provenance": {"head": "8a4c0a76cae093663b2ad60236dbaadcfff9e5f2", "ts": "2026-08-30T19:19:19Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace-stepdist1-srad1024-guards", "flag": "ssao_gtao_step_dist", "metric": "meanAO_spread_over_1280_to_2560", "pose": "t5965", "scene": "greets"}, "subject": "greets.ssao.gtao.step_dist.resolution", "value": 0.0059, "_status": ["unverified_at_tip"], "_current": true, "_origin": "project", "_weight": 5, "_top": 5, "_family": "numeric", "_human": false}, {"claim": "PIN DELTA FOR THE FULL FIXED ARM (geometric/1024 + both guards) vs the shipped default, NOT RE-BASELINED: t=5743 94.63 % of px moved, mean |d| 5.96, max 95, md5 03ad341ca0c84ceef2337d63b9ef6070; t=2845 96.28 %, 6.99, max 47, 6a900effaf25e97a9848a9ec043a6e30; t=6097 97.63 %, 6.70, max 72, 97b5490d0eb692d032044be094168bc3; t=6133 97.38 %, 6.12, max 59, 6af0b084a389c69fefd727e423bebb5f. BYTE-NULL AT DEFAULTS on the final binary: --ssao_gtao_step_dist is 0 by default, both guards are AUTO and therefore inert there, and all four shipped values reproduce exactly (a7fa9214.. / 8593c712.. / 4ea379d0.. / 03160c82..). THE LOOK TRADE HE MUST JUDGE, stated because it is large and I cannot call it: the guards remove a lot of AO on grazing near walls - t=5836 near wall meanAO 0.8378 unfixed -> 0.9671, against 0.9017 for the shipped uniform arm - because most of the darkening there WAS the self-occlusion. The dial is --ssao_gtao_bias: 0.03 gives 0.9561 (std 0.0924), 0.04 gives 0.9621 (0.0812, closest to the shipped arm's 0.0796), 0.05 = AUTO gives 0.9671 (0.0725), 0.10 gives 0.9864 (0.0376, clearly over-biased).", "contract": "state", "evidence": [{"ref": "code:FDS/RENDER/DeferredSSAO.cpp#gtaoCell", "type": "md5_pin"}, {"ref": "docs/img/gtaoedge/his/t5836_aodebug_3panel.png", "type": "battery"}], "falsifier": "Run the four acceptance-pin recipes with no extra flags on this binary and fail to reproduce a7fa9214../8593c712../4ea379d0../03160c82.., or run them with the full fixed arm and get hashes other than the four above.", "id": "6ad1e764fa10", "kind": "measurement", "provenance": {"head": "8a4c0a76cae093663b2ad60236dbaadcfff9e5f2", "ts": "2026-08-30T19:19:19Z", "writer": "subagent:gtaoedge"}, "scope": {"arm": "deferred-hdr-hdrlinear-tf2-ssao-gtao-displace-stepdist1-srad1024-guards", "flag": "ssao_gtao_bias", "metric" <script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const R = D.records, byId = {}, dependents = {}, supersededBy = {}, disputedBy = {};
for (const r of R) byId[r.id] = r;
for (const r of R) {
  for (const x of (r.depends_on||[])) (dependents[x] = dependents[x]||[]).push(r.id);
  for (const x of (r.supersedes||[])) (supersededBy[x] = supersededBy[x]||[]).push(r.id);
  if (r.kind==='dispute' && r.target) (disputedBy[r.target] = disputedBy[r.target]||[]).push(r.id);
}
const conflictsOf = {};
for (const [term, members] of Object.entries(D.conflicts||{})) for (const m of members) (conflictsOf[m]=conflictsOf[m]||[]).push(term);
const warnOf = {};
for (const [p, rr] of (D.warn_retry||[])) (warnOf[p]=warnOf[p]||[]).push(rr);

const ATT = [
  ['stale','Stale','depends on a superseded claim'],
  ['open','Open','contradictions on file — never auto-merged'],
  ['contract_conflict','Contract conflict','one subject, two value families'],
  ['weak_supersession','Weak supersession','a strict subject changed without top evidence'],
  ['disputed','Disputed','counter-evidence attached'],
  ['invalid_verdict','Invalid verdicts','no human authority behind them'],
  ['not_authoritative','Not authoritative','on a judged subject without human provenance'],
  ['warned','Warned proposals','a covering refutation is on file'],
  ['void','Void','below the floor for their scope'],
  ['unverified_at_tip','Unverified at tip','measured before the tip last changed code'],
  ['hypothesis','Hypotheses','no falsifier stated'],
  ['floating_premise','Floating premises','laws/traps a current record rests on, that rest on no measurement'],

const state = {q:'', kind:null, status:null, contract:null, scope:{}, prefix:null, showSup:false};

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const when = r => ((r.provenance||{}).ts||'').replace('T',' ').replace('Z','');
const short = s => (s||'').slice(0,12);

function refHtml(e){

    const sha = ref.slice(7);
    body = `<span class="ref" data-copy="${esc(sha)}" title="copy sha">${esc(sha.slice(0,10))}</span><button class="copy" data-copy="${esc(sha)}">copy</button>`;
  } else if (/^[a-z]+:/.test(ref) && !ref.startsWith('file:')) {
    body = `<span class="subj">${esc(ref)}</span>`;
  } else {
    const p = ref.replace(/^file:/,'').split('#')[0];
    const href = 'file://' + (D.root ? D.root.replace(/\/$/,'') + '/' : '') + p;
    body = `<a href="${esc(href)}" target="_blank" rel="noopener">${esc(ref)}</a>`;
  }
  return `<li class="ev"><span class="t">${t}</span>${body}${e.note?` <span class="count">— ${esc(e.note)}</span>`:''}</li>`;
}
function badges(r){
  const st = r._status.filter(s => s!=='superseded');
  if (!r._current) st.unshift('superseded');
  return st.map(s => `<span class="badge b-${esc(s)}">${esc(s.replace(/_/g,' '))}</span>`).join('');
}
function scopeChips(r){
  return Object.entries(r.scope||{}).sort().map(([k,v]) => {
    const on = state.scope[k]===String(v);
    return `<span class="chip${on?' on':''}" data-dim="${esc(k)}" data-val="${esc(v)}"><span class="k">${esc(k)}=</span>${esc(v)}</span>`;
  }).join('');
}
function quoteHtml(r){
  const p = r.provenance||{};
  if (!p.quote) return '';
  return `<blockquote class="quote">“${esc(p.quote)}”<span class="who">${esc(p.writer||'')}${p.quote_date?' · '+esc(p.quote_date):''}${r._human?' · human authority':''}</span></blockquote>`;
}
function card(r, compact){
  const val = fmtVal(r);
  const sec = [];
  if (val) sec.push(`<span>value <span class="v">${esc(val)}</span></span>`);
  if (r.contract) sec.push(`<span>contract <span class="v">${esc(r.contract)}</span></span>`);
  if (r._weight!=null) sec.push(`<span>evidence <span class="v">${r._weight}/${r._top}</span></span>`);
  if ((r.supersedes||[]).length) sec.push(`<span>supersedes ${r.supersedes.length} · because <span class="v">${r.reason?esc(r.reason):'(no reason recorded)'}</span></span>`);
  const chk = (r.evidence||[]).filter(e=>e.type==='check').pop();
  if (chk) sec.push(`<span>checked when filed: <span class="v">${esc(chk.note||'')}</span></span>`);
  if ((r.provenance||{}).head) sec.push(`<span>at <span class="v">${esc(short(r.provenance.head))}</span></span>`);
  if (when(r)) sec.push(`<span>${esc(when(r))}</span>`);
  sec.push(`<span class="id" data-copy="${esc(r.id)}" title="copy id">${esc(r.id)}</span>`);
  const origin = r._origin!=='project' ? `<span class="origin">${esc(r._origin)}</span>` : '';
  const open = expanded.has(r.id);
  return `<article class="card${r._current?'':' sup'}" data-id="${esc(r.id)}">
    <div class="top"><span class="kind">${esc(r.kind)}</span>${badges(r)}${origin}<span class="subj"><b>${esc(r.subject)}</b></span></div>
    <div class="claim" data-toggle="${esc(r.id)}">${esc(r.claim)}</div>
    ${quoteHtml(r)}
    <div class="scope">${scopeChips(r)}</div>
    <div class="sec">${sec.join('')}</div>
    ${open ? why(r) : ''}
  </article>`;
}
function depTree(id, seen, depth){
  const r = byId[id]; if (!r) return `<div class="dep"><span class="subj">${esc(id)}</span> (not on file)</div>`;
  if (seen.has(id) || depth>5) return '';
  seen.add(id);
  const kids = (r.depends_on||[]).map(x => depTree(x, seen, depth+1)).join('');
  const st = r._current ? badges(r) : '<span class="badge b-superseded">superseded</span>';
  return `<div class="dep">${st} <span class="subj">${esc(r.subject)}</span> — ${esc(r.claim)} <span class="id" data-copy="${esc(r.id)}">${esc(r.id)}</span>${kids}</div>`;
}
function chain(r){
  const older = [], newer = []; const seen = new Set([r.id]);
  let frontier = [r.id];
  while (frontier.length){ const nxt=[]; for (const id of frontier) for (const o of (byId[id]?byId[id].supersedes||[]:[])) if (!seen.has(o)){seen.add(o); older.push(o); nxt.push(o);} frontier = nxt; }
  frontier = [r.id];
  while (frontier.length){ const nxt=[]; for (const id of frontier) for (const n of (supersededBy[id]||[])) if (!seen.has(n)){seen.add(n); newer.push(n); nxt.push(n);} frontier = nxt; }
  const all = [...newer.reverse(), r.id, ...older].map(id => byId[id]).filter(Boolean);
  all.sort((a,b) => (when(b)+b.id).localeCompare(when(a)+a.id));
  if (all.length<2) return '';
  return `<div class="full"><h4>Supersession chain (newest on top)</h4><ul class="tl">${all.map(x => {
    const p = x.provenance||{};
    const why_ = (x.supersedes||[]).length ? `<br><span class="count">because: ${x.reason?esc(x.reason):'(no reason recorded)'}</span>` : '';
    return `<li class="${x._current?'cur':''}"><span class="when">${esc(when(x))}</span> · ${esc(p.writer||'')} · <span class="v">${esc(fmtVal(x))}</span>${x.id===r.id?' <b>(this)</b>':''}<br>${esc(x.claim)}${why_}${p.quote?`<br><i>“${esc(p.quote)}”</i>`:''} <span class="id" data-copy="${esc(x.id)}">${esc(x.id)}</span></li>`;}).join('')}</ul></div>`;
}
function why(r){
  const parts = [];
  parts.push(`<div><h4>Evidence</h4>${(r.evidence||[]).length?`<ul>${r.evidence.map(refHtml).join('')}</ul>`:'<span class="count">none</span>'}</div>`);
  parts.push(`<div><h4>Falsifier</h4>${r.falsifier?esc(r.falsifier):'<span class="count">none stated — this is a hypothesis</span>'}</div>`);
  if ((r.depends_on||[]).length) parts.push(`<div class="full"><h4>Depends on</h4>${r.depends_on.map(x => depTree(x, new Set([r.id]), 0)).join('')}</div>`);
  const deps = dependents[r.id]||[];
  if (deps.length) parts.push(`<div class="full"><h4>Depended on by</h4>${deps.map(x => depTree(x, new Set([r.id]), 4)).join('')}</div>`);
  parts.push(chain(r));
  const dis = disputedBy[r.id]||[];
  if (dis.length) parts.push(`<div class="full"><h4>Disputes</h4>${dis.map(x => depTree(x, new Set(), 4)).join('')}</div>`);
  const cf = conflictsOf[r.id]||[];
  if (cf.length) parts.push(`<div class="full"><h4>In conflict sets</h4><ul>${cf.map(t => `<li><span class="subj">${esc(t)}</span>: ${(D.conflicts[t]||[]).filter(m=>m!==r.id).map(m => `<span class="id" data-copy="${esc(m)}">${esc(m)}</span> ${byId[m]?esc(byId[m].subject):''}`).join(', ')}</li>`).join('')}</ul></div>`);
  const w = warnOf[r.id]||[];
  if (w.length) parts.push(`<div class="full"><h4>Covered by refutation</h4>${w.map(x => depTree(x, new Set(), 4)).join('')}</div>`);
  if (r.target) parts.push(`<div class="full"><h4>Disputes</h4>${depTree(r.target, new Set(), 4)}</div>`);
  return `<div class="why">${parts.join('')}</div>`;
}

function matches(r){
  if (!state.showSup && !r._current && !(state.status==='superseded')) return false;
  if (state.kind && r.kind!==state.kind) return false;
  if (state.status && !(state.status==='superseded' ? !r._current : r._status.includes(state.status))) return false;
  if (state.contract && r.contract!==state.contract) return false;
  for (const [k,v] of Object.entries(state.scope)) if (String((r.scope||{})[k])!==v) return false;
  if (state.prefix && !(r.subject===state.prefix || r.subject.startsWith(state.prefix+'.'))) return false;
  if (state.q){
    const hay = [r.subject, r.claim, fmtVal(r), (r.provenance||{}).quote, ...(r.evidence||[]).map(e=>e.type+' '+e.ref+' '+(e.note||''))].join(' ').toLowerCase();
    for (const w of state.q.toLowerCase().split(/\s+/).filter(Boolean)) if (!hay.includes(w)) return false;
  }
  return true;
}
function drawFilters(){
  const kinds = [...new Set(R.map(r=>r.kind))].sort();
  const contracts = [...new Set(R.map(r=>r.contract).filter(Boolean))].sort();
  let h = `<span class="lbl">kind</span>` + kinds.map(k => `<span class="chip${state.kind===k?' on':''}" data-kind="${esc(k)}">${esc(k)}</span>`).join('');
  h += `<span class="lbl" style="margin-left:10px">contract</span>` + contracts.map(c => `<span class="chip${state.contract===c?' on':''}" data-contract="${esc(c)}">${esc(c)}</span>`).join('');
  h += `<span class="chip x${state.showSup?' on':''}" data-sup="1" style="margin-left:10px">show superseded</span>`;
  const active = [];
  if (state.status) active.push(`<span class="chip on" data-status="${esc(state.status)}">status: ${esc(state.status)} ✕</span>`);
  if (state.prefix) active.push(`<span class="chip on" data-prefix="">subject: ${esc(state.prefix)} ✕</span>`);
  for (const [k,v] of Object.entries(state.scope)) active.push(`<span class="chip on" data-dim="${esc(k)}" data-val="${esc(v)}">${esc(k)}=${esc(v)} ✕</span>`);
  if (active.length) h += `<span class="lbl" style="margin-left:10px">active</span>` + active.join('');
  document.getElementById('filters').innerHTML = h;
}
function drawTree(){
  const root = {kids:{}, n:0};
  for (const r of R){ if (!r._current) continue; let node = root; node.n++; for (const seg of r.subject.split('.')){ node = node.kids[seg] = node.kids[seg] || {kids:{}, n:0}; node.n++; } }
  const walk = (node, path) => `<ul>${Object.keys(node.kids).sort().map(seg => {
    const child = node.kids[seg], p = path?path+'.'+seg:seg, has = Object.keys(child.kids).length>0, open = state.prefix && (state.prefix===p || state.prefix.startsWith(p+'.'));
    return `<li><div class="${state.prefix===p?'active':''}" data-prefix="${esc(p)}"><span class="tw">${has?(open?'▾':'▸'):''}</span>${esc(seg)}<span class="n">${child.n}</span></div>${has&&open?walk(child,p):''}</li>`;
  }).join('')}</ul>`;
  document.getElementById('tree').innerHTML = `<div class="${state.prefix?'':'active'}" style="padding:2px 4px;border-radius:4px;cursor:pointer;font-size:13.5px" data-prefix="">all <span class="n">${root.n}</span></div>` + walk(root, '');
}
function drawAttention(){
  const cur = R.filter(r=>r._current);
  let body = '';
  for (const [key,label,desc] of ATT){
    const hits = key==='invalid_verdict' ? R.filter(r=>r._status.includes(key)) : cur.filter(r=>r._status.includes(key));
    if (!hits.length) continue;
    const isOpen = openSec.has(key);
    body += `<div class="sec"><button data-sec="${key}"><span class="cnt b-${key}" style="background:var(--${key.replace('_at_tip','').replace('contract_conflict','open').replace('weak_supersession','stale').replace('invalid_verdict','open').replace('not_authoritative','void').replace('floating_premise','hypothesis')})">${hits.length}</span>${esc(label)}<span class="desc">${esc(desc)}</span><span class="arrow">${isOpen?'▾ hide':'▸ show'}</span></button>${isOpen?`<div class="body">${hits.map(r=>card(r)).join('')}</div>`:''}</div>`;
  }
  const nc = Object.keys(D.conflicts||{}).length;
  const hd = `<div class="hd"><span>Needs attention</span><span class="count">${cur.length} current of ${R.length} records · ${nc} conflict set${nc===1?'':'s'} · tip ${esc(D.tip_ref)} @ ${esc(short(D.tip))}</span></div>`;
  document.getElementById('attention').innerHTML = hd + (body || `<div class="calm">nothing needs attention.</div>`);
}
function groupInfo(hits){
  // subject -> {n: current authoritative records shown, dims: scope dimensions that differ}
  const g = {};
  for (const r of hits){ if (!r._current || r._status.includes('not_authoritative') || r.kind==='alias') continue; (g[r.subject]=g[r.subject]||[]).push(r); }
  const out = {};
  for (const [s, rs] of Object.entries(g)){
    if (rs.length<2) continue;
    const dims = [...new Set(rs.flatMap(r=>Object.keys(r.scope||{})))].sort().filter(d => new Set(rs.map(r=>String((r.scope||{})[d]??'∅'))).size>1);
    out[s] = {n: rs.length, dims};
  }
  return out;
}
function drawList(){
  const hits = R.filter(matches).sort((a,b)=> a.subject.localeCompare(b.subject) || (when(b)).localeCompare(when(a)));
  const gi = groupInfo(hits); let last = null, h = '';
  for (const r of hits){
    if (r.subject!==last && gi[r.subject]) h += `<div class="grp"><b>${esc(r.subject)}</b> · ${gi[r.subject].n} current records · differ by ${esc(gi[r.subject].dims.join(' / ')||'nothing')} · no single current value</div>`;
    last = r.subject; h += card(r);
  }
  document.getElementById('list').innerHTML = `<h2>${hits.length} record${hits.length===1?'':'s'}</h2>` + (hits.length ? h : `<div class="empty">nothing matches — clear a filter</div>`);
}
function draw(){ drawFilters(); drawTree(); drawAttention(); drawList(); }
document.getElementById('meta').textContent = `${R.length} records · generated ${D.generated} · ${D.root}`;
document.getElementById('q').addEventListener('input', e => { state.q = e.target.value; drawList(); });
document.body.addEventListener('click', e => {
  const t = e.target.closest('[data-copy],[data-toggle],[data-kind],[data-contract],[data-status],[data-prefix],[data-dim],[data-sec],[data-sup]');
  if (!t) return;
  if (t.dataset.copy!=null){ navigator.clipboard && navigator.clipboard.writeText(t.dataset.copy); const o=t.textContent; t.textContent='copied'; setTimeout(()=>t.textContent=o, 700); return; }
  if (t.dataset.toggle!=null){ const id=t.dataset.toggle; expanded.has(id)?expanded.delete(id):expanded.add(id); draw(); return; }
  if (t.dataset.sec!=null){ const k=t.dataset.sec; openSec.has(k)?openSec.delete(k):openSec.add(k); drawAttention(); return; }
  if (t.dataset.sup!=null){ state.showSup=!state.showSup; draw(); return; }
  if (t.dataset.kind!=null){ state.kind = state.kind===t.dataset.kind?null:t.dataset.kind; draw(); return; }
  if (t.dataset.contract!=null){ state.contract = state.contract===t.dataset.contract?null:t.dataset.contract; draw(); return; }
  if (t.dataset.status!=null){ state.status = state.status===t.dataset.status?null:t.dataset.status; draw(); return; }
  if (t.dataset.prefix!=null){ state.prefix = t.dataset.prefix || null; draw(); return; }
  if (t.dataset.dim!=null){ const k=t.dataset.dim, v=t.dataset.val; if (state.scope[k]===v) delete state.scope[k]; else state.scope[k]=v; draw(); return; }
});
draw();
})();
</script>
