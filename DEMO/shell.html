<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>REVIVAL / FLOOD</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; color: #ccc;
                   font: 14px/1.3 sans-serif; height: 100%; overflow: hidden; }
      /* Center canvas inside the viewport. Black surroundings show as
         letterbox bars whenever canvas AR != viewport AR. */
      body { display: flex; align-items: center; justify-content: center; }
      #status { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px;
                background: rgba(0,0,0,0.6); font-size: 12px;
                pointer-events: none; }
      #status.hidden { display: none; }
      /* Canvas backing-store dims now equal the engine surface dims
         (AR-clamped, /8-snapped) — V_Flip's RenderCopy is a 1:1 memcpy
         instead of a scale-blit, and the bars come from CSS. width/height
         auto + max-width/height let the browser preserve AR while fitting
         the viewport. */
      canvas { background: #000; display: block; image-rendering: pixelated;
               width: auto; height: auto;
               max-width: 100vw; max-height: 100vh; }
      /* Bottom-right control bar: mute / HiDPI / fullscreen. Stays on top
         of the canvas (z-index) and ignores its own click events from
         reaching the demo (each button only flips its own state). */
      #controls { position: fixed; bottom: 12px; right: 12px; display: flex;
                  gap: 6px; z-index: 100; }
      #controls button { background: rgba(0,0,0,0.6); color: #fff;
                         border: 1px solid rgba(255,255,255,0.3);
                         border-radius: 4px; padding: 8px 12px;
                         font: 16px/1 sans-serif; cursor: pointer;
                         min-width: 44px; min-height: 44px;
                         user-select: none; -webkit-tap-highlight-color: transparent; }
      #controls button:hover { background: rgba(0,0,0,0.85); }
      #controls button:active { background: rgba(255,255,255,0.2); }
      /* Auto-hide: fade out after a few seconds of mouse inactivity, fade
         back in when the cursor approaches the bottom of the viewport. */
      #controls { transition: opacity 0.25s ease-out; }
      #controls.idle { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Diagnostic-log capture. We also keep a buffered copy of every
         [coop-diag] / [audio-diag] line so we can dump them into the
         on-screen error panel when the demo can't start (mostly so
         Firefox Mobile users — who can't readily inspect the JS console
         — can copy useful info out of the page itself). Captures
         console.log + console.error output that starts with one of our
         tag prefixes. -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var diagLog = [];
        window.__diagLog = diagLog;
        function tagged(args) {
          var s = '';
          for (var i = 0; i < args.length; ++i) {
            s += (i ? ' ' : '') + args[i];
          }
          return /^\[(coop|audio)-diag\]/.test(s) ? s : null;
        }
        var origLog = console.log.bind(console);
        var origErr = console.error.bind(console);
        console.log = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origLog.apply(null, arguments);
        };
        console.error = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origErr.apply(null, arguments);
        };

        function snap(label) {
          if (navigator.serviceWorker) {
            try {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                console.log('[coop-diag] ' + label + ' regs=' + regs.length +
                  regs.map(function(r){
                    return ' [scope=' + r.scope +
                      ' active=' + !!r.active +
                      ' installing=' + !!r.installing +
                      ' waiting=' + !!r.waiting + ']';
                  }).join(''));
              });
            } catch (e) {
              console.log('[coop-diag] ' + label + ' getRegistrations err: ' + e.message);
            }
          }
          console.log('[coop-diag] ' + label +
            ' isSecureContext=' + window.isSecureContext +
            ' crossOriginIsolated=' + window.crossOriginIsolated +
            ' UA=' + navigator.userAgent.slice(0, 80) +
            ' hasNetscape=' + (typeof netscape !== 'undefined') +
            ' hasChrome=' + (typeof chrome !== 'undefined') +
            ' SW=' + !!navigator.serviceWorker +
            ' SWController=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) +
            ' SAB=' + (typeof SharedArrayBuffer !== 'undefined') +
            ' sessionStorage=' + (function(){try{window.sessionStorage.length;return 'ok';}catch(e){return 'blocked:'+e.message;}})()
          );
        }
        snap('initial');
        setTimeout(function(){ snap('+1s'); }, 1000);
        setTimeout(function(){ snap('+3s'); }, 3000);
      })();
    </script>
    <!-- Browser-specific coi-serviceworker config. Firefox Android (UA
         contains "Android" + "Firefox") has been observed not isolating
         the top-level document under COEP credentialless even with
         coi-serviceworker active and the SW controlling the page
         (crossOriginIsolated=false despite SWController=true). Forcing
         require-corp seems to fix it; same-origin assets get an explicit
         CORP from the SW so require-corp's stricter rules are satisfied. -->
    <script>
      var ua = navigator.userAgent || '';
      if (ua.indexOf('Android') >= 0 && ua.indexOf('Firefox') >= 0) {
        window.coi = window.coi || {};
        window.coi.coepCredentialless = function() { return false; };
        console.log('[coop-diag] FF Android detected; forcing require-corp');
      }
    </script>
    <!-- coi-serviceworker injects COOP/COEP headers so SharedArrayBuffer
         (required for our pthread build) works on hosts like GitHub Pages
         that don't support custom HTTP headers. No-op on emrun, which
         already sets the headers itself. -->
    <script src="coi-serviceworker.js"></script>
    <script>
      // Friendly error if cross-origin isolation never activates.
      // Includes the captured [coop-diag] / [audio-diag] log so people
      // diagnosing on a phone (or anyone without a JS console handy)
      // can copy actionable info straight out of the page.
      (function() {
        if (typeof window === 'undefined') return;
        setTimeout(function() {
          if (window.crossOriginIsolated) return;
          var msg = (
            "Couldn't enable cross-origin isolation in this browser. " +
            "REVIVAL needs SharedArrayBuffer to run its render workers. " +
            "Common causes:\n\n" +
            "  - Private / incognito browsing (Firefox disables service workers there)\n" +
            "  - Outdated browser (need Chrome 92+, Firefox 79+, Safari 15.2+)\n" +
            "  - Some Firefox Mobile setups\n\n" +
            "Try a regular (non-private) tab in an up-to-date Chrome or Firefox."
          );
          var diag = (window.__diagLog || []).join('\n');
          var div = document.createElement('div');
          div.style.cssText =
            'position:fixed;inset:0;background:#000;color:#ccc;' +
            'font:14px/1.4 sans-serif;padding:2em;white-space:pre-wrap;' +
            'z-index:99999;overflow:auto;';
          div.textContent = msg + '\n\n--- diagnostic log ---\n' + diag;
          document.body.appendChild(div);
          console.error(msg);
        }, 4000);
      })();
    </script>
    <div id="status">Downloading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="controls">
      <button id="btn-mute" title="Mute / unmute audio" aria-label="Mute">🔊</button>
      <button id="btn-hidpi" title="Toggle high-DPI rendering" aria-label="HiDPI">SD</button>
      <button id="btn-fullscreen" title="Toggle fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
    <script>
      var statusEl = document.getElementById('status');
      var canvasEl = document.getElementById('canvas');
      function setStatus(text) {
        if (!text) { statusEl.classList.add('hidden'); return; }
        statusEl.classList.remove('hidden');
        statusEl.textContent = text;
      }
      // ?editor in the URL → surface-editor mode. Read in C++ (DemoBoot) to
      // boot greets-only/mirror-off, and here to show the surface panel.
      var revEditorMode = /[?&]editor\b/.test(location.search);
      var Module = {
        canvas: canvasEl,
        setStatus: setStatus,
        revEditorMode: revEditorMode ? 1 : 0,
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left
            ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : '');
        },
        // Flip the guard once main() returns so late-firing DOM events
        // (resize, mousemove, fullscreenchange) can't call into a torn-down
        // wasm runtime — that path used to throw "called after runtime
        // exit" assertions in the console.
        onExit: function() { runtimeExited = true; },
        // Once wasm exports are ready, re-apply the HD/SD font scale
        // (the boot-time applyHidpi() ran before _SDL2_SetFontScale
        // existed). Same for ?hidpi=1 in the URL.
        onRuntimeInitialized: function() {
          if (typeof applyHidpi === 'function') applyHidpi();
          if (revEditorMode && typeof initEditorPanel === 'function') initEditorPanel();
        }
      };

      // ---- Audio: AudioWorklet pump ---------------------------------
      // Replaces SDL2's emscripten ScriptProcessorNode path. The wasm
      // side calls Module._floodAudioStart() on user gesture; that
      // creates the AudioContext + worklet, hooks its 'needData' /
      // 'starve' messages back to a wasm-exported _Audio_FeedWorklet
      // function. Module._floodAudioStop() tears down at end of demo.
      // Browsers gate AudioContext.resume() on a user-gesture call stack.
      // The C-side state machine catches the click via SDL_PollEvent later,
      // by which point the gesture context is gone — ctx.resume() then
      // resolves but the context stays in "suspended" state and the worklet
      // never produces audio. Listen for the first click/keydown directly
      // in JS and kick off audio in that handler. The C side calls
      // _floodAudioStart() too once it sees the gesture; the second call
      // returns immediately because Module.__audioCtx is already set.
      function preArmAudio(e) {
        window.removeEventListener('pointerdown', preArmAudio);
        window.removeEventListener('keydown',     preArmAudio);
        console.log('[audio-diag] preArmAudio fired type=' + e.type +
          ' _floodAudioStart=' + (typeof Module._floodAudioStart) +
          ' _Audio_FeedWorklet=' + (typeof Module._Audio_FeedWorklet));
        if (Module._floodAudioStart) Module._floodAudioStart();
      }
      window.addEventListener('pointerdown', preArmAudio);
      window.addEventListener('keydown',     preArmAudio);

      Module._floodAudioStart = async function() {
        // Re-entry: __audioCtx is set only AFTER the first await chain
        // completes. Without a separate "starting" flag, two calls in
        // rapid succession (preArm click handler + C-side SDL2_StartMusic
        // from the next rAF tick) both pass the audioCtx guard, both
        // proceed, both build a worklet, both pump. The C side then
        // advances the song at 2× rate — sounds like fast-forwarding
        // after the first few seconds.
        if (Module.__audioStarting || Module.__audioCtx) {
          console.log('[audio-diag] _floodAudioStart re-entry; already started or starting');
          return;
        }
        Module.__audioStarting = true;
        console.log('[audio-diag] _floodAudioStart: creating AudioContext');
        var ctx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000
        });
        console.log('[audio-diag] AudioContext state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        await ctx.resume();
        console.log('[audio-diag] after resume() state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        try {
          await ctx.audioWorklet.addModule('audio-worklet.js');
          console.log('[audio-diag] addModule ok');
        } catch (e) {
          console.error('[audio-diag] addModule failed: ' + e.message);
          return;
        }
        var node = new AudioWorkletNode(ctx, 'flood-modplayer-worklet', {
          outputChannelCount: [2]
        });
        // Gain in the chain for mute. The wasm pump keeps running even
        // when muted (so position advances + unmute resumes mid-track),
        // we just zero the audible signal.
        var gain = ctx.createGain();
        gain.gain.value = muted ? 0 : 1;
        node.connect(gain).connect(ctx.destination);
        Module.__audioGain = gain;
        node.port.onmessage = function(e) {
          if (!Module.__audioMsgSeen) {
            Module.__audioMsgSeen = 1;
            console.log('[audio-diag] first port message from worklet: ' + (e.data && e.data.type));
          }
          if (Module.__muted) return;
          if (Module.__feeding) return; // re-entry guard
          Module.__feeding = true;
          try {
            if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
          } finally {
            Module.__feeding = false;
          }
        };
        Module.__audioCtx = ctx;
        Module.__audioNode = node;
        Module.__audioPort = node.port;
        console.log('[audio-diag] worklet wired up, kicking initial pump; ctx.state=' + ctx.state);
        // Kick off the ring with one pump so the worklet has data before
        // it asks for more.
        if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
        // Re-check ctx state on the next tick — if it's still 'suspended'
        // we have a gesture-context problem.
        setTimeout(function(){
          console.log('[audio-diag] +200ms ctx.state=' + ctx.state +
            ' modHandle_known_to_C=via_wasm');
        }, 200);
      };
      Module._floodAudioStop = function() {
        if (Module.__audioPort) Module.__audioPort.postMessage({ type: 'stop' });
        if (Module.__audioNode) try { Module.__audioNode.disconnect(); } catch (_) {}
        if (Module.__audioCtx) try { Module.__audioCtx.close(); } catch (_) {}
        Module.__audioCtx = Module.__audioNode = Module.__audioPort = null;
      };
      setStatus('Downloading...');
      window.onerror = function() {
        setStatus('Exception thrown, see console');
        setStatus = function(t) { if (t) console.error('[post-exception] ' + t); };
      };
      // The browser captures Tab (focus nav), function keys, arrows, etc.
      // before they reach SDL. Block default for keys the demo cares about.
      var swallowed = new Set([
        'Tab', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
        'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
        'Home', 'End', 'PageUp', 'PageDown', ' ', 'Space'
      ]);
      window.addEventListener('keydown', function(e) {
        if (swallowed.has(e.key)) e.preventDefault();
      }, { capture: true });

      // Dynamic canvas resize. The CSS makes the canvas fill the viewport
      // visually, but the canvas drawing-buffer (canvas.width/height) is
      // a separate value that determines the actual pixel resolution we
      // render at. When the user drags the browser, rotates a device, or
      // moves the window between displays with different DPRs, this
      // handler updates the drawing-buffer size; emscripten's SDL2 then
      // emits SDL_WINDOWEVENT_SIZE_CHANGED, our native event loop picks
      // it up, and EngineResize redraws everything at the new dims.
      //
      // HiDPI starts off by default on the web — at retina scale the
      // rasterizer gets ~4x as many pixels to fill, which drops the
      // heavier scenes (city, fountain) below 60fps in the browser. The
      // HD/SD button toggles it at runtime; ?hidpi=1 in the URL opts in
      // at boot.
      var hiDPI = /[?&]hidpi=1/.test(window.location.search);
      // Mobile heuristic: coarse pointer + small viewport. On mobile we
      // tweak the SD/HD effective DPR — naive 1× is too pixelated (CSS
      // upscale to fill a phone screen looks blocky), naive full DPR
      // tanks fps on heavy scenes. So:
      //   SD on mobile = min(DPR, 1.5) — looks decent
      //   HD on mobile = min(DPR, 2)   — sharp without tripling pixel work
      // Desktop unaffected.
      var isMobile = window.matchMedia &&
                     window.matchMedia('(pointer:coarse)').matches &&
                     Math.min(window.innerWidth, window.innerHeight) <= 900;
      // Becomes true once main() has returned — guards against late-firing
      // resize/orientation listeners trying to call into freed wasm.
      var runtimeExited = false;
      function effectiveDpr() {
        var dpr = window.devicePixelRatio || 1;
        if (isMobile) {
          return hiDPI ? Math.min(dpr, 2) : Math.min(dpr, 1.5);
        }
        return hiDPI ? dpr : 1;
      }
      function resizeCanvasToWindow() {
        var dpr = effectiveDpr();
        var w = Math.max(1, Math.floor(window.innerWidth  * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        // Route through SDL_SetWindowSize once the wasm is ready — it
        // updates window->w/h, calls emscripten_set_canvas_element_size
        // (which sizes the canvas DOM), and fires SIZE_CHANGED so the
        // demo thread can repaint at the new dims. Setting canvas.width
        // /height directly here doesn't reach SDL.
        if (runtimeExited) return;
        if (typeof Module !== 'undefined' && Module._SDL2_RequestSize) {
          try { Module._SDL2_RequestSize(w, h); }
          catch (e) { runtimeExited = true; }
        } else {
          if (canvasEl.width  !== w) canvasEl.width  = w;
          if (canvasEl.height !== h) canvasEl.height = h;
        }
      }
      window.addEventListener('resize', resizeCanvasToWindow);
      // iOS/Safari fires `orientationchange` slightly before the layout
      // settles; resize alone is sometimes missed. Belt and suspenders.
      window.addEventListener('orientationchange', function() {
        // Defer one frame so innerWidth/Height reflect the new orientation.
        requestAnimationFrame(resizeCanvasToWindow);
      });
      // DPR change (e.g. moving the window between a retina and non-retina
      // display) doesn't fire 'resize'; subscribe to a media query that
      // matches the current resolution to catch it.
      var dprMQ = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      if (dprMQ.addEventListener) dprMQ.addEventListener('change', resizeCanvasToWindow);
      else if (dprMQ.addListener) dprMQ.addListener(resizeCanvasToWindow);

      // ---- Control bar: mute / HiDPI / fullscreen ---------------------
      var btnMute = document.getElementById('btn-mute');
      var btnHidpi = document.getElementById('btn-hidpi');
      var btnFullscreen = document.getElementById('btn-fullscreen');
      var muted = false;

      function applyMute() {
        btnMute.textContent = muted ? '🔇' : '🔊';
        btnMute.setAttribute('aria-pressed', muted ? 'true' : 'false');
        // GainNode in the audio chain — wasm pump keeps running so the
        // song stays in lockstep with the visuals; we just zero the
        // audible signal.
        if (Module.__audioGain) Module.__audioGain.gain.value = muted ? 0 : 1;
      }
      function applyHidpi() {
        btnHidpi.textContent = hiDPI ? 'HD' : 'SD';
        btnHidpi.setAttribute('aria-pressed', hiDPI ? 'true' : 'false');
        // Match the font scale to the effective DPR — that way one
        // glyph pixel maps to one CSS pixel regardless of HD/SD or
        // mobile/desktop. Round up so we stay legible.
        if (Module._SDL2_SetFontScale) {
          var scale = Math.max(1, Math.round(effectiveDpr()));
          Module._SDL2_SetFontScale(scale);
        }
        // resizeCanvasToWindow routes through Module._SDL2_RequestSize
        // → SDL_SetWindowSize, which both resizes the canvas DOM element
        // and fires SDL_WINDOWEVENT_SIZE_CHANGED so the demo thread
        // repaints at the new resolution.
        resizeCanvasToWindow();
      }
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      function applyFullscreenLabel() {
        btnFullscreen.textContent = isFullscreen() ? '✕' : '⛶';
      }

      btnMute.addEventListener('click', function() {
        muted = !muted;
        applyMute();
      });
      btnHidpi.addEventListener('click', function() {
        hiDPI = !hiDPI;
        applyHidpi();
      });
      btnFullscreen.addEventListener('click', function() {
        if (isFullscreen()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          var el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        }
      });
      document.addEventListener('fullscreenchange', applyFullscreenLabel);
      document.addEventListener('webkitfullscreenchange', applyFullscreenLabel);

      // Initial sync.
      applyHidpi();
      applyMute();
      applyFullscreenLabel();

      // ---- Auto-hide control bar -------------------------------------
      // Fade out after a couple seconds of no input. Cursor entering the
      // bottom 20% of the viewport (or any touch on mobile) brings it
      // back. Hovering the bar itself pauses the hide so the user has
      // time to click without playing whack-a-mole.
      var controlsEl = document.getElementById('controls');
      var hideTimer = null;
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
          controlsEl.classList.add('idle');
        }, 2500);
      }
      function showControls() {
        controlsEl.classList.remove('idle');
        scheduleHide();
      }
      window.addEventListener('mousemove', function(e) {
        // Bottom-region trigger only — don't flash the bar every time the
        // viewer moves their cursor anywhere on screen during playback.
        if (e.clientY > window.innerHeight - Math.max(120, window.innerHeight * 0.2)) {
          showControls();
        }
      });
      window.addEventListener('touchstart', showControls, { passive: true });
      controlsEl.addEventListener('mouseenter', function() { clearTimeout(hideTimer); });
      controlsEl.addEventListener('mouseleave', scheduleHide);
      // Keep the bar up while a button is being clicked.
      controlsEl.addEventListener('click', showControls);
      // Show at boot so the controls are discoverable, then auto-hide.
      showControls();
    </script>

    <!-- ───────── LWO surface editor panel (shown only with ?editor) ───────── -->
    <style>
      #editor-panel { position:fixed; top:0; right:0; width:300px; max-height:100vh;
        overflow-y:auto; background:rgba(18,18,22,0.92); color:#ddd; box-sizing:border-box;
        font:12px/1.4 system-ui,sans-serif; z-index:10000; padding:8px; border-left:1px solid #333; }
      #editor-panel.hidden { display:none; }
      #editor-panel h2 { font-size:13px; margin:4px 0 8px; color:#fff; }
      #editor-search { width:100%; box-sizing:border-box; margin-bottom:6px;
        background:#222; color:#ddd; border:1px solid #444; padding:4px; }
      #editor-list { max-height:40vh; overflow-y:auto; }
      .surf-item { padding:3px 6px; cursor:pointer; border-radius:3px; }
      .surf-item:hover { background:#2a2a33; }
      .surf-item.sel { background:#3a3a4a; color:#fff; }
      .surf-tex { color:#888; font-size:10px; }
      #editor-props { border-top:1px solid #333; margin-top:6px; padding-top:6px; }
      .prop-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
      .prop-row label { flex:0 0 80px; }
      .prop-row input[type=range], .prop-row select { flex:1; min-width:0; }
      .prop-row .val { flex:0 0 36px; text-align:right; color:#9cf; }
      #editor-status { color:#9c9; font-size:11px; margin-top:6px; }
    </style>
    <div id="editor-panel" class="hidden">
      <h2>Surfaces — greets</h2>
      <input id="editor-search" placeholder="filter…" oninput="renderSurfaceList()">
      <div id="editor-list"></div>
      <div id="editor-props"></div>
      <div id="editor-status"></div>
    </div>
    <script>
      var editorSurfaces = [], editorSelected = null;
      function editorStatus(t){ var e=document.getElementById('editor-status'); if(e) e.textContent=t||''; }
      // Greets isn't CurScene until it inits + first ticks, so poll editorGetSurfaces
      // until it returns a non-empty list (then it's safe to read/edit).
      function initEditorPanel(){
        document.getElementById('editor-panel').classList.remove('hidden');
        editorStatus('loading greets…');
        var tries = 0;
        var iv = setInterval(function(){
          tries++;
          var list = [];
          try { list = JSON.parse(Module.editorGetSurfaces()); } catch(e){}
          if (list.length){ clearInterval(iv); editorSurfaces = list; editorStatus(list.length+' surfaces'); renderSurfaceList(); }
          else if (tries > 60){ clearInterval(iv); editorStatus('no surfaces — scene not up?'); }
        }, 500);
      }
      function renderSurfaceList(){
        var q = (document.getElementById('editor-search').value || '').toLowerCase();
        var el = document.getElementById('editor-list'); el.innerHTML = '';
        editorSurfaces.forEach(function(s){
          if (q && s.name.toLowerCase().indexOf(q) < 0) return;
          var d = document.createElement('div');
          d.className = 'surf-item' + (editorSelected === s.name ? ' sel' : '');
          d.innerHTML = '<div>' + s.name + '</div>' +
            (s.texture ? '<div class="surf-tex">' + s.texture.replace(/^TEXTURES\//,'') + '</div>' : '');
          d.onclick = function(){ editorSelected = s.name; renderSurfaceList(); renderSurfaceProps(s); };
          el.appendChild(d);
        });
      }
      function setProp(name, key, v){
        var ok = Module.editorSetSurfaceProp(name, key, v);
        var s = editorSurfaces.find(function(x){ return x.name === name; });
        if (s) s[key] = v;
        return ok;
      }
      function propRow(s, key, min, max, step){
        var row = document.createElement('div'); row.className = 'prop-row';
        var lab = document.createElement('label'); lab.textContent = key; row.appendChild(lab);
        var r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = s[key];
        var val = document.createElement('span'); val.className = 'val'; val.textContent = (+s[key]).toFixed(2);
        r.oninput = function(){ var v = parseFloat(r.value); val.textContent = v.toFixed(2); setProp(s.name, key, v); };
        row.appendChild(r); row.appendChild(val); return row;
      }
      function renderSurfaceProps(s){
        var el = document.getElementById('editor-props'); el.innerHTML = '';
        var h = document.createElement('div'); h.style.cssText = 'color:#fff;margin-bottom:4px;'; h.textContent = s.name; el.appendChild(h);
        ['diffuse','specular','luminosity','transparency','reflection'].forEach(function(k){
          el.appendChild(propRow(s, k, 0, 2, 0.01));
        });
        // glossiness = specular exponent; keep to the kernel's fast specialized set.
        var gr = document.createElement('div'); gr.className = 'prop-row';
        var gl = document.createElement('label'); gl.textContent = 'glossiness'; gr.appendChild(gl);
        var sel = document.createElement('select');
        [0,4,8,16,32,48,64,128].forEach(function(g){
          var o = document.createElement('option'); o.value = g; o.textContent = g;
          if (+s.glossiness === g) o.selected = true; sel.appendChild(o);
        });
        sel.onchange = function(){ setProp(s.name, 'glossiness', parseInt(sel.value, 10)); };
        gr.appendChild(sel); el.appendChild(gr);
        if (s.texture){ var t = document.createElement('div'); t.className = 'surf-tex'; t.textContent = 'tex: ' + s.texture; el.appendChild(t); }
      }
    </script>
    {{{ SCRIPT }}}
  </body>
