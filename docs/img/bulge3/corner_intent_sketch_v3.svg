<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1060" viewBox="0 0 1180 1060" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="1180" height="1060" fill="#ffffff"/>
  <text x="40" y="34" font-size="18" font-weight="bold" fill="#111827">CORNER INTENT v3 — panels 1–2 unchanged (awaiting your OK), panel 3 rebuilt from your last two drawings, panel 4 = conformance</text>

  <!-- ============ P1: ELEVATION, INTENDED (unchanged from v2) ============ -->
  <g transform="translate(40,60)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#166534">1 — ELEVATION at the junction, INTENDED (unchanged from v2)</text>
    <polygon points="10,40 150,80 150,340 10,300" fill="#f0ebdf"/>
    <rect x="150" y="80" width="280" height="260" fill="#ece6d8"/>
    <g stroke="#b8ad97" stroke-width="4">
      <line x1="150" y1="143" x2="10" y2="103"/>
      <line x1="150" y1="215" x2="10" y2="175"/>
      <line x1="150" y1="287" x2="10" y2="247"/>
    </g>
    <g stroke="#b8ad97" stroke-width="6">
      <line x1="164" y1="143" x2="430" y2="143"/>
      <line x1="164" y1="215" x2="430" y2="215"/>
      <line x1="164" y1="287" x2="430" y2="287"/>
    </g>
    <g stroke="#b8ad97" stroke-width="4">
      <line x1="250" y1="80"  x2="250" y2="135"/> <line x1="340" y1="80"  x2="340" y2="135"/>
      <line x1="205" y1="152" x2="205" y2="207"/> <line x1="295" y1="152" x2="295" y2="207"/> <line x1="385" y1="152" x2="385" y2="207"/>
      <line x1="250" y1="224" x2="250" y2="279"/> <line x1="340" y1="224" x2="340" y2="279"/>
      <line x1="205" y1="296" x2="205" y2="340"/> <line x1="295" y1="296" x2="295" y2="340"/> <line x1="385" y1="296" x2="385" y2="340"/>
    </g>
    <line x1="10" y1="40" x2="150" y2="80" stroke="#111827" stroke-width="2"/>
    <line x1="150" y1="80" x2="430" y2="80" stroke="#111827" stroke-width="2"/>
    <g fill="#6b6154">
      <rect x="150" y="135" width="14" height="17"/>
      <rect x="150" y="207" width="14" height="17"/>
      <rect x="150" y="279" width="14" height="17"/>
    </g>
    <polyline points="150,80 150,135 164,135 164,152 150,152 150,207 164,207 164,224 150,224 150,279 164,279 164,296 150,296 150,340"
              fill="none" stroke="#166534" stroke-width="3"/>
    <text x="180" y="368" font-size="12.5" fill="#166534">grout courses cut INSIDE the wall at the corner → notched silhouette, block ends visible</text>
  </g>

  <!-- ============ P2: PLAN SLICES (unchanged from v2) ============ -->
  <g transform="translate(600,60)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#111827">2 — PLAN slices, same junction, two heights (unchanged from v2)</text>
    <g transform="translate(0,30)">
      <text x="0" y="14" font-size="13" font-weight="bold" fill="#166534">BLOCK height: proud (+a) → OUTER mitre corner</text>
      <rect x="20" y="40" width="120" height="100" fill="#ece6d8"/>
      <line x1="20" y1="40" x2="140" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <line x1="140" y1="40" x2="140" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <polyline points="20,26 154,26 154,140" fill="none" stroke="#166534" stroke-width="2.5"/>
      <circle cx="154" cy="26" r="4" fill="none" stroke="#166534" stroke-width="1.5"/>
      <text x="170" y="30" font-size="12" fill="#166534">+a·bisector/cos(δ/2)</text>
    </g>
    <g transform="translate(0,200)">
      <text x="0" y="14" font-size="13" font-weight="bold" fill="#0e7490">GROUT height: recessed (−g) → INNER mitre corner</text>
      <rect x="20" y="40" width="120" height="100" fill="#ece6d8"/>
      <line x1="20" y1="40" x2="140" y2="40" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <line x1="140" y1="40" x2="140" y2="140" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
      <polyline points="20,50 130,50 130,140" fill="none" stroke="#0e7490" stroke-width="2.5"/>
      <circle cx="130" cy="50" r="4" fill="none" stroke="#0e7490" stroke-width="1.5"/>
      <text x="150" y="54" font-size="12" fill="#0e7490">−g·bisector/cos(δ/2)</text>
    </g>
    <text x="0" y="392" font-size="12.5" fill="#334155">junction edge alternates outer ↔ inner following h(s) → panel 1's notches.</text>
  </g>

  <!-- ============ P3: YOUR TWO TOP VIEWS, REDRAWN ============ -->
  <g transform="translate(40,500)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#111827">3 — TOP VIEW, redrawn from YOUR two drawings (Q2 closed)</text>
    <!-- works -->
    <g transform="translate(0,30)">
      <line x1="240" y1="20" x2="120" y2="90" stroke="#111827" stroke-width="2.5"/>
      <polyline points="120,90 116,140 112,200" fill="none" stroke="#111827" stroke-width="2.5"/>
      <circle cx="40" cy="140" r="5" fill="#334155"/>
      <text x="20" y="162" font-size="12" fill="#334155">viewer</text>
      <text x="0" y="230" font-size="13" font-weight="bold" fill="#166534">WORKS today — gentle reflex, ~200–220 visible-side.</text>
      <text x="0" y="247" font-size="12.5" fill="#166534">Scene class: 200–230 (5 edges), incl. the 207–212 jamb near your cams.</text>
    </g>
    <!-- broken -->
    <g transform="translate(560,30)">
      <line x1="110" y1="160" x2="250" y2="160" stroke="#111827" stroke-width="2.5"/>
      <line x1="110" y1="160" x2="200" y2="30" stroke="#111827" stroke-width="2.5"/>
      <circle cx="34" cy="192" r="5" fill="#334155"/>
      <text x="14" y="214" font-size="12" fill="#334155">viewer</text>
      <text x="0" y="240" font-size="13" font-weight="bold" fill="#b91c1c">BROKEN today — sharp reflex: acute stone wedge (~60 solid → ~300 visible).</text>
      <text x="0" y="257" font-size="12.5" fill="#b91c1c">Scene class: 250–280 (19 edges), incl. the 270 colonnade arris in your t=5965 frame.</text>
    </g>
    <text x="0" y="300" font-size="12.5" fill="#334155">The scene has NO junction between 230 and 250 — so no threshold to tune: the corner math must simply take the correct</text>
    <text x="0" y="316" font-size="12.5" fill="#334155">convex/reflex branch (cross-product sign vs the junction edge), and both classes fall out of the same construction.</text>
  </g>

  <!-- ============ P4: CONFORMANCE ============ -->
  <g transform="translate(40,850)">
    <text x="0" y="14" font-size="15" font-weight="bold" fill="#111827">4 — CONFORMANCE: the corner silhouette IS the height map, sampled on the junction line</text>
    <!-- height profile h(s) -->
    <text x="0" y="42" font-size="12.5" fill="#334155">height profile h(s) along the junction line (from greets_wall_h.png):</text>
    <line x1="0" y1="80" x2="560" y2="80" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
    <polyline points="0,58 96,58 106,92 128,92 138,58 250,58 260,92 282,92 292,58 404,58 414,92 436,92 446,58 560,58"
              fill="none" stroke="#7c3aed" stroke-width="2.5"/>
    <text x="566" y="62" font-size="11.5" fill="#7c3aed">+a (block)</text>
    <text x="566" y="96" font-size="11.5" fill="#7c3aed">−g (grout)</text>
    <!-- resulting ring -->
    <text x="0" y="140" font-size="12.5" fill="#334155">junction ring offset = h(s) × (bisector / cos(δ/2)) — the SAME curve, scaled:</text>
    <line x1="0" y1="178" x2="560" y2="178" stroke="#94a3b8" stroke-width="1" stroke-dasharray="5,4"/>
    <polyline points="0,150 96,150 106,192 128,192 138,150 250,150 260,192 282,192 292,150 404,150 414,192 436,192 446,150 560,150"
              fill="none" stroke="#166534" stroke-width="2.5"/>
    <text x="566" y="154" font-size="11.5" fill="#166534">outer mitre pt</text>
    <text x="566" y="196" font-size="11.5" fill="#166534">inner mitre pt</text>
    <text x="620" y="80" font-size="12.5" fill="#111827">Nothing is invented at the corner: every ring vert</text>
    <text x="620" y="96" font-size="12.5" fill="#111827">takes the map's own value at its position on the</text>
    <text x="620" y="112" font-size="12.5" fill="#111827">junction line. Conformance by construction.</text>
    <text x="620" y="144" font-size="12.5" fill="#b91c1c">What you saw in the M2 render is NOT this:</text>
    <text x="620" y="160" font-size="12.5" fill="#b91c1c">M2 pins h≡0 at every ring and blends over a band —</text>
    <text x="620" y="176" font-size="12.5" fill="#b91c1c">an invented placeholder that ignores the map.</text>
    <text x="620" y="192" font-size="12.5" fill="#b91c1c">M3 deletes it and builds the green curve instead.</text>
  </g>
</svg>
