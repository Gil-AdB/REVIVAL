# DOSBox-X config for the FLOOD demo (Phase 1 — run prebuilt REV.EXE).
# Launch: dos-build/run-dosbox.sh   (opens via `open`, attaches to the GUI session)
#
#  - machine=svga_s3      : S3 card → VESA/VBE 2.0 linear framebuffer.
#  - cputype=pentium_mmx  : MMX available so the emms fillers run and the
#                           Detect_MMX INT-6 `emms` probe doesn't #UD.
#  - core=normal          : REPORTS illegal/unimplemented opcodes (logged with
#                           address) instead of silently mis-executing them like
#                           the dynamic core — the instrument for pinning the
#                           bring-up death (MMX filler opcode? INT-6? VESA?).
#  - [log] logfile        : DOSBox-X writes its own diagnostics (incl. CPU
#                           exceptions / illegal opcodes) here, readable from the
#                           host regardless of the GUI launch.
#  - REV.EXE is a stub for Rational DOS/4G; its self-exec drops the program arg
#    under DOSBox (fatal 1004), so invoke the extender explicitly: dos4gw rev.exe

[sdl]
fullscreen=false
output=opengl

[log]
logfile=/Users/gil-ad/work/revival/dos-build/dosbox-x.log

[dosbox]
machine=svga_s3
memsize=32

[cpu]
# dynamic recompiler (x86→ARM) — the fast core. `normal` was only for the
# illegal-opcode instrumentation; the descriptor abort turned out to be a
# 16MB OOM (now memsize=32), not a core issue, so dynamic is safe + fast.
core=dynamic
cputype=pentium_mmx
cycles=max

[sblaster]
sbtype=sb16

[render]
scaler=none

[autoexec]
mount c "/Users/gil-ad/work/revival/dos-build/runtime"
c:
echo === FLOOD demo — Phase 1 smoke test (genuine Watcom DOS/4GW) ===
rem DOS4GW.EXE here is now the real Watcom DOS/4GW (from Open Watcom), the
rem extender DOSBox is built/tested against. Rational original saved as
rem DOS4GW.RAT. DOS/32A available as DOS32A.EXE.
dos4gw.exe rev.exe
echo === REV returned (exit code %errorlevel%) ===
