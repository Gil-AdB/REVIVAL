<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <title>REVIVAL / FLOOD</title>
    <style>
      html, body { margin: 0; padding: 0; background: #000; color: #ccc;
                   font: 14px/1.3 sans-serif; height: 100%; overflow: hidden; }
      /* Center canvas inside the viewport. Black surroundings show as
         letterbox bars whenever canvas AR != viewport AR. */
      body { display: flex; align-items: center; justify-content: center; }
      #status { position: fixed; top: 0; left: 0; right: 0; padding: 6px 10px;
                background: rgba(0,0,0,0.6); font-size: 12px;
                pointer-events: none; }
      #status.hidden { display: none; }
      /* Canvas backing-store dims now equal the engine surface dims
         (AR-clamped, /8-snapped) — V_Flip's RenderCopy is a 1:1 memcpy
         instead of a scale-blit, and the bars come from CSS. width/height
         auto + max-width/height let the browser preserve AR while fitting
         the viewport. */
      canvas { background: #000; display: block; image-rendering: pixelated;
               width: auto; height: auto;
               max-width: calc(100vw - var(--rev-reserve, 0px)); max-height: 100vh; }
      /* Editor mode: reserve the panel's width on the right so the render
         canvas is letterboxed into the FREE region beside the panel instead of
         sitting behind it. --rev-reserve is driven by updateCanvasFit() (0 when
         the panel is hidden/collapsed/floated away from the right edge).
         box-sizing:border-box shifts the flex-centered canvas left by the
         reserve; the canvas max-width above caps its width to the free region.
         Engine render resolution is unchanged (pure CSS scale) — see the
         updateCanvasFit comment for the aspect caveat. */
      body.rev-editor { box-sizing: border-box; width: 100vw;
                        padding-right: var(--rev-reserve, 0px); }
      /* Bottom-right control bar: mute / HiDPI / fullscreen. Stays on top
         of the canvas (z-index) and ignores its own click events from
         reaching the demo (each button only flips its own state). */
      #controls { position: fixed; bottom: 12px; right: 12px; display: flex;
                  gap: 6px; z-index: 100; }
      #controls button { background: rgba(0,0,0,0.6); color: #fff;
                         border: 1px solid rgba(255,255,255,0.3);
                         border-radius: 4px; padding: 8px 12px;
                         font: 16px/1 sans-serif; cursor: pointer;
                         min-width: 44px; min-height: 44px;
                         user-select: none; -webkit-tap-highlight-color: transparent; }
      #controls button:hover { background: rgba(0,0,0,0.85); }
      #controls button:active { background: rgba(255,255,255,0.2); }
      /* Auto-hide: fade out after a few seconds of mouse inactivity, fade
         back in when the cursor approaches the bottom of the viewport. */
      #controls { transition: opacity 0.25s ease-out; }
      #controls.idle { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <!-- Diagnostic-log capture. We also keep a buffered copy of every
         [coop-diag] / [audio-diag] line so we can dump them into the
         on-screen error panel when the demo can't start (mostly so
         Firefox Mobile users — who can't readily inspect the JS console
         — can copy useful info out of the page itself). Captures
         console.log + console.error output that starts with one of our
         tag prefixes. -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        var diagLog = [];
        window.__diagLog = diagLog;
        function tagged(args) {
          var s = '';
          for (var i = 0; i < args.length; ++i) {
            s += (i ? ' ' : '') + args[i];
          }
          return /^\[(coop|audio)-diag\]/.test(s) ? s : null;
        }
        var origLog = console.log.bind(console);
        var origErr = console.error.bind(console);
        console.log = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origLog.apply(null, arguments);
        };
        console.error = function() {
          var t = tagged(arguments);
          if (t) diagLog.push(t);
          return origErr.apply(null, arguments);
        };

        function snap(label) {
          if (navigator.serviceWorker) {
            try {
              navigator.serviceWorker.getRegistrations().then(function(regs) {
                console.log('[coop-diag] ' + label + ' regs=' + regs.length +
                  regs.map(function(r){
                    return ' [scope=' + r.scope +
                      ' active=' + !!r.active +
                      ' installing=' + !!r.installing +
                      ' waiting=' + !!r.waiting + ']';
                  }).join(''));
              });
            } catch (e) {
              console.log('[coop-diag] ' + label + ' getRegistrations err: ' + e.message);
            }
          }
          console.log('[coop-diag] ' + label +
            ' isSecureContext=' + window.isSecureContext +
            ' crossOriginIsolated=' + window.crossOriginIsolated +
            ' UA=' + navigator.userAgent.slice(0, 80) +
            ' hasNetscape=' + (typeof netscape !== 'undefined') +
            ' hasChrome=' + (typeof chrome !== 'undefined') +
            ' SW=' + !!navigator.serviceWorker +
            ' SWController=' + !!(navigator.serviceWorker && navigator.serviceWorker.controller) +
            ' SAB=' + (typeof SharedArrayBuffer !== 'undefined') +
            ' sessionStorage=' + (function(){try{window.sessionStorage.length;return 'ok';}catch(e){return 'blocked:'+e.message;}})()
          );
        }
        snap('initial');
        setTimeout(function(){ snap('+1s'); }, 1000);
        setTimeout(function(){ snap('+3s'); }, 3000);
      })();
    </script>
    <!-- Browser-specific coi-serviceworker config. Firefox Android (UA
         contains "Android" + "Firefox") has been observed not isolating
         the top-level document under COEP credentialless even with
         coi-serviceworker active and the SW controlling the page
         (crossOriginIsolated=false despite SWController=true). Forcing
         require-corp seems to fix it; same-origin assets get an explicit
         CORP from the SW so require-corp's stricter rules are satisfied. -->
    <script>
      var ua = navigator.userAgent || '';
      if (ua.indexOf('Android') >= 0 && ua.indexOf('Firefox') >= 0) {
        window.coi = window.coi || {};
        window.coi.coepCredentialless = function() { return false; };
        console.log('[coop-diag] FF Android detected; forcing require-corp');
      }
    </script>
    <!-- coi-serviceworker injects COOP/COEP headers so SharedArrayBuffer
         (required for our pthread build) works on hosts like GitHub Pages
         that don't support custom HTTP headers. No-op on emrun, which
         already sets the headers itself. -->
    <script src="coi-serviceworker.js"></script>
    <script>
      // Friendly error if cross-origin isolation never activates.
      // Includes the captured [coop-diag] / [audio-diag] log so people
      // diagnosing on a phone (or anyone without a JS console handy)
      // can copy actionable info straight out of the page.
      (function() {
        if (typeof window === 'undefined') return;
        setTimeout(function() {
          if (window.crossOriginIsolated) return;
          var msg = (
            "Couldn't enable cross-origin isolation in this browser. " +
            "REVIVAL needs SharedArrayBuffer to run its render workers. " +
            "Common causes:\n\n" +
            "  - Private / incognito browsing (Firefox disables service workers there)\n" +
            "  - Outdated browser (need Chrome 92+, Firefox 79+, Safari 15.2+)\n" +
            "  - Some Firefox Mobile setups\n\n" +
            "Try a regular (non-private) tab in an up-to-date Chrome or Firefox."
          );
          var diag = (window.__diagLog || []).join('\n');
          var div = document.createElement('div');
          div.style.cssText =
            'position:fixed;inset:0;background:#000;color:#ccc;' +
            'font:14px/1.4 sans-serif;padding:2em;white-space:pre-wrap;' +
            'z-index:99999;overflow:auto;';
          div.textContent = msg + '\n\n--- diagnostic log ---\n' + diag;
          document.body.appendChild(div);
          console.error(msg);
        }, 4000);
      })();
    </script>
    <div id="status">Downloading...</div>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="controls">
      <button id="btn-mute" title="Mute / unmute audio" aria-label="Mute">🔊</button>
      <button id="btn-hidpi" title="Toggle high-DPI rendering" aria-label="HiDPI">SD</button>
      <button id="btn-fullscreen" title="Toggle fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
    <script>
      var statusEl = document.getElementById('status');
      var canvasEl = document.getElementById('canvas');
      function setStatus(text) {
        if (!text) { statusEl.classList.add('hidden'); return; }
        statusEl.classList.remove('hidden');
        statusEl.textContent = text;
      }
      // ?editor in the URL → surface-editor mode. Read in C++ (DemoBoot) to
      // boot greets-only/mirror-off, and here to show the surface panel.
      var revEditorMode = /[?&]editor\b/.test(location.search);
      // ?scene=<name> picks the edited scene (default greets). The C++ side
      // parses the same token (MainLoop's editor scene registry); here it
      // selects the live-fetch paths + the save API route.
      var revEditorScene = (location.search.match(/[?&]scene=(\w+)/) || [])[1] || 'greets';
      var revEditorFLD = 'SCENES/' + revEditorScene.toUpperCase() + '.FLD';
      var revEditorMAT = 'SCENES/' + revEditorScene.toUpperCase() + '.MAT';
      var Module = {
        canvas: canvasEl,
        setStatus: setStatus,
        revEditorMode: revEditorMode ? 1 : 0,
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          setStatus(left
            ? 'Loading... (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
            : '');
        },
        // Flip the guard once main() returns so late-firing DOM events
        // (resize, mousemove, fullscreenchange) can't call into a torn-down
        // wasm runtime — that path used to throw "called after runtime
        // exit" assertions in the console.
        onExit: function() { runtimeExited = true; },
        // Once wasm exports are ready, re-apply the HD/SD font scale
        // (the boot-time applyHidpi() ran before _SDL2_SetFontScale
        // existed). Same for ?hidpi=1 in the URL.
        onRuntimeInitialized: function() {
          if (typeof applyHidpi === 'function') applyHidpi();
          if (revEditorMode && typeof initEditorPanel === 'function') initEditorPanel();
        }
      };

      // Editor: fetch the LIVE scene data from the dev server (tools/
      // editor_server.py serves Runtime/ at these paths) — the copies inside
      // DEMO.data were baked at link time, so after a "Save" regenerates them,
      // a plain browser reload + these fetches pick them up without relinking:
      //   SCENES/GREETS.FLD   the scene (numeric material values)
      //   SCENES/GREETS.MAT   the PBR-map sidecar (surface|role|path lines)
      //   TEXTURES/PBR/*      every map the sidecar references
      // editorTick (MainLoop.cpp) waits for editorFldReady, installs
      // editorFreshFiles into MEMFS, then starts scene init. -1 (fetch failed /
      // static hosting without the server) falls back to the baked copies.
      if (revEditorMode) {
        Module.editorFldReady = 0;
        Module.editorFreshFiles = [];   // [{path:'/SCENES/...', data:Uint8Array}]
        (function(){
          var bust = '?ts=' + Date.now();
          function grab(rel){
            return fetch(rel + bust, { cache: 'no-store' })
              .then(function(r){ if (!r.ok) throw new Error(rel + ': ' + r.status); return r.arrayBuffer(); })
              .then(function(b){ Module.editorFreshFiles.push({ path: '/' + rel, data: new Uint8Array(b) }); });
          }
          grab(revEditorFLD)
            .then(function(){
              // Sidecar is optional (404 = no persisted maps yet).
              return fetch(revEditorMAT + bust, { cache: 'no-store' })
                .then(function(r){ return r.ok ? r.arrayBuffer() : null; })
                .catch(function(){ return null; });
            })
            .then(function(matBuf){
              if (!matBuf) return [];
              Module.editorFreshFiles.push({ path: '/' + revEditorMAT, data: new Uint8Array(matBuf) });
              var text = new TextDecoder().decode(matBuf);
              var maps = [];
              text.split('\n').forEach(function(line){
                line = line.trim();
                if (!line || line[0] === '#') return;
                var parts = line.split('|');
                if (parts.length === 3 && maps.indexOf(parts[2]) < 0) maps.push(parts[2]);
              });
              return Promise.all(maps.map(function(rel){
                return grab(rel).catch(function(e){ console.warn('[editor] sidecar map fetch failed:', e); });
              }));
            })
            .then(function(){ Module.editorFldReady = 1; })
            .catch(function(e){
              console.warn('[editor] live scene fetch failed (using baked copies):', e);
              Module.editorFldReady = -1;
            });
        })();
      }

      // ---- Audio: AudioWorklet pump ---------------------------------
      // Replaces SDL2's emscripten ScriptProcessorNode path. The wasm
      // side calls Module._floodAudioStart() on user gesture; that
      // creates the AudioContext + worklet, hooks its 'needData' /
      // 'starve' messages back to a wasm-exported _Audio_FeedWorklet
      // function. Module._floodAudioStop() tears down at end of demo.
      // Browsers gate AudioContext.resume() on a user-gesture call stack.
      // The C-side state machine catches the click via SDL_PollEvent later,
      // by which point the gesture context is gone — ctx.resume() then
      // resolves but the context stays in "suspended" state and the worklet
      // never produces audio. Listen for the first click/keydown directly
      // in JS and kick off audio in that handler. The C side calls
      // _floodAudioStart() too once it sees the gesture; the second call
      // returns immediately because Module.__audioCtx is already set.
      function preArmAudio(e) {
        window.removeEventListener('pointerdown', preArmAudio);
        window.removeEventListener('keydown',     preArmAudio);
        console.log('[audio-diag] preArmAudio fired type=' + e.type +
          ' _floodAudioStart=' + (typeof Module._floodAudioStart) +
          ' _Audio_FeedWorklet=' + (typeof Module._Audio_FeedWorklet));
        if (Module._floodAudioStart) Module._floodAudioStart();
      }
      window.addEventListener('pointerdown', preArmAudio);
      window.addEventListener('keydown',     preArmAudio);

      Module._floodAudioStart = async function() {
        // Re-entry: __audioCtx is set only AFTER the first await chain
        // completes. Without a separate "starting" flag, two calls in
        // rapid succession (preArm click handler + C-side SDL2_StartMusic
        // from the next rAF tick) both pass the audioCtx guard, both
        // proceed, both build a worklet, both pump. The C side then
        // advances the song at 2× rate — sounds like fast-forwarding
        // after the first few seconds.
        if (Module.__audioStarting || Module.__audioCtx) {
          console.log('[audio-diag] _floodAudioStart re-entry; already started or starting');
          return;
        }
        Module.__audioStarting = true;
        console.log('[audio-diag] _floodAudioStart: creating AudioContext');
        var ctx = new (window.AudioContext || window.webkitAudioContext)({
          sampleRate: 48000
        });
        console.log('[audio-diag] AudioContext state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        await ctx.resume();
        console.log('[audio-diag] after resume() state=' + ctx.state +
                    ' actualSampleRate=' + ctx.sampleRate);
        try {
          await ctx.audioWorklet.addModule('audio-worklet.js');
          console.log('[audio-diag] addModule ok');
        } catch (e) {
          console.error('[audio-diag] addModule failed: ' + e.message);
          return;
        }
        var node = new AudioWorkletNode(ctx, 'flood-modplayer-worklet', {
          outputChannelCount: [2]
        });
        // Gain in the chain for mute. The wasm pump keeps running even
        // when muted (so position advances + unmute resumes mid-track),
        // we just zero the audible signal.
        var gain = ctx.createGain();
        gain.gain.value = muted ? 0 : 1;
        node.connect(gain).connect(ctx.destination);
        Module.__audioGain = gain;
        node.port.onmessage = function(e) {
          if (!Module.__audioMsgSeen) {
            Module.__audioMsgSeen = 1;
            console.log('[audio-diag] first port message from worklet: ' + (e.data && e.data.type));
          }
          if (Module.__muted) return;
          if (Module.__feeding) return; // re-entry guard
          Module.__feeding = true;
          try {
            if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
          } finally {
            Module.__feeding = false;
          }
        };
        Module.__audioCtx = ctx;
        Module.__audioNode = node;
        Module.__audioPort = node.port;
        console.log('[audio-diag] worklet wired up, kicking initial pump; ctx.state=' + ctx.state);
        // Kick off the ring with one pump so the worklet has data before
        // it asks for more.
        if (Module._Audio_FeedWorklet) Module._Audio_FeedWorklet(2048);
        // Re-check ctx state on the next tick — if it's still 'suspended'
        // we have a gesture-context problem.
        setTimeout(function(){
          console.log('[audio-diag] +200ms ctx.state=' + ctx.state +
            ' modHandle_known_to_C=via_wasm');
        }, 200);
      };
      Module._floodAudioStop = function() {
        if (Module.__audioPort) Module.__audioPort.postMessage({ type: 'stop' });
        if (Module.__audioNode) try { Module.__audioNode.disconnect(); } catch (_) {}
        if (Module.__audioCtx) try { Module.__audioCtx.close(); } catch (_) {}
        Module.__audioCtx = Module.__audioNode = Module.__audioPort = null;
      };
      setStatus('Downloading...');
      window.onerror = function() {
        setStatus('Exception thrown, see console');
        setStatus = function(t) { if (t) console.error('[post-exception] ' + t); };
      };
      // The browser captures Tab (focus nav), function keys, arrows, etc.
      // before they reach SDL. Block default for keys the demo cares about.
      var swallowed = new Set([
        'Tab', 'F1', 'F2', 'F3', 'F4', 'F5', 'F6', 'F7', 'F8', 'F9', 'F10', 'F11', 'F12',
        'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown',
        'Home', 'End', 'PageUp', 'PageDown', ' ', 'Space'
      ]);
      window.addEventListener('keydown', function(e) {
        if (swallowed.has(e.key)) e.preventDefault();
      }, { capture: true });

      // Dynamic canvas resize. The CSS makes the canvas fill the viewport
      // visually, but the canvas drawing-buffer (canvas.width/height) is
      // a separate value that determines the actual pixel resolution we
      // render at. When the user drags the browser, rotates a device, or
      // moves the window between displays with different DPRs, this
      // handler updates the drawing-buffer size; emscripten's SDL2 then
      // emits SDL_WINDOWEVENT_SIZE_CHANGED, our native event loop picks
      // it up, and EngineResize redraws everything at the new dims.
      //
      // HiDPI starts off by default on the web — at retina scale the
      // rasterizer gets ~4x as many pixels to fill, which drops the
      // heavier scenes (city, fountain) below 60fps in the browser. The
      // HD/SD button toggles it at runtime; ?hidpi=1 in the URL opts in
      // at boot.
      var hiDPI = /[?&]hidpi=1/.test(window.location.search);
      // Mobile heuristic: coarse pointer + small viewport. On mobile we
      // tweak the SD/HD effective DPR — naive 1× is too pixelated (CSS
      // upscale to fill a phone screen looks blocky), naive full DPR
      // tanks fps on heavy scenes. So:
      //   SD on mobile = min(DPR, 1.5) — looks decent
      //   HD on mobile = min(DPR, 2)   — sharp without tripling pixel work
      // Desktop unaffected.
      var isMobile = window.matchMedia &&
                     window.matchMedia('(pointer:coarse)').matches &&
                     Math.min(window.innerWidth, window.innerHeight) <= 900;
      // Becomes true once main() has returned — guards against late-firing
      // resize/orientation listeners trying to call into freed wasm.
      var runtimeExited = false;
      // Render-scale divisor on top of HD/SD: 1 = full, 2 = half-res, 4 =
      // quarter-res drawing buffer (CSS upscales to fill the window). The
      // rasterizer's cost is ~linear in pixels, so ½× ≈ 4× fewer pixels.
      // ?scale=2 / ?scale=4 in the URL sets it at boot.
      var renderScale = (function(){
        var m = /[?&]scale=(2|4)/.exec(window.location.search);
        return m ? parseInt(m[1], 10) : 1;
      })();
      function effectiveDpr() {
        var dpr = window.devicePixelRatio || 1;
        var base;
        if (isMobile) {
          base = hiDPI ? Math.min(dpr, 2) : Math.min(dpr, 1.5);
        } else {
          base = hiDPI ? dpr : 1;
        }
        return base / renderScale;
      }
      function resizeCanvasToWindow() {
        var dpr = effectiveDpr();
        // Editor: render the engine at the FREE-REGION width (window minus the
        // panel reserve) so the canvas backing store equals its displayed size
        // — 1:1 device pixels, no browser downsample. The old canvas-fit only
        // set a CSS max-width, which DOWNSCALED the window-sized backing store;
        // nearest-neighbour downsampling of the high-frequency editor passes
        // (deferred-quarter checkerboard, grain, chromatic) aliased into an RGB
        // moiré grid. --rev-reserve (set by updateCanvasFit, kept current on
        // panel show/collapse/dock) is the single source of truth for the
        // reserve; 0 outside the editor.
        var reserve = 0;
        if (revEditorMode) {
          reserve = parseFloat(getComputedStyle(document.documentElement)
                      .getPropertyValue('--rev-reserve')) || 0;
        }
        var w = Math.max(1, Math.floor((window.innerWidth - reserve) * dpr));
        var h = Math.max(1, Math.floor(window.innerHeight * dpr));
        // Route through SDL_SetWindowSize once the wasm is ready — it
        // updates window->w/h, calls emscripten_set_canvas_element_size
        // (which sizes the canvas DOM), and fires SIZE_CHANGED so the
        // demo thread can repaint at the new dims. Setting canvas.width
        // /height directly here doesn't reach SDL.
        if (runtimeExited) return;
        if (typeof Module !== 'undefined' && Module._SDL2_RequestSize) {
          try { Module._SDL2_RequestSize(w, h); }
          catch (e) { runtimeExited = true; }
        } else {
          if (canvasEl.width  !== w) canvasEl.width  = w;
          if (canvasEl.height !== h) canvasEl.height = h;
        }
      }
      window.addEventListener('resize', resizeCanvasToWindow);
      // iOS/Safari fires `orientationchange` slightly before the layout
      // settles; resize alone is sometimes missed. Belt and suspenders.
      window.addEventListener('orientationchange', function() {
        // Defer one frame so innerWidth/Height reflect the new orientation.
        requestAnimationFrame(resizeCanvasToWindow);
      });
      // DPR change (e.g. moving the window between a retina and non-retina
      // display) doesn't fire 'resize'; subscribe to a media query that
      // matches the current resolution to catch it.
      var dprMQ = window.matchMedia('(resolution: ' + (window.devicePixelRatio || 1) + 'dppx)');
      if (dprMQ.addEventListener) dprMQ.addEventListener('change', resizeCanvasToWindow);
      else if (dprMQ.addListener) dprMQ.addListener(resizeCanvasToWindow);

      // ---- Control bar: mute / HiDPI / fullscreen ---------------------
      var btnMute = document.getElementById('btn-mute');
      var btnHidpi = document.getElementById('btn-hidpi');
      var btnFullscreen = document.getElementById('btn-fullscreen');
      var muted = false;

      function applyMute() {
        btnMute.textContent = muted ? '🔇' : '🔊';
        btnMute.setAttribute('aria-pressed', muted ? 'true' : 'false');
        // GainNode in the audio chain — wasm pump keeps running so the
        // song stays in lockstep with the visuals; we just zero the
        // audible signal.
        if (Module.__audioGain) Module.__audioGain.gain.value = muted ? 0 : 1;
      }
      function applyHidpi() {
        btnHidpi.textContent = renderScale === 4 ? '¼×'
                             : renderScale === 2 ? '½×'
                             : (hiDPI ? 'HD' : 'SD');
        btnHidpi.title = 'render resolution: HD → SD → ½× → ¼× (click to cycle)';
        btnHidpi.setAttribute('aria-pressed', hiDPI ? 'true' : 'false');
        // Match the font scale to the effective DPR — that way one
        // glyph pixel maps to one CSS pixel regardless of HD/SD or
        // mobile/desktop. Round up so we stay legible.
        if (Module._SDL2_SetFontScale) {
          var scale = Math.max(1, Math.round(effectiveDpr()));
          Module._SDL2_SetFontScale(scale);
        }
        // resizeCanvasToWindow routes through Module._SDL2_RequestSize
        // → SDL_SetWindowSize, which both resizes the canvas DOM element
        // and fires SDL_WINDOWEVENT_SIZE_CHANGED so the demo thread
        // repaints at the new resolution.
        resizeCanvasToWindow();
      }
      function isFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
      }
      function applyFullscreenLabel() {
        btnFullscreen.textContent = isFullscreen() ? '✕' : '⛶';
      }

      btnMute.addEventListener('click', function() {
        muted = !muted;
        applyMute();
      });
      btnHidpi.addEventListener('click', function() {
        // Cycle HD → SD → ½× → ¼× → HD. The two low-res steps divide the
        // drawing buffer for perf (heavy scenes / editor on battery).
        if (hiDPI)                    { hiDPI = false; renderScale = 1; }
        else if (renderScale === 1)   { renderScale = 2; }
        else if (renderScale === 2)   { renderScale = 4; }
        else                          { renderScale = 1; hiDPI = true; }
        applyHidpi();
      });
      btnFullscreen.addEventListener('click', function() {
        if (isFullscreen()) {
          (document.exitFullscreen || document.webkitExitFullscreen).call(document);
        } else {
          var el = document.documentElement;
          (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
        }
      });
      document.addEventListener('fullscreenchange', applyFullscreenLabel);
      document.addEventListener('webkitfullscreenchange', applyFullscreenLabel);

      // Initial sync.
      applyHidpi();
      applyMute();
      applyFullscreenLabel();

      // ---- Auto-hide control bar -------------------------------------
      // Fade out after a couple seconds of no input. Cursor entering the
      // bottom 20% of the viewport (or any touch on mobile) brings it
      // back. Hovering the bar itself pauses the hide so the user has
      // time to click without playing whack-a-mole.
      var controlsEl = document.getElementById('controls');
      var hideTimer = null;
      function scheduleHide() {
        clearTimeout(hideTimer);
        hideTimer = setTimeout(function() {
          controlsEl.classList.add('idle');
        }, 2500);
      }
      function showControls() {
        controlsEl.classList.remove('idle');
        scheduleHide();
      }
      window.addEventListener('mousemove', function(e) {
        // Bottom-region trigger only — don't flash the bar every time the
        // viewer moves their cursor anywhere on screen during playback.
        if (e.clientY > window.innerHeight - Math.max(120, window.innerHeight * 0.2)) {
          showControls();
        }
      });
      window.addEventListener('touchstart', showControls, { passive: true });
      controlsEl.addEventListener('mouseenter', function() { clearTimeout(hideTimer); });
      controlsEl.addEventListener('mouseleave', scheduleHide);
      // Keep the bar up while a button is being clicked.
      controlsEl.addEventListener('click', showControls);
      // Show at boot so the controls are discoverable, then auto-hide.
      showControls();
    </script>

    <script>
      var editorSurfaces = [], editorSelected = null;
      // Object selection: editorGroup = array of surface names being edited
      // together, or null for single-surface mode. setProp/importFile fan
      // edits out over the group. The group is either a whole object's
      // surfaces (click an object/part row) or a CUSTOM multi-selection
      // (ctrl/cmd-click rows to toggle). editorGroupObj = the containing
      // object (scopes "invert"; null = scope is all surfaces).
      var editorObjects = [], editorGroup = null, editorGroupObj = null;
      // Build tag — single source of truth for the console log + status bar
      // (the h2 header carries its own literal copy). Bump with every shell
      // change so the user can confirm page freshness.
      var REV_BUILD = "b69";
      // editorStatus doubles as the status bar's "last message" feed: it sets
      // the transient one-liner AND refreshes the persistent strip.
      function editorStatus(t){
        var e=document.getElementById('editor-status'); if(e) e.textContent=t||'';
        if (t != null) window.editorLastMsg = t;
        updateStatusBar();
      }
      // Current-selection label for the status bar, set by the select paths
      // (surface / object-group / light) so the strip always names what the
      // props panel is editing.
      function setEditorSel(label){ window.editorSel = label || 'none'; updateStatusBar(); }
      // Dirty tally shared by the Save button + status bar (one place computes
      // it). Each field is a count of dirty items in that category.
      function editorDirtyCounts(){
        return { surf: Object.keys(collectDirty()).length, map: pendingMapCount(),
                 light: Object.keys(collectDirtyLights()).length,
                 obj: Object.keys(collectDirtyObjects()).length,
                 split: Object.keys(currentSplitsPayload()).length,
                 env: sceneEnvDirty() ? 1 : 0 };
      }
      // Repaint the persistent status strip. Cheap + idempotent; safe to call
      // from any event (selection/dirty/time/save/status). No-ops before the
      // bar exists in the DOM.
      function updateStatusBar(){
        var bar = document.getElementById('editor-statusbar'); if (!bar) return;
        var setT = function(id, v){ var e = document.getElementById(id); if (e) e.textContent = v; };
        setT('sb-scene', revEditorScene);
        var t = '—';
        try { if (Module && Module.editorSceneTime) t = String(Math.round(Module.editorSceneTime())); } catch(e){}
        setT('sb-time', t);
        setT('sb-sel', (window.editorSel && window.editorSel.length) ? window.editorSel : 'none');
        var c, total = 0;
        try {
          c = editorDirtyCounts();
          total = c.surf + c.map + c.light + c.obj + c.split + c.env;
        } catch(e){ c = null; }
        var dEl = document.getElementById('sb-dirty');
        if (dEl) {
          dEl.textContent = total
            ? (total + ' dirty')
            : 'clean';
          dEl.title = c && total
            ? [c.surf ? c.surf + ' surf' : '', c.map ? c.map + ' map' : '', c.light ? c.light + ' light' : '',
               c.obj ? c.obj + ' obj' : '', c.split ? c.split + ' split' : '', c.env ? 'scene env' : '']
                .filter(Boolean).join(', ')
            : 'no unsaved changes';
        }
        setT('sb-save', window.editorLastSave || '—');
        setT('sb-build', REV_BUILD);
        setT('sb-msg', window.editorLastMsg || '');
      }
      // ── Canvas fit: keep the render view out from under the panel ────────
      // Option (a): pure CSS. Reserve the panel's width on the right (via the
      // --rev-reserve custom property, read by the canvas max-width + body
      // padding rules) so the browser scales the render canvas to fit the FREE
      // region beside the panel, correct-aspect and fully visible, instead of
      // the panel covering its right edge. This is OPTION (b): the engine
      // framebuffer is RESIZED to the free region (resizeCanvasToWindow feeds
      // innerWidth-reserve into SDL2_RequestSize), so the canvas backing store
      // equals its displayed size — 1:1 device pixels, no browser downsample.
      // (The earlier option (a) left the backing at window size and CSS-scaled
      // it down, which nearest-neighbour-downsampled the high-frequency editor
      // passes — deferred-quarter checkerboard / grain / chromatic — into an
      // RGB moiré grid. Fixed.) Reserve is 0 (full width) when the panel is
      // hidden, collapsed, or floated away from the right edge, so a
      // moved/minimized panel never shrinks the view.
      function updateCanvasFit(){
        if (!revEditorMode) return;
        var panel = document.getElementById('editor-panel');
        var reserve = 0;
        if (panel && !panel.classList.contains('hidden') && !panel.classList.contains('collapsed')) {
          var r = panel.getBoundingClientRect();
          if (r.right >= window.innerWidth - 2)   // hugging the right edge
            reserve = Math.min(r.width, window.innerWidth * 0.6);
        }
        document.documentElement.style.setProperty('--rev-reserve', reserve + 'px');
        // Resize the ENGINE framebuffer to the free region (backing==display,
        // no downsample moiré). Panel show/collapse/dock are infrequent, so
        // an occasional EngineResize here is fine.
        resizeCanvasToWindow();
      }
      // Typing in panel inputs: Emscripten/SDL registers keyboard listeners on
      // window and preventDefault()s every key (they feed the engine's Keyboard[]
      // array), so an <input> never receives the character — the filter box was
      // untypeable. This capture-phase listener is registered BEFORE the wasm
      // runtime loads (the emscripten SCRIPT tag is below), so it runs first: when focus is
      // in a form field, stop the event from ever reaching SDL and let the
      // browser's default text editing happen.
      function editorTextEntryFocused(){
        var el = document.activeElement;
        if (!el) return false;
        if (el.tagName === 'TEXTAREA' || el.tagName === 'SELECT') return true;
        if (el.tagName !== 'INPUT') return false;
        // Only TEXT-ENTRY inputs capture the keyboard — range sliders, file
        // pickers and buttons don't (so WASD fly keys keep reaching SDL even
        // if the last click was on a slider).
        var t = (el.type || 'text').toLowerCase();
        return t === 'text' || t === 'number' || t === 'search' || t === 'email' || t === 'url';
      }
      if (revEditorMode) ['keydown','keyup','keypress'].forEach(function(t){
        window.addEventListener(t, function(e){
          if (editorTextEntryFocused())
            e.stopImmediatePropagation();   // no preventDefault — typing IS the default
        }, true);
      });
      // Greets isn't CurScene until it inits + first ticks, so poll editorGetSurfaces
      // until it returns a non-empty list (then it's safe to read/edit).
      function initEditorPanel(){
        console.log('[editor] panel init (build ' + REV_BUILD + '); orbit/zoom embind =',
                    typeof Module.editorOrbit, typeof Module.editorSetSurfaceProp);
        document.getElementById('editor-panel').classList.remove('hidden');
        document.body.classList.add('rev-editor');   // reserve panel width for the canvas
        updateStatusBar();   // paint the strip as soon as the panel shows
        updateCanvasFit();
        // ── Movable / collapsible tool stack ─────────────────────────────
        // Drag the header (h2) to move the panel anywhere; ▾/▸ collapses it
        // to just the header. Position + collapsed state persist per-browser
        // (localStorage). Double-click the header re-docks it top-right.
        (function(){
          var panel = document.getElementById('editor-panel');
          var h2 = panel.querySelector('h2');
          var LS = 'revEditorPanel';
          var st = {};
          try { st = JSON.parse(localStorage.getItem(LS) || '{}') || {}; } catch(e){}
          function save(){ try { localStorage.setItem(LS, JSON.stringify(st)); } catch(e){} }
          var caret = document.createElement('a');
          caret.href = '#'; caret.id = 'editor-collapse';
          caret.style.cssText = 'float:right;color:#9cf;text-decoration:none;font-size:12px;padding:0 6px;';
          caret.title = 'collapse / expand the editor tool stack (persists)';
          h2.appendChild(caret);
          function applyCollapsed(){
            panel.classList.toggle('collapsed', !!st.collapsed);
            caret.textContent = st.collapsed ? '▸' : '▾';
            updateCanvasFit();   // collapsed panel frees the reserved width
          }
          caret.onclick = function(e){
            e.preventDefault(); e.stopPropagation();
            st.collapsed = !st.collapsed; save(); applyCollapsed();
          };
          function applyPos(){
            if (typeof st.x === 'number' && typeof st.y === 'number'){
              // Clamp so the drag handle can never leave the viewport.
              var x = Math.min(Math.max(st.x, 60 - panel.offsetWidth), window.innerWidth - 60);
              var y = Math.min(Math.max(st.y, 0), window.innerHeight - 28);
              panel.style.left = x + 'px'; panel.style.top = y + 'px';
              panel.style.right = 'auto';
              panel.style.maxHeight = (window.innerHeight - Math.max(y, 0)) + 'px';
            } else {   // default dock: top-right, full-height scroll
              panel.style.left = ''; panel.style.top = '';
              panel.style.right = ''; panel.style.maxHeight = '';
            }
            updateCanvasFit();   // dock/undock changes the free region
          }
          h2.addEventListener('mousedown', function(e){
            // Header controls (scene <select>, the caret) keep their behavior.
            if (e.button !== 0 || e.target.tagName === 'SELECT' ||
                e.target.tagName === 'OPTION' || e.target.tagName === 'A') return;
            e.preventDefault();
            var r = panel.getBoundingClientRect();
            var dx = e.clientX - r.left, dy = e.clientY - r.top;
            // Capture-phase window listeners: they run BEFORE the panel's
            // stopPropagation guards and keep tracking when the cursor
            // crosses the canvas (canvas orbit stays off — its mode is only
            // armed by a mousedown on the canvas itself).
            function mv(ev){ st.x = ev.clientX - dx; st.y = ev.clientY - dy; applyPos(); }
            function up(){
              window.removeEventListener('mousemove', mv, true);
              window.removeEventListener('mouseup', up, true);
              save();
            }
            window.addEventListener('mousemove', mv, true);
            window.addEventListener('mouseup', up, true);
          });
          h2.addEventListener('dblclick', function(e){
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'A') return;
            delete st.x; delete st.y; save(); applyPos();
            editorStatus('tool stack re-docked (top-right)');
          });
          window.addEventListener('resize', applyPos);
          applyCollapsed(); applyPos();
        })();
        // Scene picker: navigating swaps ?scene= and reloads (the FLD +
        // sidecar live-fetch and scene init are boot-time).
        var ssel = document.getElementById('editor-scene-sel');
        ['greets','city','chase','fountain','crash','pbrtest'].forEach(function(sc){
          var o = document.createElement('option'); o.value = sc; o.textContent = sc;
          if (sc === revEditorScene) o.selected = true;
          ssel.appendChild(o);
        });
        ssel.onchange = function(){
          location.href = location.pathname + '?editor&scene=' + ssel.value;
        };
        editorStatus('loading ' + revEditorScene + '…');
        var tries = 0;
        var iv = setInterval(function(){
          tries++;
          var list = [];
          try { list = JSON.parse(Module.editorGetSurfaces()); } catch(e){}
          if (list.length){
            clearInterval(iv); editorSurfaces = list;
            // Pristine snapshot = values as loaded; "Save to LWO" sends only
            // props that differ from this (so untouched surfaces never get
            // their .lwo rewritten).
            editorPristine = {};
            list.forEach(function(s){ editorPristine[s.name] = JSON.parse(JSON.stringify(s)); });
            try {
              editorLights = JSON.parse(Module.editorGetLights());
              editorLightsPristine = {};
              editorLights.forEach(function(l){ editorLightsPristine[l.i] = JSON.parse(JSON.stringify(l)); });
            } catch(e){ console.warn('[editor] lights enumerate failed', e); }
            refreshObjects();
            editorStatus(list.length+' surfaces'); renderObjectList(); renderSurfaceList(); renderLightList(); updateSaveButton();
            // Objects (and lights) can lag the surface list: the engine
            // publishes CurScene MID-INIT (e.g. Initialize_City's panorama
            // bake), so this poll can land while the object tree isn't
            // enumerable yet. Surfaces retried until non-empty; objects were
            // fetched exactly ONCE — the "Objects panel empty in the browser,
            // fine natively" bug. Retry until they arrive (or give up loudly).
            if (!editorObjects.length) {
              console.warn('[editor] objects empty while ' + list.length +
                           ' surfaces present — retrying (scene still initializing?)');
              var otries = 0;
              var oiv = setInterval(function(){
                if (editorObjects.length || ++otries > 60) {
                  clearInterval(oiv);
                  if (!editorObjects.length)
                    console.warn('[editor] objects still empty after ' + otries +
                                 ' retries — check JSON.parse(Module.editorGetObjects()) in the console');
                  return;
                }

              cell.onmouseleave = function(){ cell.style.borderColor = '#333'; };
              if (e.preview) {
                var img = document.createElement('img');
                var u = URL.createObjectURL(e.preview); urls.push(u);
                img.src = u;
                img.style.cssText = 'width:100%;height:110px;object-fit:cover;border-radius:2px;background:#000;';
                cell.appendChild(img);
              } else {
                var ph = document.createElement('div');
                ph.textContent = 'no preview';
                ph.style.cssText = 'width:100%;height:110px;display:flex;align-items:center;justify-content:center;color:#555;background:#111;border-radius:2px;font-size:11px;';
                cell.appendChild(ph);
              }
              var nm = document.createElement('div');
              nm.textContent = e.name;
              nm.style.cssText = 'color:#cde;font-size:11px;margin-top:4px;word-break:break-all;';
              cell.appendChild(nm);
              var rl = document.createElement('div');
              rl.textContent = Object.keys(e.slots).sort().join(' ');
              rl.style.cssText = 'color:#697;font-size:9px;margin-top:2px;';
              cell.appendChild(rl);
              cell.onclick = function(){ close(); importPack(e.slots, e.name); };
              grid.appendChild(cell);
            });
            document.body.appendChild(ov);
          }
          var keys = Object.keys(dirs);
          if (!keys.length) { editorStatus('pack: no recognizable maps in folder'); return; }
          if (keys.length === 1) {
            // A single material folder — import it directly, as before.
            importPack(dirs[keys[0]], keys[0].split('/').pop() || '(folder)');
            return;
          }
          // Multiple material folders (a category dir / the whole library):
          // visual picker with each pack's intended preview render.
          var entries = keys.map(function(k){
            return { name: k.split('/').pop() || k, slots: dirs[k], preview: previewFor(k) };
          }).sort(function(a, b){ return a.name.localeCompare(b.name); });

        };
        pr.appendChild(pinp); imp.appendChild(pr);
        ['albedo','normal','height','roughness','ao','metallic'].forEach(function(role){
          var row = document.createElement('div'); row.className = 'prop-row';
          var lab = document.createElement('label'); lab.textContent = role; row.appendChild(lab);
          var inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
          inp.style.cssText = 'flex:1;min-width:0;font-size:10px;color:#bbb;';
          inp.onchange = function(){
            var file = inp.files && inp.files[0]; if (!file) return;
            editorStatus('importing ' + role + '…');
            importFile(role, file, function(ok){
              editorStatus(ok ? (role + ' imported: ' + file.name) : (role + ' import FAILED'));
              if (ok) refreshSurfacesAndProps(s.name);
            });
          };
          row.appendChild(inp);
          // Reset the role to its authored default: undoes live imports (incl.
          // the generated displacement, which lives in normal+height) AND the
          // sidecar override applied at load. The null tombstone makes Save
          // delete the sidecar line so the reset persists across reloads.
          var clr = document.createElement('button');
          clr.textContent = '✕';
          clr.title = 'reset ' + role + ' map to the authored default (removes the imported/generated override; Save persists the removal)';
          clr.style.cssText = 'flex:0 0 auto;font-size:10px;padding:0 6px;background:#411;color:#fbb;border:1px solid #633;border-radius:2px;cursor:pointer;';
          clr.onclick = function(){
            if (!Module.editorClearMap) { editorStatus('reset: engine build too old (no editorClearMap)'); return; }
            var names = editSurfNames(s.name), okAll = true;
            names.forEach(function(n){
              var ok = false;
              try { ok = Module.editorClearMap(n, role); }
              catch(e){ editorStatus('reset failed: ' + e); console.error('editorClearMap', e); okAll = false; return; }
              if (ok) (editorPendingMaps[n] = editorPendingMaps[n] || {})[role] = null;
              okAll = okAll && ok;
            });
            editorStatus(okAll ? (role + ' map reset to default — Save removes it from the sidecar')
                               : (role + ' reset FAILED (unknown surface/role?)'));
            refreshSurfacesAndProps(s.name);
            updateSaveButton();
          };
          row.appendChild(clr);
          imp.appendChild(row);
        });
        el.appendChild(imp);

        // ── Generate PBR maps FROM the albedo (client-side, live) ─────────
        // A generated map is just an import with synthesized bytes: each
        // button/knob computes pixels (editorEncode*), PNG-encodes them, and
        // hands the result to importFile — the exact same live-apply + Save
        // path as a hand-authored import. Knob drags re-generate live.
        var gen = document.createElement('div');
        gen.style.cssText = 'margin-top:8px;border-top:1px solid #333;padding-top:6px;';
        var gh = document.createElement('div'); gh.style.cssText = 'color:#fff;margin-bottom:4px;';
        gh.textContent = 'Generate maps from albedo'; gen.appendChild(gh);
        // Shared by the albedo-driven generators below AND the procedural
        // displacement block (which needs no albedo): per-surface knob state
        // + the slider/button builders.
        var gp = editorGenP(s.name);
        // Slider + numeric twin. oninput = live drag (debounced, no re-render);
        // release / number-box commit = final generate + panel refresh.
        function genSlider(label, min, max, step, initial, onLive, onCommit){
          var row = document.createElement('div'); row.className = 'prop-row';
          var lab = document.createElement('label'); lab.textContent = label; lab.style.flex = '0 0 74px'; row.appendChild(lab);
          var r = document.createElement('input'); r.type = 'range'; r.min = min; r.max = max; r.step = step; r.value = initial;
          var val = document.createElement('input'); val.type = 'number'; val.step = step; val.value = +(+initial).toFixed(3);
          val.style.cssText = 'background:#111;color:#9cf;border:1px solid #345;border-radius:2px;font-size:11px;padding:1px 2px;';
          r.oninput = function(){ var v = parseFloat(r.value); val.value = +v.toFixed(3); onLive(v); };
          r.onchange = function(){ onCommit(parseFloat(r.value)); };
          val.onchange = function(){ var v = parseFloat(val.value); if (isNaN(v)) return; r.value = v; onCommit(v); };
          row.appendChild(r); row.appendChild(val); return row;
        }
        function genButton(text, onClick){
          var b = document.createElement('button'); b.textContent = text;
          b.style.cssText = 'flex:1;background:#234;color:#ccf;border:1px solid #468;border-radius:3px;padding:3px;cursor:pointer;font-size:11px;';
          b.onclick = onClick; return b;
        }
        var genSrc = editorAlbedoSource(s.name);
        if (!genSrc){
          var noSrc = document.createElement('div'); noSrc.className = 'surf-tex';
          noSrc.textContent = 'no albedo on this surface — import an albedo (above) first, then generate';
          gen.appendChild(noSrc);
        } else {
          var srcNote = document.createElement('div'); srcNote.className = 'surf-tex'; srcNote.style.marginBottom = '4px';
          srcNote.textContent = 'source: ' + (genSrc.blob ? 'imported albedo (pending)' : genSrc.url);
          gen.appendChild(srcNote);
          var genTimers = {};
          // refresh=true → re-pull + re-render the panel so a freshly-added
          // map's dependent controls appear (normal G flip, un-dimmed
          // aoStrength/parallaxScale). Used for discrete actions (button /
          // knob release) only — never mid-drag, which would tear out the
          // slider being dragged. Live drags (refresh=false) rely on
          // importFile's own updateSaveButton().
          function runGen(role, makePixels, statusName, refresh){
            editorStatus('generating ' + statusName + '…');
            editorEnsureGen(s.name).then(function(c){
              var px = makePixels(c);
              var nm = s.name.replace(/[^A-Za-z0-9._-]+/g, '_') + '_' + role + '_gen.png';
              return editorPixelsToPngFile(px, c.W, c.H, nm);
            }).then(function(file){
              importFile(role, file, function(ok){
                editorStatus(ok ? (statusName + ' generated (' + role + ')') : (statusName + ' generate FAILED'));
                if (ok && refresh) refreshSurfacesAndProps(s.name);
              });
            }).catch(function(e){
              editorStatus('generate ' + statusName + ' failed: ' + (e && e.message || e));
            });
          }
          function schedule(role, makePixels, statusName){
            clearTimeout(genTimers[role]);
            genTimers[role] = setTimeout(function(){ runGen(role, makePixels, statusName, false); }, 130);
          }
          // NORMAL — bump strength (Sobel scale) + detail blur (pre-Sobel passes)
          (function(){
            function px(c){ return editorEncodeNormal(c, gp.nStrength, gp.nBlur); }
            var row = document.createElement('div'); row.className = 'prop-row';
            row.appendChild(genButton('Generate normal', function(){ runGen('normal', px, 'normal', true); }));
            gen.appendChild(row);
            gen.appendChild(genSlider('bump str', 0, 16, 0.1, gp.nStrength,
              function(v){ gp.nStrength = v; schedule('normal', px, 'normal'); },
              function(v){ gp.nStrength = v; runGen('normal', px, 'normal', true); }));
            gen.appendChild(genSlider('detail blur', 0, 12, 1, gp.nBlur,
              function(v){ gp.nBlur = Math.round(v); schedule('normal', px, 'normal'); },
              function(v){ gp.nBlur = Math.round(v); runGen('normal', px, 'normal', true); }));
          })();
          // HEIGHT — luminance → grayscale height, contrast + invert
          (function(){
            function px(c){ return editorEncodeHeight(c, gp.hContrast, gp.hInvert); }
            var row = document.createElement('div'); row.className = 'prop-row';
            row.appendChild(genButton('Generate height', function(){ runGen('height', px, 'height', true); }));
            var invl = document.createElement('label'); invl.style.cssText = 'flex:0 0 auto;margin-left:6px;font-size:10px;color:#aaa;cursor:pointer;';
            var invc = document.createElement('input'); invc.type = 'checkbox'; invc.checked = gp.hInvert; invc.style.verticalAlign = '-2px';
            invc.onchange = function(){ gp.hInvert = invc.checked; runGen('height', px, 'height', false); };
            invl.appendChild(invc); invl.appendChild(document.createTextNode(' invert'));
            row.appendChild(invl); gen.appendChild(row);
            gen.appendChild(genSlider('contrast', 0.2, 4, 0.05, gp.hContrast,
              function(v){ gp.hContrast = v; schedule('height', px, 'height'); },
              function(v){ gp.hContrast = v; runGen('height', px, 'height', true); }));
            var hn = document.createElement('div'); hn.className = 'surf-tex';
            hn.textContent = 'height shows as relief only with the parallax render knob ON (for visible bumps, generate a normal instead)';
            gen.appendChild(hn);
          })();
          // AO — cavity from the luminance/height field, strength + radius
          (function(){
            function px(c){ return editorEncodeAO(c, gp.aoStrength, gp.aoRadius); }
            var row = document.createElement('div'); row.className = 'prop-row';
            row.appendChild(genButton('Generate AO', function(){ runGen('ao', px, 'AO', true); }));
            gen.appendChild(row);
            gen.appendChild(genSlider('ao str', 0, 2, 0.05, gp.aoStrength,
              function(v){ gp.aoStrength = v; schedule('ao', px, 'AO'); },
              function(v){ gp.aoStrength = v; runGen('ao', px, 'AO', true); }));
            gen.appendChild(genSlider('ao radius', 1, 24, 1, gp.aoRadius,
              function(v){ gp.aoRadius = Math.round(v); schedule('ao', px, 'AO'); },
              function(v){ gp.aoRadius = Math.round(v); runGen('ao', px, 'AO', true); }));
            var an = document.createElement('div'); an.className = 'surf-tex';
            an.textContent = 'AO darkens the ambient term only — subtle in direct-lit scenes; raise aoStrength above to boost it';
            gen.appendChild(an);
          })();
        }
        // ── Procedural displacement (no albedo needed) ─────────────────────
        // "generate displacement": a tileable FBM value-noise height field
        // (seeded, knobs for scale/octaves/strength/seed) imported through the
        // SAME importFile path as an upload, as this surface's NORMAL map
        // (derived from the field with the engine's Sobel convention — that's
        // what drives glass-refraction relief) + HEIGHT map (the raw field,
        // for --parallax). Works with or without an existing albedo; the
        // engine resamples both to the albedo's texel layout on import.
        (function(){
          var ph = document.createElement('div');
          ph.style.cssText = 'color:#fff;margin:8px 0 4px;border-top:1px solid #2a2a33;padding-top:6px;';
          ph.textContent = 'Generate displacement (procedural)';
          gen.appendChild(ph);
          var dispTimer = null;
          function runDisp(refresh){
            editorStatus('generating displacement…');
            setTimeout(function(){   // let the status paint before the crunch
              try {
                var W = 512, H = 512;
                var L = editorFbmField(W, H, gp.dispScale, gp.dispOct, gp.dispSeed);
                // Pseudo gen-cache entry: the existing encoders consume it
                // exactly like an albedo-derived luminance field.
                var c = { W: W, H: H, lum: L, nBlur: -1, gx: null, gy: null };
                var np = editorEncodeNormal(c, gp.dispStrength, 0);
                var hp = editorEncodeHeight(c, 1, false);
                var nm = s.name.replace(/[^A-Za-z0-9._-]+/g, '_');
                Promise.all([
                  editorPixelsToPngFile(np, W, H, nm + '_disp_normal_gen.png'),
                  editorPixelsToPngFile(hp, W, H, nm + '_disp_height_gen.png')
                ]).then(function(files){
                  importFile('normal', files[0], function(okN){
                    importFile('height', files[1], function(okH){
                      editorStatus('displacement generated → normal ' + (okN ? 'ok' : 'FAILED') +
                                   ', height ' + (okH ? 'ok' : 'FAILED') +
                                   ' (scale ' + gp.dispScale + ', ' + gp.dispOct + ' oct, str ' +
                                   (+gp.dispStrength).toFixed(1) + ', seed ' + gp.dispSeed + ')');
                      if ((okN || okH) && refresh) refreshSurfacesAndProps(s.name);
                    });
                  });
                }).catch(function(e){ editorStatus('displacement generate failed: ' + (e && e.message || e)); });
              } catch(e){ editorStatus('displacement generate failed: ' + (e && e.message || e)); }
            }, 10);
          }
          function schedDisp(){ clearTimeout(dispTimer); dispTimer = setTimeout(function(){ runDisp(false); }, 250); }
          var brow = document.createElement('div'); brow.className = 'prop-row';
          brow.appendChild(genButton('Generate displacement', function(){ runDisp(true); }));
          gen.appendChild(brow);
          gen.appendChild(genSlider('noise scale', 1, 32, 1, gp.dispScale,
            function(v){ gp.dispScale = Math.round(v); schedDisp(); },
            function(v){ gp.dispScale = Math.round(v); runDisp(true); }));
          gen.appendChild(genSlider('octaves', 1, 8, 1, gp.dispOct,
            function(v){ gp.dispOct = Math.round(v); schedDisp(); },
            function(v){ gp.dispOct = Math.round(v); runDisp(true); }));
          gen.appendChild(genSlider('strength', 0, 16, 0.1, gp.dispStrength,
            function(v){ gp.dispStrength = v; schedDisp(); },
            function(v){ gp.dispStrength = v; runDisp(true); }));
          var srow = document.createElement('div'); srow.className = 'prop-row';
          var slab = document.createElement('label'); slab.textContent = 'seed'; slab.style.flex = '0 0 74px'; srow.appendChild(slab);
          var sinp = document.createElement('input'); sinp.type = 'number'; sinp.step = 1; sinp.value = gp.dispSeed;
          sinp.style.cssText = 'flex:0 0 64px;background:#111;color:#9cf;border:1px solid #345;border-radius:2px;font-size:11px;padding:1px 2px;';
          sinp.onchange = function(){ var v = parseInt(sinp.value, 10); if (!isNaN(v)) { gp.dispSeed = v; runDisp(true); } };
          srow.appendChild(sinp);
          var rb = genButton('reroll', function(){
            gp.dispSeed = (Math.random() * 1e6) | 0;
            sinp.value = gp.dispSeed;
            runDisp(true);
          });
          srow.appendChild(rb);
          gen.appendChild(srow);
          var dn = document.createElement('div'); dn.className = 'surf-tex';
          dn.textContent = 'tileable FBM noise → normal (+height) map; on refractive glass the normal drives the refraction relief';
          gen.appendChild(dn);
        })();
        // ── Generate SOLID metallic / roughness (uniform, no albedo) ────────
        // Metallic and roughness are UNIFORM per surface, so a CONSTANT-value
        // grayscale map is the right synthesis — no albedo needed (works on a
        // bare surface, like the displacement generator). Each button
        // synthesizes a flat value×255 PNG at the albedo's dims (or 512² with
        // no albedo — a constant image is dimension-independent and the engine
        // resamples aux maps to the albedo layout on import) and routes it
        // through the SAME importFile pipeline as a hand-authored map. Importing
        // 'metallic' auto-routes to env_refl + a probe re-bake natively
        // (Editor_ImportTexture's metallic branch), so the surface reflects the
        // room. Slider picks the value; the button imports (importing runs the
        // whole native pipeline incl. the probe re-bake, so it is button-driven,
        // not live-on-drag).
        (function(){
          var ph = document.createElement('div');
          ph.style.cssText = 'color:#fff;margin:8px 0 4px;border-top:1px solid #2a2a33;padding-top:6px;';
          ph.textContent = 'Generate solid metallic / roughness';
          gen.appendChild(ph);
          // Target dims per generate: albedo dims if this surface has one, else
          // 512² (constant image → dimension-independent; engine resamples anyway).
          function solidDims(){
            if (!editorAlbedoSource(s.name)) return Promise.resolve({ W: 512, H: 512 });
            return editorEnsureGen(s.name)
              .then(function(c){ return { W: c.W, H: c.H }; })
              .catch(function(){ return { W: 512, H: 512 }; });
          }
          function runSolid(role, value01, statusName){
            editorStatus('generating solid ' + statusName + '…');
            solidDims().then(function(d){
              var px = editorConstPixels(value01 * 255, d.W, d.H);
              var nm = s.name.replace(/[^A-Za-z0-9._-]+/g, '_') + '_' + role + '_solid.png';
              return editorPixelsToPngFile(px, d.W, d.H, nm);
            }).then(function(file){
              importFile(role, file, function(ok){
                editorStatus(ok ? ('solid ' + statusName + ' = ' + (+value01).toFixed(2) + ' generated (' + role + ')')
                                : ('solid ' + statusName + ' generate FAILED'));
                if (ok) refreshSurfacesAndProps(s.name);
              });
            }).catch(function(e){ editorStatus('generate solid ' + statusName + ' failed: ' + (e && e.message || e)); });
          }
          var mrow = document.createElement('div'); mrow.className = 'prop-row';
          mrow.appendChild(genButton('Generate solid metallic', function(){ runSolid('metallic', gp.metalVal, 'metallic'); }));
          gen.appendChild(mrow);
          gen.appendChild(genSlider('metalness', 0, 1, 0.01, gp.metalVal,
            function(v){ gp.metalVal = v; },
            function(v){ gp.metalVal = v; }));
          var rrow = document.createElement('div'); rrow.className = 'prop-row';
          rrow.appendChild(genButton('Generate solid roughness', function(){ runSolid('roughness', gp.roughVal, 'roughness'); }));
          gen.appendChild(rrow);
          gen.appendChild(genSlider('roughness', 0, 1, 0.01, gp.roughVal,
            function(v){ gp.roughVal = v; },
            function(v){ gp.roughVal = v; }));
          var mn = document.createElement('div'); mn.className = 'surf-tex';
          mn.textContent = 'uniform value maps (no albedo needed). Metallic → the surface reflects the room via the auto-baked env probe (env_refl auto-enables); pair with low roughness for mirror-metal.';
          gen.appendChild(mn);
        })();
        el.appendChild(gen);
      }

      // Camera orbit handled in JS on the canvas (SDL's in-browser mouse events
      // proved unreliable for this) → Embind editorOrbit/editorZoom. And the
      // panel stops its own mouse events from bubbling out, so a global SDL
      // listener can't eat slider drags and panel drags never orbit the camera.
      (function(){
        if (!revEditorMode) return;
        // left-drag = orbit, right-drag or shift+drag = pan, wheel = zoom,
        // left-CLICK (no drag) = pick the surface under the cursor.
        var mode = null, lastX = 0, lastY = 0, downX = 0, downY = 0, dragged = false;
        var downOnCanvas = false;   // THIS press started on the canvas
        canvasEl.addEventListener('mousedown', function(e){
          // Hand the keyboard back to the engine: a focused panel control
          // (slider / number box) would otherwise swallow the fly keys.
          if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
          // Grabbing the canvas takes the camera back from scene playback.
          if (window.editorSetScenePlaying) window.editorSetScenePlaying(false);
          mode = (e.button === 2 || e.shiftKey) ? 'pan' : 'orbit';
          lastX = downX = e.clientX; lastY = downY = e.clientY; dragged = false;
          downOnCanvas = true;
          e.preventDefault();
        });
        // Clears AFTER the canvas mouseup handler (the same event reaches the
        // canvas target before it bubbles to window).
        window.addEventListener('mouseup', function(){ mode = null; downOnCanvas = false; });
        window.addEventListener('mousemove', function(e){
          if (!mode) return;
          var dx = e.clientX - lastX, dy = e.clientY - lastY;
          lastX = e.clientX; lastY = e.clientY;
          if (Math.abs(e.clientX - downX) + Math.abs(e.clientY - downY) > 4) dragged = true;
          if (mode === 'pan')  { if (Module.editorPan)   Module.editorPan(dx, dy); }
          else                 { if (Module.editorOrbit) Module.editorOrbit(dx, dy); }
        });
        // Click position → engine-surface UV: undo the canvas letterbox with the
        // SAME math Wasm_PresentGL uses (Module.__floodTexW/H = engine surface).
        function canvasToEngineUV(e){
          var tw = Module.__floodTexW, th = Module.__floodTexH;
          if (!tw || !th) return null;
          var r = canvasEl.getBoundingClientRect();
          var cx = (e.clientX - r.left) * (canvasEl.width  / r.width);
          var cy = (e.clientY - r.top)  * (canvasEl.height / r.height);
          var srcAR = tw / th, canAR = canvasEl.width / canvasEl.height;
          var dx = 0, dy = 0, dw = canvasEl.width, dh = canvasEl.height;
          if (canAR > srcAR) { dw = (canvasEl.height * srcAR) | 0; dx = (canvasEl.width  - dw) >> 1; }
          else               { dh = (canvasEl.width  / srcAR) | 0; dy = (canvasEl.height - dh) >> 1; }
          var u = (cx - dx) / dw, v = (cy - dy) / dh;
          return (u < 0 || u > 1 || v < 0 || v > 1) ? null : { u: u, v: v };
        }
        function pickAt(e){
          if (!Module.editorPick) return null;
          var uv = canvasToEngineUV(e);
          if (!uv) return null;
          try { return Module.editorPick(uv.u, uv.v) || null; } catch (err) { return null; }
        }
        // Light under the cursor (authored index, matching editorGetLights'
        // "i"), or -1. Tried BEFORE the surface pick so a click near a light
        // flare selects the light; surfaces keep working when no light is near.
        function pickLightAt(e){
          if (!Module.editorPickLight) return -1;
          var uv = canvasToEngineUV(e);
          if (!uv) return -1;
          try {
            var r = Module.editorPickLight(uv.u, uv.v);
            return (typeof r === 'number') ? r : -1;
          } catch (err) { return -1; }
        }
        canvasEl.addEventListener('mouseup', function(e){
          // Releasing a PANEL slider drag with the cursor over the canvas used
          // to land here with stale dragged/down state from the PREVIOUS
          // canvas press and run a pick — hijacking the selection (usually
          // onto the floor) mid-edit. Only pick when the press began here.
          if (!downOnCanvas) return;
          if (dragged || e.button !== 0 || e.shiftKey) return;
          var li = pickLightAt(e);
          if (li >= 0 && selectLightFromPick(li)) return;
          var name = pickAt(e);
          if (!name) { editorStatus('pick: no surface here'); return; }
          // pick=object: promote the picked surface to its owning object so
          // the whole model (e.g. the mech) is selected/edited at once.
          var pickObj = document.getElementById('editor-pickobj');
          if (pickObj && pickObj.checked) {
            var o = editorObjects.find(function(x){ return x.surfaces.indexOf(name) >= 0; });
            if (o) { selectObject(o, /*alsoFocus=*/false); editorStatus('picked object: ' + o.name + ' (via ' + name + ')'); return; }
          }
          var s = editorSurfaces.find(function(x){ return x.name === name; });
          if (s) { selectSurface(s, /*alsoFocus=*/false); editorStatus('picked: ' + name); }
        });
        // Double-click = pick AND frame the orbit on it (light or surface).
        canvasEl.addEventListener('dblclick', function(e){
          var li = pickLightAt(e);
          if (li >= 0 && selectLightFromPick(li)) {
            var l = editorLights.find(function(x){ return x.i === li; });
            if (l && Module.editorFocusLight)
              Module.editorFocusLight(l.rawI !== undefined ? l.rawI : l.i);
            return;
          }
          var name = pickAt(e);
          if (name && Module.editorFocusSurface) Module.editorFocusSurface(name);
        });
        canvasEl.addEventListener('wheel', function(e){
          if (!Module.editorZoom) return;
          e.preventDefault();
          // Normalize: deltaMode 1 = lines (real mouse wheels on some
          // platforms) → ~33 px/line. Trackpad pinch arrives as ctrlKey
          // wheel events with SMALL fractional deltas — boost them so a
          // pinch spans a useful zoom range (matches browser page-zoom
          // feel, which uses ~exp(-delta*0.01)).
          var d = e.deltaY * (e.deltaMode === 1 ? 33 : 1);
          if (e.ctrlKey) d *= 7;
          Module.editorZoom(d);          // proportional → smooth on a trackpad
        }, { passive: false });
        canvasEl.addEventListener('contextmenu', function(e){ e.preventDefault(); });  // allow right-drag pan
        var panel = document.getElementById('editor-panel');
        ['mousedown','mousemove','mouseup','wheel','pointerdown','pointermove','click','contextmenu'].forEach(function(t){
          panel.addEventListener(t, function(e){ e.stopPropagation(); });
        });
      })();
    </script>
